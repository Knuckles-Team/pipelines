# pipelines runs the gate standard (reference/gate-standard.md) on itself.
# The shared `secrets`, `tests-fast` and `spec` hooks run as local hooks over
# the locked project environment, with the same `pipelines-hook <id>` entries
# consumers get (tests/hooks/test_catalogue.py holds the two in lockstep).
#
# Blocking: format, hygiene, secrets (commit); types, tests-fast, spec (push).
# Advisory gates run weekly in .github/workflows/advisory.yml and never block.
# `validate` is the on-demand repository report (manual stage only).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
# --- hygiene ---------------------------------------------------------------
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-merge-conflict
  - id: check-added-large-files
  - id: check-yaml
    # --unsafe: syntax check only, so MkDocs tags such as !ENV in the shared theme config parse.
    args: [--unsafe]
  - id: check-toml
  - id: check-json
# --- format ----------------------------------------------------------------
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # v0.17.1
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: local
  hooks:
  # --- secrets ---------------------------------------------------------------
  - id: secrets
    name: Secrets and identity - credentials, host/identity data, commit identities
    entry: uv run --frozen --quiet pipelines-hook secrets
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-commit, pre-push]
  # --- types -----------------------------------------------------------------
  - id: types
    name: Types (mypy)
    entry: uv run --frozen --quiet mypy pipelines_hooks
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push, manual]
  # --- tests-fast ------------------------------------------------------------
  - id: tests-fast
    name: Fast tests - only the tests the pushed diff affects (120 s cap)
    entry: uv run --frozen --quiet pipelines-hook tests-fast
    args: [--src-root, pipelines_hooks]
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push]
  # --- spec ------------------------------------------------------------------
  - id: spec
    name: Spec - standard, decomposition, generated status freshness and Spec trailers
    entry: uv run --frozen --quiet pipelines-hook spec
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-push, manual]
  # --- on-demand report (not a blocking stage) -------------------------------
  - id: validate
    name: Repository validation
    entry: uv run --offline --no-sync --frozen --no-python-downloads --quiet pipelines-hook validate
    language: system
    pass_filenames: false
    always_run: true
    verbose: true
    stages: [manual]
  - id: no-legacy-concepts
    name: No legacy numeric-pillar concept markers
    entry: uv run --frozen --quiet pipelines-hook no-legacy-concepts
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]

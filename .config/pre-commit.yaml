# pipelines runs the gate standard (reference/gate-standard.md) on itself.
# The shared `secrets`, `tests-fast` and `spec` hooks run as local hooks over
# the locked project environment, with the same `pipelines-hook <id>` entries
# consumers get (tests/hooks/test_catalogue.py holds the two in lockstep).
#
# Blocking: format, hygiene, secrets (commit); types, tests-fast, spec (push).
# Advisory gates run weekly in .github/workflows/advisory.yml and never block.
# `validate` is the on-demand repository report (manual stage only).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
# --- hygiene ---------------------------------------------------------------
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-merge-conflict
  - id: check-added-large-files
  - id: check-yaml
    # --unsafe: syntax check only, so MkDocs tags such as !ENV in the shared theme config parse.
    args: [--unsafe]
  - id: check-toml
  - id: check-json
# --- format ----------------------------------------------------------------
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # v0.17.1
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: local
  hooks:
  # --- pages theme ------------------------------------------------------------
  # The tag-only Pages deploy verifies the generated theme files; check them on
  # every change to the theme or the pages tree so drift fails the PR, not the release.
  - id: pages-theme-sync
    name: Shared Pages theme - generated files are in sync
    entry: python3 scripts/sync_mkdocs_theme.py check --root . --source-root . --content-source pages
    language: system
    pass_filenames: false
    files: ^(pages/|templates/mkdocs-theme/|scripts/sync_mkdocs_theme\.py$)
  # --- constitution ------------------------------------------------------------
  # The constitution renders its limits table and its gate lists from the real
  # configs; drift in either direction fails the change that caused it.
  - id: constitution
    name: Constitution - generated sections match the gate configuration
    entry: uv run --frozen --quiet python scripts/constitution.py --check
    language: system
    pass_filenames: false
    files: ^(\.specify/memory/constitution\.md|scripts/constitution\.py|pyproject\.toml|\.python-version|\.pre-commit-hooks\.yaml|\.config/(kiss|validation)\.toml|pipelines_hooks/(gate_sets\.toml|complexity/__init__\.py|clones/contract\.py|ci_replica/fast_tests\.py|ste/scan\.py)|templates/workflows/ci\.yml|\.github/workflows/connector_pr_pipeline\.yml)$
  # --- secrets ---------------------------------------------------------------
  - id: secrets
    name: Secrets and identity - credentials, host/identity data, commit identities
    entry: uv run --frozen --quiet pipelines-hook secrets
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-commit, pre-push]
  - id: source-path-portability
    name: Source path portability - tracked package paths are cross-platform legal
    entry: uv run --frozen --quiet pipelines-hook source-path-portability
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-commit, pre-push]
  - id: prompt-format
    name: Prompt JSON/Pydantic stable disk format and semantic roundtrip
    entry: uv run --frozen --quiet pipelines-hook prompt-format
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-commit, pre-push]
  - id: skill-grade
    name: Deterministic skill quality grading with snapshot-bound evidence
    entry: uv run --frozen --quiet pipelines-hook skill-grade
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-commit, pre-push]
  - id: test-layout
    name: Test layout independence - isolated order and fixture inventory
    entry: uv run --frozen --quiet pipelines-hook test-layout
    language: system
    pass_filenames: false
    files: ^\.config/test-layout\.(json|toml)$
    require_serial: true
    stages: [pre-push, manual]
  # --- types -----------------------------------------------------------------
  - id: types
    name: Types (mypy)
    entry: uv run --frozen --quiet mypy pipelines_hooks
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push, manual]
  # --- tests-fast ------------------------------------------------------------
  - id: tests-fast
    name: Fast tests - only the tests the pushed diff affects (120 s cap)
    entry: uv run --frozen --quiet pipelines-hook tests-fast
    args: [--src-root, pipelines_hooks]
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push]
  # --- spec ------------------------------------------------------------------
  - id: spec-templates
    name: Spec templates - .specify/templates equals the vended pipelines templates
    entry: uv run --frozen --quiet pipelines-hook spec-templates
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push]
  - id: spec
    name: Spec - standard, decomposition, generated status freshness and Spec trailers
    entry: uv run --frozen --quiet pipelines-hook spec
    language: system
    pass_filenames: false
    always_run: true
    require_serial: true
    stages: [pre-push, manual]
  - id: project-version-sync
    name: Project version sync - metadata, source and documentation agree
    entry: uv run --frozen --quiet pipelines-hook project-version-sync
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push, manual]
  # --- on-demand report (not a blocking stage) -------------------------------
  - id: validate
    name: Repository validation
    entry: uv run --offline --no-sync --frozen --no-python-downloads --quiet pipelines-hook validate
    language: system
    pass_filenames: false
    always_run: true
    verbose: true
    stages: [manual]
  - id: no-legacy-concepts
    name: No legacy numeric-pillar concept markers
    entry: uv run --frozen --quiet pipelines-hook no-legacy-concepts
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]
  - id: lockfile-version-mirrors
    name: Lock artifact version mirrors
    entry: uv run --frozen --quiet pipelines-hook lockfile-version-mirrors
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]

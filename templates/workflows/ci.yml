name: CI

# Copy to .github/workflows/ci.yml (reference/ci-standard.md). The caller job
# `ci-required` (check name `CI required`) is the one required status check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Caller-side concurrency: PR runs cancel superseded runs. Main runs never
# cancel a running build (only a queued one is replaced), so every landed
# train gets a complete verdict.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('main-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    # The job classifies the diff itself: a spec or docs only pull request runs
    # only the spec gate set on the touched files (reference/ci-standard.md).
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main

  full:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/main_pipeline.yml@main
    with:
      backward-python: "3.12"

  # Repo-specific PR jobs (builds, journeys, container builds) go here, Python 3.14
  # only. Gate them on the shared change scope and add them to `ci-required` needs:
  #
  # scope:
  #   if: github.event_name == 'pull_request'
  #   permissions:
  #     contents: read
  #   uses: Knuckles-Team/pipelines/.github/workflows/change_scope.yml@main
  # journeys:
  #   needs: scope
  #   if: needs.scope.outputs.scope != 'spec'
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   steps:
  #     - run: echo "repo-specific job; skipped (not applicable) on a spec/docs-only change"

  ci-required:
    name: CI required
    if: always()
    needs: [gates, full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on any failed or cancelled job (skipped is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "::error::a required job ended $r"; exit 1;; esac
          done

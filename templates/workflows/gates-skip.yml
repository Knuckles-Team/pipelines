name: Gates skip

# Companion of a caller whose gates workflow uses paths-ignore: a docs/spec-only
# change skips the real workflow, so this one reports the same required check
# name as a success and branch protection never waits on it. The `paths:` list
# is the exact inverse of the caller's `paths-ignore:`.
# A caller job `gates` that uses gates_pipeline.yml reports the check
# `gates / gates` (caller job name / reusable job name). This job reports the
# same name, so one required check covers code PRs and docs/spec-only PRs.

on:
  pull_request:
    paths:
      - specs/**
      - docs/**
      - '**/*.md'
      - plans/**
      - LICENSE

permissions:
  contents: read

concurrency:
  group: pr-gates-skip-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates / gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "docs/spec-only change; the code gates do not apply"

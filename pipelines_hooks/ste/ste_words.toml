# EG-STE-Lite wordlist: the machine-readable half of the standard.
#
# Read flat by words.py. Every key except [banned] is a top-level value;
# [banned] is the only table (term -> fix) and must stay last, since a TOML
# table header captures all following keys until the next header.
#
#   general           - plain-English vocabulary, advisory context only.
#   banned            - term -> fix; whole-word, case-insensitive, failing.
#   modal             - hedging modals, failing (RFC-2119: must/should/may).
#   modal_advisory    - capability modal "can", advisory.
#   fuzzy             - fuzzy quantifiers, failing (state a measured value,
#                       or tag with `measured: ~N`).
#   fuzzy_advisory    - "some", advisory.
#   person            - first/second person, failing (name the actor).
#   idioms            - idiom phrases, failing.
#   cluster           - synonym pairs; two or more members of one cluster in
#                       the same file is one failing finding.
#   abbreviations     - tokens that must not split sentences.
#   passive_allowlist - past participles the passive heuristic ignores.


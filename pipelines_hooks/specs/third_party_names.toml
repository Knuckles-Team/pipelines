# First-party product names are platform vocabulary, even when a name also
# appears in a third-party corpus. They are kept separate from the denylist so
# the checker models ownership explicitly rather than carrying a one-off
# repository allowance.
[own]
terms = [
  "Arbora",
  "Axil",
  "Medulla",
  "Meristem",
  "Overstory",
  "Scion",
  "Tuig",
]

# A connector exists to talk to its own target system, so its specs may name it.
# Keys are repository names as resolved from the origin remote.
[allow]
langfuse-agent = ["Langfuse"]
vector-mcp = ["Qdrant"]

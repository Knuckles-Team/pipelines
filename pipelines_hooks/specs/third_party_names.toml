# Third-party product and project names that spec text must not contain
# (PIPE-GATES-R005, reference/spec-standard.md "Own words").
#
# Spec text describes our own capability by intent. Comparisons, inspirations
# and named vendors belong in workspace plans/ notes, never in specs/.
#
# Not listed, and therefore always allowed: open standards and protocols
# (OWL, RDF, SPARQL, SHACL, OpenTelemetry, OIDC, OAuth, MCP, A2A, the git wire
# protocol, the Bolt protocol, the PostgreSQL wire protocol), and the systems a
# platform adapter integrates as a data source.
#
# Matching is case-insensitive on whole words. Text inside inline code spans,
# fenced code blocks, URLs and Markdown link targets is ignored. An
# all-lowercase match of a capitalized term is one of our identifiers (the
# `langfuse` connector ID); a term spelled in lowercase here is an identifier
# only when glued to identifier punctuation (`-`, `_`, `.`, `/`).


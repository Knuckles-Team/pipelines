# Shared, repository-agnostic quality gates. Every hook runs `pipelines-hook <gate>`
# (pipelines_hooks.cli); per-repository inputs live in the consumer's
# pyproject.toml [tool.pipelines_hooks] table, never in these definitions.
# Exit codes: 0 clean, 1 findings, 2 the gate could not run.
#
# Consumers pin `rev:` to a full commit SHA and choose each hook's stages.
# Native scanners (cccc, kiss, dupehound, jscpd) must already be installed at
# the pinned versions; hooks never install them.

# --- complexity (cccc 1.6.0) ------------------------------------------------
- id: complexity-staged
  name: Complexity (cccc) - no new or worsened function over cyclomatic 10 / cognitive 15
  entry: pipelines-hook complexity-staged
  language: python
  pass_filenames: false
  always_run: true
  require_serial: true
- id: complexity-census
  name: Complexity census (cccc) - absolute zero outside the terms of acceptance
  entry: pipelines-hook complexity-census
  language: python
  pass_filenames: false
  always_run: true
  require_serial: true
# --- KISS (0.4.10) ----------------------------------------------------------
- id: kiss-staged
  name: KISS - staged Python/Rust, diff-scoped
  entry: pipelines-hook kiss-staged
  language: python
  pass_filenames: false
  always_run: true
  require_serial: true
- id: kiss-census
  name: KISS census - every tracked file plus orphan modules, enforced
  entry: pipelines-hook kiss-census

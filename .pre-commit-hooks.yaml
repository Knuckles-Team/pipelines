# --- security, privacy, supply chain ---------------------------------------
- id: secret-history
  name: Credential-shaped content in the unpublished commit range
  entry: pipelines-hook secret-history
  language: python
  pass_filenames: false
  always_run: true
- id: security-sanitizer
  name: Security and garbage sanitizer
  entry: pipelines-hook security-sanitizer
  language: python
  pass_filenames: false
  always_run: true
- id: tracked-privacy
  name: Tracked artifacts contain no host-specific data, local or model identities

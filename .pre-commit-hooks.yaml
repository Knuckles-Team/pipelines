# Affected tests only under a hard 120 s cap (CI-STANDARD pre-push); the base is
# pre-commit's --from-ref (PRE_COMMIT_FROM_REF). FULL/NONE run nothing locally.
- id: fast-tests
  name: "DEPRECATED (fast-tests): Fast tests - only the tests the pushed diff affects (120 s cap)"
  entry: pipelines-hook fast-tests
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-push]

# uv.lock agrees with pyproject.toml; verifies only, never rewrites (PRECOMMIT standard).
- id: uv-lock-check
  name: uv.lock is current (uv lock --check; never mutates)
  entry: pipelines-hook uv-lock-check
  language: python
  pass_filenames: false
  files: (^|/)(pyproject\.toml|uv\.lock)$
  stages: [pre-push]

# One-command setup and the standard AGENTS.md section (PIPE-CONNSPEC-R175); warn level.

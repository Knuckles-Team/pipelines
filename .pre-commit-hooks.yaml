# Shared, repository-agnostic quality gates. Every hook runs `pipelines-hook <gate>`
# (pipelines_hooks.cli); per-repository inputs live in the consumer's
# pyproject.toml [tool.pipelines_hooks] table, never in these definitions.
# Exit codes: 0 clean, 1 findings, 2 the gate could not run.
#
# Consumers reference `rev: main`. RELEASE readiness inherits manual
# staging here; do not duplicate/override its policy in consumers.
# Native scanners (cccc, kiss, dupehound, jscpd) must already be installed at
# the pinned versions (scripts/install_scanners.sh); hooks never install them.
# kiss must be the pinned fork build (pipelines_hooks/core/kiss_fork.py), proven
# by a behavioural probe. A gate whose scanner or sibling checkout is absent
# fails closed (exit 2) when $CI is set; locally it prints
# `SKIPPED (<gate>): <reason>; run scripts/bootstrap.sh [--scanners]` and exits 0.

# --- the gate standard (reference/gate-standard.md) --------------------------
# Consumers reference only these three ids from this repository, plus the
# upstream `format` (ruff), `hygiene` (pre-commit-hooks) and `types` (mypy or
# clippy) hooks the standard names. Every hook below the DEPRECATED marker is
# kept only until no repository references it; the advisory ones run in the
# weekly advisory workflow (.github/workflows/advisory_pipeline.yml) instead.
- id: secrets
  name: Secrets and identity - credentials, host/identity data, commit identities
  entry: pipelines-hook secrets
  language: python
  pass_filenames: false
  always_run: true
  require_serial: true
  stages: [pre-commit, pre-push]
- id: tests-fast
  name: Fast tests - only the tests the pushed diff affects (120 s cap)
  entry: pipelines-hook tests-fast
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-push]
- id: spec
  name: Spec - standard, decomposition, generated status freshness and Spec trailers
  entry: pipelines-hook spec
  language: python
  pass_filenames: false
  always_run: true
  require_serial: true
  stages: [pre-push, manual]


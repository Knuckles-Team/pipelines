<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Architecture story · local study</title>
<link rel="stylesheet" href="architecture-theme.css"><style>
:root{color-scheme:light;--ink:var(--fg);--sub:var(--muted);--verified:var(--s-verified);--landed:var(--s-landed);--specified:var(--s-specified);--retired:var(--s-retired);--paper:var(--sheet)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);min-height:100vh}main{max-width:1240px;margin:auto;padding:32px}header{display:flex;align-items:center;gap:24px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}small,.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}select,button{font:inherit;color:inherit;border:1px solid var(--line);background:transparent;border-radius:8px;min-height:44px;padding:8px 12px;cursor:pointer}button:hover,select:hover{background:var(--button-hover)}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.crumbs{margin:24px 0;display:flex;flex-wrap:wrap;gap:8px}.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:end}.hero h1{font-size:clamp(30px,5vw,58px);line-height:1.05;letter-spacing:-.045em;margin:10px 0 20px}.purpose{max-width:65ch;color:var(--sub);font-size:17px}.summary{padding-bottom:12px}.number{font-size:42px;letter-spacing:-.04em}.statusband{display:flex;height:10px;width:100%;gap:3px;margin:12px 0}.statusband span{min-width:1px}.VERIFIED{background:var(--verified)}.LANDED{background:var(--landed)}.SPECIFIED{background:var(--specified)}.RETIRED{background:var(--retired)}.RECORDED{background:var(--sub)}.legend{display:flex;gap:8px 18px;flex-wrap:wrap;color:var(--sub);font-size:13px}.legend i{display:inline-block;width:9px;height:9px;margin-right:5px}.sectionhead{display:flex;justify-content:space-between;gap:20px;align-items:baseline;border-top:1px solid var(--line);margin:28px 0 12px;padding-top:18px}.sectionhead h2{font-size:18px;margin:0}.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 42px}.part{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:20px;align-items:center;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;padding:14px 0;width:100%;min-height:72px}.part strong{font-size:16px;font-weight:550;display:block}.part .role{font-size:13px;color:var(--sub)}.part .statusband{height:5px;margin:5px 0}.part .measure{text-align:right;font-size:12px;color:var(--sub)}.connections{display:flex;gap:12px;flex-wrap:wrap}.connections button{border-radius:0;border:0;border-left:2px solid var(--line);text-align:left}.connections small{letter-spacing:0;text-transform:none;display:block}.leaf{padding:20px 0;font-size:18px;max-width:70ch}.proof{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.proof article{border-top:3px solid var(--line);padding-top:12px}.proof h3{font-size:15px}.proof a{color:var(--ink);overflow-wrap:anywhere}.note{font-size:13px;color:var(--sub);margin:14px 0}.scope{font-size:13px;color:var(--sub)}footer{border-top:1px solid var(--line);margin-top:30px;padding-top:14px;color:var(--sub);font-size:12px}@media(max-width:680px){main{padding:18px}.hero,.map,.proof{grid-template-columns:1fr}.hero{gap:10px}.part{gap:12px;grid-template-columns:minmax(0,1fr) 80px}.hero h1{font-size:36px}.purpose{font-size:15px}.sectionhead{align-items:start;flex-direction:column;gap:4px}}@media(forced-colors:active){body{background:Canvas;color:CanvasText}.statusband{border:1px solid CanvasText}.statusband span{background:CanvasText;border:1px solid Canvas}.legend i{border:1px solid CanvasText}}

/* The evidence mosaic is discrete: one visible tile is exactly one unique requirement. */
.mosaic{display:flex;flex-wrap:wrap;gap:24px 28px;align-items:flex-start;padding:8px 0 18px}.family{min-width:180px;max-width:100%;flex:1 1 240px}.family summary{cursor:pointer;min-height:44px;border-bottom:1px solid var(--line);padding:9px 0;font-size:13px;overflow-wrap:anywhere}.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:4px;padding:12px 0;max-width:360px}.tile{height:13px;min-width:13px;border-radius:2px;display:block;border:1px solid var(--line)}.tile:hover,.tile:focus-visible{outline:2px solid var(--ink);outline-offset:2px}.family .rows{padding:0;list-style:none}.family .rows li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.family a{color:inherit}.tile-caption{font-size:12px;color:var(--sub)}.fan{position:relative;display:grid;grid-template-columns:33% 12% 10% 12% 33%;align-items:center;padding:16px 0;min-height:190px}.ports{display:flex;flex-direction:column;justify-content:space-around;gap:10px;z-index:1}.ports.out{grid-column:5}.ports button{border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;padding:8px 0;min-height:58px;overflow-wrap:anywhere}.ports small{letter-spacing:0;text-transform:none;display:block}.spine{grid-column:3;text-align:center;overflow-wrap:anywhere;font-size:13px;z-index:1}.spine:before{content:'';display:block;width:6px;height:40px;margin:0 auto 10px;background:var(--landed)}.fan svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;fill:none;stroke:var(--line);stroke-width:1.5}.archetype{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}.mosaic-key{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:13px}.mosaic-key b{height:13px;width:13px;background:var(--specified);display:inline-block}.example-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}@media(pointer:coarse){.tile{min-height:44px}.tiles{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}}@media(max-width:680px){.fan{display:flex;flex-direction:column;align-items:stretch;gap:12px}.fan svg{display:none}.spine{border-left:3px solid var(--landed);padding-left:12px;text-align:left}.spine:before{display:none}.ports button{width:100%}.family{flex-basis:100%}.tiles{max-width:none}}@media(forced-colors:active){.tile{forced-color-adjust:none;background:Canvas!important;border:1px solid CanvasText}.fan svg{stroke:CanvasText}}
.family-clusters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.family-clusters button{text-align:left;border:0;border-left:3px solid var(--line);border-radius:0;overflow-wrap:anywhere}.family-clusters strong,.family-clusters span{display:block}.family-clusters span{font-size:12px;color:var(--sub)}.family-clusters button[aria-pressed=true]{border-color:var(--verified);background:var(--selection)}.pager{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0;font-size:13px}.pager button:disabled{opacity:.45;cursor:default}.focused-family{border-top:1px solid var(--line);padding-top:18px}.focused-family .tiles{max-width:460px}.focused-family .rows{padding-left:20px}.focused-family summary{min-height:44px;cursor:pointer;padding:10px 0}#family-focus{max-width:100%;white-space:normal}@media(max-width:680px){.family-clusters{grid-template-columns:1fr 1fr}.family-clusters button{font-size:13px}}
/* Composition layout aliases source tokens; no second palette or font stack. */
body{background-image:linear-gradient(155deg,var(--ocean-top),var(--ocean-bottom));background-attachment:fixed}
main{position:relative;z-index:1;background:var(--glass-reading);border:1px solid var(--glass-edge);border-radius:22px;box-shadow:var(--glass-shadow);margin:20px auto}
button,select{background:var(--button-neutral);font-family:var(--font-body)}button:hover,select:hover{background:var(--button-hover)}select option{background:var(--surface);color:var(--fg)}.part,.ports button,.family-clusters button{background:transparent}.part:hover,.ports button:hover,.family-clusters button:hover{background:var(--button-hover)}
.study-notice{font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:14px}.map{border:1px solid var(--glass-edge);padding:12px 18px;border-radius:16px;background:linear-gradient(140deg,var(--node-top),var(--node-bottom))}
@media(max-width:680px){main{margin:8px;border-radius:18px}.map{padding:8px 12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(prefers-reduced-transparency:reduce){body{background:var(--bg)}main{background:var(--surface);box-shadow:none}.ocean-scene{display:none}}
@media(forced-colors:active){body,main,.map,button,select{background:Canvas;color:CanvasText}.ocean-scene{display:none}main,.map{box-shadow:none;border-color:CanvasText}}
</style><div class="ocean-scene" aria-hidden="true"><span class="ocean-wave"></span><span class="ocean-wave"></span><span class="ocean-wave"></span></div><main><p class="study-notice">Preview-only composition study · not the live explorer. The central capability matrix stands in for the existing map; production would retain its original geometry, arrows and zoom.</p><header><div><small>Architecture / visual story study</small><div>One language, every level</div></div><label>Explore <select id="pick" aria-label="Select architecture part"></select></label></header><div class="example-links"><button data-example="arbora">Arbora · hub</button><button data-example="webui">Overstory · container</button><button data-example="eg.decide">Decision Engine · hub</button><button data-example="webui.api.gen">Generated Client · leaf</button></div><nav class="crumbs" id="crumbs" aria-label="Containment path"></nav><div id="story"></div><footer id="foot"></footer></main>
<script>
const DATA=/*STORIES*/;const S=DATA.stories;const KNOWN=['VERIFIED','LANDED','SPECIFIED','RETIRED'];const ST=[...KNOWN,...new Set(Object.values(S).flatMap(n=>Object.keys(n.evidence.subtreeStatuses)).filter(k=>!KNOWN.includes(k)))];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const band=e=>`<div class="statusband" aria-hidden="true">${ST.filter(k=>e.subtreeStatuses[k]).map(k=>`<span class="${KNOWN.includes(k)?k:'RECORDED'}" style="flex:${e.subtreeStatuses[k]}"></span>`).join('')}</div>`;
const legend=e=>`<div class="legend">${ST.filter(k=>e.subtreeStatuses[k]).map(k=>`<span><i class="${KNOWN.includes(k)?k:'RECORDED'}" aria-hidden="true"></i>${e.subtreeStatuses[k]} ${esc(k.toLowerCase())}</span>`).join('')}</div>`;
let pendingFocus=false;const go=id=>{pendingFocus=true;location.hash=encodeURIComponent(id)};
document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>go(b.dataset.example));
const pick=document.querySelector('#pick');Object.values(S).forEach(n=>{let o=document.createElement('option');o.value=n.id;o.textContent=n.title+' · '+n.id;pick.append(o)});pick.onchange=()=>go(pick.value);
const source=r=>`https://github.com/Knuckles-Team/${encodeURIComponent(r.repo)}/blob/HEAD/specs/${encodeURIComponent(r.family)}/requirements.md`;
const tile=r=>`<a class="tile ${KNOWN.includes(r.status)?r.status:'RECORDED'}" href="${source(r)}" target="_blank" rel="noopener" title="${esc(r.id+' · '+r.status+' · '+r.title)}" aria-label="${esc(r.id+' · '+r.status+' · '+r.title)}"></a>`;
const mosaicState={};
function mosaic(n){const groups=Object.entries(n.families);if(!groups.length)return '<p class="leaf">No mapped requirement tiles. The purpose, ancestry and recorded interfaces remain the story.</p>';
const state=mosaicState[n.id]||(mosaicState[n.id]={family:groups[0][0],clusterPage:0,rowPage:0});const [name,ids]=groups.find(([key])=>key===state.family)||groups[0];const start=state.rowPage*64,rows=ids.slice(start,start+64).map(key=>DATA.rowIndex[key]);const pageGroups=groups.slice(state.clusterPage*12,state.clusterPage*12+12);
return `<div class="mosaic-key"><b aria-hidden="true"></b>One tile = one unique mapped requirement. Family summaries are explicitly aggregated, not row tiles.</div><p><label>Focus family <select id="family-focus">${groups.map(([key,keys])=>`<option value="${esc(key)}" ${key===name?'selected':''}>${esc(key)} · ${keys.length} rows</option>`).join('')}</select></label></p><div class="family-clusters">${pageGroups.map(([key,keys])=>`<button data-cluster="${esc(key)}" aria-pressed="${key===name}"><strong>${esc(key.split('/').slice(1).join('/'))}</strong><span>${keys.length} unique rows · family aggregate</span></button>`).join('')}</div><div class="pager"><button data-cluster-step="-1" ${state.clusterPage===0?'disabled':''}>Previous families</button><span>Families ${state.clusterPage*12+1}–${state.clusterPage*12+pageGroups.length} of ${groups.length}</span><button data-cluster-step="1" ${(state.clusterPage+1)*12>=groups.length?'disabled':''}>Next families</button></div>
<div class="focused-family"><strong>${esc(name)}</strong><p class="tile-caption">Requirement tiles ${start+1}–${start+rows.length} of ${ids.length}. This page is a source-ordered slice, not a representative status sample.</p><div class="tiles">${rows.map(tile).join('')}</div><div class="pager"><button data-row-step="-1" ${start===0?'disabled':''}>Previous requirements</button><span>${ids.length} total in family</span><button data-row-step="1" ${start+64>=ids.length?'disabled':''}>Next requirements</button></div><details id="tile-list"><summary>Read these ${rows.length} requirement IDs and states</summary><ul class="rows"></ul></details><p class="scope">All mapped rows remain reachable by family and requirement pages; links open the recorded source family.</p></div>`}
function bindMosaic(n){let state=mosaicState[n.id];if(!state)return;const refresh=()=>{document.querySelector('#mosaic-area').innerHTML=mosaic(n);bindMosaic(n)};const choose=key=>{state.family=key;state.rowPage=0;refresh();document.querySelector('#family-focus').focus()};const select=document.querySelector('#family-focus');if(select)select.onchange=()=>choose(select.value);document.querySelectorAll('[data-cluster]').forEach(b=>b.onclick=()=>choose(b.dataset.cluster));document.querySelectorAll('[data-cluster-step]').forEach(b=>b.onclick=()=>{state.clusterPage+=Number(b.dataset.clusterStep);refresh();document.querySelector('#family-focus').focus()});document.querySelectorAll('[data-row-step]').forEach(b=>b.onclick=()=>{state.rowPage+=Number(b.dataset.rowStep);refresh();document.querySelector('#family-focus').focus()});const d=document.querySelector('#tile-list');if(d)d.addEventListener('toggle',()=>{if(d.open&&!d.dataset.loaded){d.querySelector('ul').innerHTML=n.families[state.family].slice(state.rowPage*64,state.rowPage*64+64).map(key=>DATA.rowIndex[key]).map(r=>`<li><a href="${source(r)}" target="_blank" rel="noopener">${esc(r.id)}</a> · ${esc(r.status)}<br>${esc(r.title)}</li>`).join('');d.dataset.loaded='true';}})}
function fan(n){let incoming=n.relationships.filter(r=>r.direction==='in'),outgoing=n.relationships.filter(r=>r.direction==='out');if(!incoming.length&&!outgoing.length)return '<p class="note">No directed interface is recorded here. This does not imply independence.</p>';
const port=(r,dir)=>{let target=dir==='in'?r.from:r.to;return `<button data-go="${esc(target)}"><small>${dir==='in'?'From':'To'} ${esc(S[target].title)}</small>${dir==='in'?'→':'→'} ${esc(r.label)}</button>`};
const paths=(items,left)=>items.map((r,i)=>{let y=8+(i+.5)/items.length*84;return `<path d="M ${left?33:55} ${left?y:50} C ${left?39:61} ${left?y:50}, ${left?39:61} ${left?50:y}, ${left?45:67} ${left?50:y}"/>`}).join('');
return `<div class="fan" aria-label="Recorded directed interfaces"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${paths(incoming,true)}${paths(outgoing,false)}</svg><div class="ports"><small>Recorded inputs</small>${incoming.map(r=>port(r,'in')).join('')||'<p class="scope">None recorded</p>'}</div><div class="spine">${esc(n.title)}</div><div class="ports out"><small>Recorded outputs</small>${outgoing.map(r=>port(r,'out')).join('')||'<p class="scope">None recorded</p>'}</div></div>`}
function render(){let id=decodeURIComponent(location.hash.slice(1));if(!S[id])id='webui';let n=S[id],e=n.evidence;pick.value=id;let path=[],p=n;while(p){path.unshift(p);p=S[p.parent]};document.querySelector('#crumbs').innerHTML=path.map(p=>`<button data-go="${esc(p.id)}" ${p.id===id?'aria-current="page"':''}>${esc(p.title)}</button>`).join('<span aria-hidden="true">›</span>');
document.querySelector('#story').innerHTML=`<section class="hero"><div><div class="archetype">${esc(n.archetype)} story</div><div class="eyebrow">${esc(n.role||'Architecture participant')}</div><h1 tabindex="-1">${esc(n.title)}</h1><p class="purpose">${esc(n.purpose)}</p></div><div class="summary">${e.state==='external'?'<strong>External participant</strong><p class="scope">Spec obligations are owned by connected system parts.</p>':`<span class="number">${e.subtreeRows.toLocaleString()}</span> mapped spec rows${band(e)}${legend(e)}<p class="scope">This part + descendants · ${e.ownRows} assigned directly.<br>Spec status is not runtime health or percentage complete.</p>`}</div></section>
<div class="sectionhead"><h2>${n.parts.length?'Capability map':'Capability contract'}</h2><span class="scope">${n.parts.length?n.parts.length+' direct parts · bars show mapped spec-row mix':'Leaf · no child decomposition is recorded'}</span></div>
${n.parts.length?`<div class="map">${n.parts.map(id=>{let p=S[id];return `<button class="part" data-go="${esc(id)}"><span><strong>${esc(p.title)}</strong><span class="role">${esc(p.role)}</span></span><span class="measure">${p.evidence.state==='external'?'External':p.evidence.subtreeRows+' rows'}${band(p.evidence)}</span></button>`}).join('')}</div>`:`<div class="leaf">${esc(e.rows[0]?.desc||'No additional contract text is mapped to this leaf.')}<p class="scope">${e.codePaths.length?'Code anchors: '+e.codePaths.map(esc).join(' · '):'No code anchor recorded for this part.'}</p></div>`}
<div class="sectionhead"><h2>Interface spine</h2><span class="scope">Only recorded directions · not runtime traffic or execution order</span></div>${fan(n)}${n.references.length?`<p class="scope">Related capabilities (direction unspecified): ${n.references.map(r=>`<button data-go="${esc(r.target)}">${esc(S[r.target].title)}</button>`).join(' ')}</p>`:''}
<div class="sectionhead"><h2>Requirement mosaic</h2><span class="scope">${e.subtreeRows} unique rows · ${Object.keys(n.families).length} recorded families · this part + descendants</span></div>${legend(e)}<p class="note">Tiles encode recorded specification states, not effort, health, quality or guaranteed completion. Row IDs are deduplicated within this story; different node stories can contain the same rows.</p><div id="mosaic-area">${mosaic(n)}</div>
<div class="sectionhead"><h2>Evidence anchors</h2><span class="scope">First ${e.rows.length} mapped rows in source order · snapshot, not a readiness claim</span></div><div class="proof">${e.rows.map(r=>`<article><small>${esc(r.status)}</small><h3>${esc(r.title)}</h3><a target="_blank" rel="noopener" href="https://github.com/Knuckles-Team/${encodeURIComponent(r.repo)}/blob/HEAD/specs/${encodeURIComponent(r.family)}/requirements.md">${esc(r.id)} ↗</a><p class="scope">Source link follows HEAD; snapshot status may differ.</p></article>`).join('')||'<p class="note">No spec rows map to this part. No completeness or status is inferred.</p>'}</div>`;
document.querySelector('#foot').textContent='LOCAL DESIGN STUDY · not the live explorer · Source snapshot '+DATA.provenance.builtAt+' · No runtime activity is represented. Existing child map is reskinned here, not duplicated as another panel.';bindMosaic(n);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));if(pendingFocus){document.querySelector('h1').focus();pendingFocus=false;}}
window.addEventListener('hashchange',render);render();
</script></html>

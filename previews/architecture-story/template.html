<script>
const DATA=/*STORIES*/;const S=DATA.stories;const KNOWN=['VERIFIED','LANDED','SPECIFIED','RETIRED'];const ST=[...KNOWN,...new Set(Object.values(S).flatMap(n=>Object.keys(n.evidence.subtreeStatuses)).filter(k=>!KNOWN.includes(k)))];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const band=e=>`<div class="statusband" aria-hidden="true">${ST.filter(k=>e.subtreeStatuses[k]).map(k=>`<span class="${KNOWN.includes(k)?k:'RECORDED'}" style="flex:${e.subtreeStatuses[k]}"></span>`).join('')}</div>`;
const legend=e=>`<div class="legend">${ST.filter(k=>e.subtreeStatuses[k]).map(k=>`<span><i class="${KNOWN.includes(k)?k:'RECORDED'}" aria-hidden="true"></i>${e.subtreeStatuses[k]} ${esc(k.toLowerCase())}</span>`).join('')}</div>`;
let pendingFocus=false,sceneMode=true;const go=id=>{sceneMode=true;pendingFocus=true;location.hash=encodeURIComponent(id)};
document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>go(b.dataset.example));
const pick=document.querySelector('#pick');Object.values(S).forEach(n=>{let o=document.createElement('option');o.value=n.id;o.textContent=n.title+' · '+n.id;pick.append(o)});pick.onchange=()=>go(pick.value);
const source=r=>`https://github.com/Knuckles-Team/${encodeURIComponent(r.repo)}/blob/HEAD/specs/${encodeURIComponent(r.family)}/requirements.md`;
const tile=r=>`<a class="tile ${KNOWN.includes(r.status)?r.status:'RECORDED'}" href="${source(r)}" target="_blank" rel="noopener" title="${esc(r.id+' · '+r.status+' · '+r.title)}" aria-label="${esc(r.id+' · '+r.status+' · '+r.title)}"></a>`;
const mosaicState={};
function mosaic(n){const groups=Object.entries(n.families);if(!groups.length)return '<p class="leaf">No mapped requirement tiles. The purpose, ancestry and recorded interfaces remain the story.</p>';
const state=mosaicState[n.id]||(mosaicState[n.id]={family:groups[0][0],clusterPage:0,rowPage:0});const [name,ids]=groups.find(([key])=>key===state.family)||groups[0];const start=state.rowPage*64,rows=ids.slice(start,start+64).map(key=>DATA.rowIndex[key]);const pageGroups=groups.slice(state.clusterPage*12,state.clusterPage*12+12);
return `<div class="mosaic-key"><b aria-hidden="true"></b>One tile = one unique mapped requirement. Family summaries are explicitly aggregated, not row tiles.</div><p><label>Focus family <select id="family-focus">${groups.map(([key,keys])=>`<option value="${esc(key)}" ${key===name?'selected':''}>${esc(key)} · ${keys.length} rows</option>`).join('')}</select></label></p><div class="family-clusters">${pageGroups.map(([key,keys])=>`<button data-cluster="${esc(key)}" aria-pressed="${key===name}"><strong>${esc(key.split('/').slice(1).join('/'))}</strong><span>${keys.length} unique rows · family aggregate</span></button>`).join('')}</div><div class="pager"><button data-cluster-step="-1" ${state.clusterPage===0?'disabled':''}>Previous families</button><span>Families ${state.clusterPage*12+1}–${state.clusterPage*12+pageGroups.length} of ${groups.length}</span><button data-cluster-step="1" ${(state.clusterPage+1)*12>=groups.length?'disabled':''}>Next families</button></div>
<div class="focused-family"><strong>${esc(name)}</strong><p class="tile-caption">Requirement tiles ${start+1}–${start+rows.length} of ${ids.length}. This page is a source-ordered slice, not a representative status sample.</p><div class="tiles">${rows.map(tile).join('')}</div><div class="pager"><button data-row-step="-1" ${start===0?'disabled':''}>Previous requirements</button><span>${ids.length} total in family</span><button data-row-step="1" ${start+64>=ids.length?'disabled':''}>Next requirements</button></div><details id="tile-list"><summary>Read these ${rows.length} requirement IDs and states</summary><ul class="rows"></ul></details><p class="scope">All mapped rows remain reachable by family and requirement pages; links open the recorded source family.</p></div>`}
function bindMosaic(n){let state=mosaicState[n.id];if(!state)return;const refresh=()=>{document.querySelector('#mosaic-area').innerHTML=mosaic(n);bindMosaic(n)};const choose=key=>{state.family=key;state.rowPage=0;refresh();document.querySelector('#family-focus').focus()};const select=document.querySelector('#family-focus');if(select)select.onchange=()=>choose(select.value);document.querySelectorAll('[data-cluster]').forEach(b=>b.onclick=()=>choose(b.dataset.cluster));document.querySelectorAll('[data-cluster-step]').forEach(b=>b.onclick=()=>{state.clusterPage+=Number(b.dataset.clusterStep);refresh();document.querySelector('#family-focus').focus()});document.querySelectorAll('[data-row-step]').forEach(b=>b.onclick=()=>{state.rowPage+=Number(b.dataset.rowStep);refresh();document.querySelector('#family-focus').focus()});const d=document.querySelector('#tile-list');if(d)d.addEventListener('toggle',()=>{if(d.open&&!d.dataset.loaded){d.querySelector('ul').innerHTML=n.families[state.family].slice(state.rowPage*64,state.rowPage*64+64).map(key=>DATA.rowIndex[key]).map(r=>`<li><a href="${source(r)}" target="_blank" rel="noopener">${esc(r.id)}</a> · ${esc(r.status)}<br>${esc(r.title)}</li>`).join('');d.dataset.loaded='true';}})}
function fan(n){let incoming=n.relationships.filter(r=>r.direction==='in'),outgoing=n.relationships.filter(r=>r.direction==='out');if(!incoming.length&&!outgoing.length)return '<p class="note">No directed interface is recorded here. This does not imply independence.</p>';
const port=(r,dir)=>{let target=dir==='in'?r.from:r.to;return `<button data-go="${esc(target)}"><small>${dir==='in'?'From':'To'} ${esc(S[target].title)}</small>${dir==='in'?'→':'→'} ${esc(r.label)}</button>`};
const paths=(items,left)=>items.map((r,i)=>{let y=8+(i+.5)/items.length*84;return `<path d="M ${left?33:55} ${left?y:50} C ${left?39:61} ${left?y:50}, ${left?39:61} ${left?50:y}, ${left?45:67} ${left?50:y}"/>`}).join('');
return `<div class="fan" aria-label="Recorded directed interfaces"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${paths(incoming,true)}${paths(outgoing,false)}</svg><div class="ports"><small>Recorded inputs</small>${incoming.map(r=>port(r,'in')).join('')||'<p class="scope">None recorded</p>'}</div><div class="spine">${esc(n.title)}</div><div class="ports out"><small>Recorded outputs</small>${outgoing.map(r=>port(r,'out')).join('')||'<p class="scope">None recorded</p>'}</div></div>`}
function familyRegions(n){let groups=Object.entries(n.families).map(([name,ids])=>({name,ids,weight:ids.length})).sort((a,b)=>b.weight-a.weight||a.name.localeCompare(b.name));if(groups.length>12){const tail=groups.splice(11);groups.push({name:'Other '+tail.length+' families',ids:tail.flatMap(g=>g.ids),weight:tail.reduce((v,g)=>v+g.weight,0),other:true})}const out=[];
function split(items,x,y,w,h){if(items.length===1){out.push({...items[0],x,y,w,h});return}let total=items.reduce((a,g)=>a+g.weight,0),part=0,k=0;while(k<items.length-1&&part<total/2){part+=items[k++].weight}const ratio=part/total;if(w>=h){split(items.slice(0,k),x,y,w*ratio,h);split(items.slice(k),x+w*ratio,y,w*(1-ratio),h)}else{split(items.slice(0,k),x,y,w,h*ratio);split(items.slice(k),x,y+h*ratio,w,h*(1-ratio))}}if(groups.length)split(groups,0,0,100,100);return out}
function evidenceField(n){const regions=familyRegions(n),total=n.evidence.subtreeRows;if(!total)return '<div class="scene-empty">No requirements map to this part. External ownership or missing mapping is not a completeness claim.</div>';return `<div class="family-field" role="img" aria-label="Family mosaic: area is unique requirement count; color is recorded specification state. Use the family selector for complete names and counts."><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${regions.map((g,i)=>{const count={};g.ids.forEach(key=>{const state=DATA.rowIndex[key].status;count[state]=(count[state]||0)+1});let x=g.x;return ST.filter(k=>count[k]).map(k=>{const w=g.w*count[k]/g.weight;const rect=`<rect x="${x}" y="${g.y}" width="${w}" height="${g.h}" fill="var(--s-${KNOWN.includes(k)?k.toLowerCase():'specified'})" opacity=".25"/>`;x+=w;return rect}).join('')+`<rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" fill="none" stroke="var(--sheet)" stroke-width=".35"/>`}).join('')}</svg>${regions.filter(g=>g.w>=17&&g.h>=35).map(g=>`<div class="region-label" style="left:${g.x}%;top:${g.y}%;width:${g.w}%;height:${g.h}%"><strong>${esc(g.other?g.name:g.name.split('/').slice(1).join('/').replaceAll('-',' '))}</strong><span>${g.weight} unique rows</span></div>`).join('')}</div><div class="scene-evidence-tools"><label>Inspect family <select id="scene-family-select">${Object.entries(n.families).map(([name,ids])=>`<option value="${esc(name)}">${esc(name)} · ${ids.length} unique rows</option>`).join('')}</select></label><button id="scene-family-open">Read requirements</button><span>${Object.keys(n.families).length} families · ${total} unique rows${regions.some(g=>g.other)?' · smallest families grouped as Other':''}</span></div>`}
const SHORT_LABELS={'arbora':'Arbora','webui':'Overstory','eg.decide':'Decision Engine','webui.api.gen':'Generated Client','webui.api':'API Consumer','webui.apps':'Application Surface','webui.design':'Design System','webui.decide':'Decision Evidence','webui.fin':'Markets','webui.id':'Identity','webui.dash':'Overstory Studio'};
const graphemes=value=>typeof Intl.Segmenter==='function'?[...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(String(value))].map(part=>part.segment):Array.from(String(value));
const capText=(value,max)=>{const units=graphemes(value);return max<=0?'':units.length<=max?units.join(''):units.slice(0,Math.max(0,max-1)).join('').trimEnd()+'…'};
const returnNodeFocus=new Map();
function actualChildMap(n){const L=n.layout;if(!L)return `<p class="scene-contract">${esc(capText(n.evidence.rows[0]?.desc||n.purpose,96))}</p>`;
const edges=(L.edges||[]).filter(e=>e.pts?.length>1).map(e=>`<path d="${e.pts.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' ')}" fill="none" stroke="var(--edge)" stroke-width="2" vector-effect="non-scaling-stroke" marker-end="url(#inbox-arrow)"><title>${esc(S[e.from]?.title||e.from)} → ${esc(S[e.to]?.title||e.to)} · ${esc(e.label)}</title></path>`).join('');
return `<div class="actual-map" tabindex="0" role="region" aria-label="Recorded architecture graph. Use diagram zoom and scroll to inspect smaller parts." data-layout-width="${L.w}" data-layout-height="${L.h}"><svg viewBox="0 0 ${L.w} ${L.h}" preserveAspectRatio="xMidYMid meet" aria-label="Recorded child geometry and routed architecture edges"><defs><marker id="inbox-arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto"><path d="M0 0L18 7L0 14Z" fill="var(--edge)"/></marker></defs>${edges}${n.parts.map(id=>{const r=L.kids[id];if(!r)return '';return `<g class="actual-child" data-go="${esc(id)}" role="button" tabindex="0" aria-label="${esc(S[id].title)}"><title>${esc(S[id].title)}</title><rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="16" fill="var(--glass-reading)" stroke="var(--line)" stroke-width="1.5" vector-effect="non-scaling-stroke"/><text x="${r[0]+r[2]/2}" y="${r[1]+r[3]/2}" data-label="${esc(SHORT_LABELS[id]||S[id].title)}" data-width="${r[2]}" data-height="${r[3]}" text-anchor="middle" dominant-baseline="middle" fill="var(--fg)">${esc(capText(SHORT_LABELS[id]||S[id].title,22))}</text></g>`}).join('')}</svg></div><div class="inbox-map-tools"><label>Part <select id="inbox-child-select">${n.parts.map(id=>`<option value="${esc(id)}">${esc(S[id].title)}</option>`).join('')}</select></label><button id="inbox-child-open">Open part</button><label>Diagram zoom <input id="inbox-graph-zoom" type="range" min="1" max="4" step=".1" value="1" aria-label="Bounded diagram zoom"></label><span>${n.parts.length} parts · ${L.edges?.length||0} recorded edges</span></div>`}
function sizeActualMap(){const map=document.querySelector('.actual-map');if(!map)return;const svg=map.querySelector('svg');const scale=Math.min(svg.clientWidth/Number(map.dataset.layoutWidth),svg.clientHeight/Number(map.dataset.layoutHeight));if(!scale)return;for(const t of map.querySelectorAll('text')){const width=Number(t.dataset.width)*scale,height=Number(t.dataset.height)*scale;t.style.fontSize=(12/scale)+'px';let limit=22;t.textContent=capText(t.dataset.label,limit);if(width<70||height<24){t.style.display='none';continue}t.style.display='';while(limit>4&&t.getComputedTextLength()*scale>width-12){limit--;t.textContent=capText(t.dataset.label,limit)}if(t.getComputedTextLength()*scale>width-12)t.style.display='none';}}
function bindDiagramZoom(){const range=document.querySelector('#inbox-graph-zoom');if(!range)return;range.oninput=()=>{const svg=document.querySelector('.actual-map svg');svg.style.width=(Number(range.value)*100)+'%';svg.style.height=(Number(range.value)*100)+'%';sizeActualMap()};}
function bindSvgNode(b,parentId){const activate=()=>{returnNodeFocus.set(parentId,b.dataset.go);go(b.dataset.go)};b.onclick=activate;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '||e.code==='Space'){e.preventDefault();e.stopPropagation();activate()}};}
function restoreDiagramFocus(parentId){const child=returnNodeFocus.get(parentId);if(!child)return;const target=[...document.querySelectorAll('.actual-child')].find(e=>e.dataset.go===child);if(target)target.focus();}

function focusedScene(n){const incoming=n.relationships.filter(r=>r.direction==='in'),outgoing=n.relationships.filter(r=>r.direction==='out');const port=(r,dir)=>{const id=dir==='in'?r.from:r.to;return `<button data-go="${esc(id)}" aria-label="${esc(S[id].title)}"><strong>${esc(capText(SHORT_LABELS[id]||S[id].title,22))}</strong><span>${dir==='in'?'→':'→'} ${esc(capText(r.label,18))}</span></button>`};return `<article class="focused-scene" aria-label="Focused architecture part composition"><div class="inbox-zoom"><span>Selected architecture box</span><label>Detail <input id="inbox-detail" type="range" min="0" max="2" step=".01" value="2" aria-label="Semantic detail disclosure"></label><span id="inbox-detail-label">Focused</span></div><div class="scene-heading"><div><div class="eyebrow">${esc(capText(n.role||'External participant',42))}</div><h1 tabindex="-1">${esc(n.title)}</h1></div><p>${esc(capText(n.purpose,96))}</p></div><div class="scene-core"><aside class="scene-ports"><small>Recorded inputs</small>${incoming.map(r=>port(r,'in')).join('')||'<p>No directed input recorded</p>'}</aside><div class="scene-map"><div class="scene-map-label">${n.parts.length?'Recorded architecture':'Capability contract'}</div>${actualChildMap(n)}</div><aside class="scene-ports"><small>Recorded outputs</small>${outgoing.map(r=>port(r,'out')).join('')||'<p>No directed output recorded</p>'}</aside></div><div class="scene-field-heading"><strong>Requirement landscape</strong><span>Area = unique requirements · state ≠ health or completion</span>${legend(n.evidence)}</div>${evidenceField(n)}<div class="scene-bottom"><span>Snapshot ${esc(DATA.provenance.builtAt)} · no traffic/activity implied</span><button id="open-inspection">Open full evidence inspection</button></div></article>`}
function render(){let id=decodeURIComponent(location.hash.slice(1));if(!S[id])id='webui';let n=S[id],e=n.evidence;pick.value=id;let path=[],p=n;while(p){path.unshift(p);p=S[p.parent]};document.querySelector('#crumbs').innerHTML=path.map(p=>`<button data-go="${esc(p.id)}" ${p.id===id?'aria-current="page"':''}>${esc(p.title)}</button>`).join('<span aria-hidden="true">›</span>');
document.querySelector('#story').innerHTML=sceneMode?focusedScene(n):`<button id="back-scene">← Return to focused scene</button><section class="hero"><div><div class="archetype">${esc(n.archetype)} story</div><div class="eyebrow">${esc(n.role||'Architecture participant')}</div><h1 tabindex="-1">${esc(n.title)}</h1><p class="purpose">${esc(n.purpose)}</p></div><div class="summary">${e.state==='external'?'<strong>External participant</strong><p class="scope">Spec obligations are owned by connected system parts.</p>':`<span class="number">${e.subtreeRows.toLocaleString()}</span> mapped spec rows${band(e)}${legend(e)}<p class="scope">This part + descendants · ${e.ownRows} assigned directly.<br>Spec status is not runtime health or percentage complete.</p>`}</div></section>
<div class="sectionhead"><h2>${n.parts.length?'Capability map':'Capability contract'}</h2><span class="scope">${n.parts.length?n.parts.length+' direct parts · bars show mapped spec-row mix':'Leaf · no child decomposition is recorded'}</span></div>
${n.parts.length?`<div class="map">${n.parts.map(id=>{let p=S[id];return `<button class="part" data-go="${esc(id)}"><span><strong>${esc(p.title)}</strong><span class="role">${esc(p.role)}</span></span><span class="measure">${p.evidence.state==='external'?'External':p.evidence.subtreeRows+' rows'}${band(p.evidence)}</span></button>`}).join('')}</div>`:`<div class="leaf">${esc(e.rows[0]?.desc||'No additional contract text is mapped to this leaf.')}<p class="scope">${e.codePaths.length?'Code anchors: '+e.codePaths.map(esc).join(' · '):'No code anchor recorded for this part.'}</p></div>`}
<div class="sectionhead"><h2>Interface spine</h2><span class="scope">Only recorded directions · not runtime traffic or execution order</span></div>${fan(n)}${n.references.length?`<p class="scope">Related capabilities (direction unspecified): ${n.references.map(r=>`<button data-go="${esc(r.target)}">${esc(S[r.target].title)}</button>`).join(' ')}</p>`:''}
<div class="sectionhead"><h2>Requirement mosaic</h2><span class="scope">${e.subtreeRows} unique rows · ${Object.keys(n.families).length} recorded families · this part + descendants</span></div>${legend(e)}<p class="note">Tiles encode recorded specification states, not effort, health, quality or guaranteed completion. Row IDs are deduplicated within this story; different node stories can contain the same rows.</p><div id="mosaic-area">${mosaic(n)}</div>
<div class="sectionhead"><h2>Evidence anchors</h2><span class="scope">First ${e.rows.length} mapped rows in source order · snapshot, not a readiness claim</span></div><div class="proof">${e.rows.map(r=>`<article><small>${esc(r.status)}</small><h3>${esc(r.title)}</h3><a target="_blank" rel="noopener" href="https://github.com/Knuckles-Team/${encodeURIComponent(r.repo)}/blob/HEAD/specs/${encodeURIComponent(r.family)}/requirements.md">${esc(r.id)} ↗</a><p class="scope">Source link follows HEAD; snapshot status may differ.</p></article>`).join('')||'<p class="note">No spec rows map to this part. No completeness or status is inferred.</p>'}</div>`;
document.querySelector('#foot').textContent='LOCAL DESIGN STUDY · not the live explorer · Source snapshot '+DATA.provenance.builtAt+' · No runtime activity is represented. Existing child map is reskinned here, not duplicated as another panel.';bindMosaic(n);const openInspection=family=>{sceneMode=false;if(family)mosaicState[n.id]={family,clusterPage:0,rowPage:0};pendingFocus=true;render()};const open=document.querySelector('#open-inspection');if(open)open.onclick=()=>openInspection();const familyOpen=document.querySelector('#scene-family-open');if(familyOpen)familyOpen.onclick=()=>openInspection(document.querySelector('#scene-family-select').value);const detail=document.querySelector('#inbox-detail');if(detail)detail.oninput=()=>{document.querySelector('.focused-scene').dataset.zoom=Number(detail.value)<.6?'overview':Number(detail.value)<1.4?'structure':'focused';document.querySelector('#inbox-detail-label').textContent=Number(detail.value)<.6?'Overview':Number(detail.value)<1.4?'Structure':'Focused'};const childOpen=document.querySelector('#inbox-child-open');if(childOpen)childOpen.onclick=()=>go(document.querySelector('#inbox-child-select').value);bindDiagramZoom();requestAnimationFrame(sizeActualMap);const back=document.querySelector('#back-scene');if(back)back.onclick=()=>{sceneMode=true;pendingFocus=true;render()};document.querySelectorAll('[data-go]').forEach(b=>{b.onclick=()=>go(b.dataset.go);if(b.tagName.toLowerCase()==='g')bindSvgNode(b,n.id)});if(pendingFocus){document.querySelector('h1').focus();pendingFocus=false;}else restoreDiagramFocus(n.id);}
window.addEventListener('resize',sizeActualMap);window.addEventListener('hashchange',render);render();
</script></html>

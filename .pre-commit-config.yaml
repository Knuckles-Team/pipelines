repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
- repo: local
  hooks:
  - id: forbid-actions-write-all
    name: Forbid broad GitHub Actions write-all permissions
    entry: '^\s*permissions:\s*write-all\s*$'
    language: pygrep
    files: ^\.github/workflows/.*\.ya?ml$

name: Checkout, set up Python and uv
description: >-
  Checkout the repository, install a pinned Python version, and install uv.
  Shared by desktop_release_pipeline.yml's Linux and Windows build jobs so
  the three-step preamble exists once, not once per platform.
inputs:
  python-version:
    description: Python version passed to actions/setup-python.
    required: false
    default: '3.11'
runs:
  using: composite
  steps:
    - name: Check out code and bind provenance
      uses: ./.pipeline-contract/.github/actions/checkout-verified-source

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

name: Checkout, set up Python and uv
description: >-
  Checkout the repository, install a pinned Python version, and install uv.
  Shared by desktop_release_pipeline.yml's Linux and Windows build jobs so
  the three-step preamble exists once, not once per platform. Many callers
  run this on self-hosted homelab runners without AVX2; actions/setup-python's
  python-build-standalone distribution requires AVX2 and fails there with
  "CPU ISA level is lower than required" (exit 127), so Python is installed
  via uv instead, which has no such requirement.
inputs:
  python-version:
    description: Python version passed to uv python install.
    required: false
    default: '3.11'
runs:
  using: composite
  steps:
    - name: Check out code and bind provenance
      uses: ./.pipeline-contract/.github/actions/checkout-verified-source

    - name: Install uv and set up Python
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        python-version: ${{ inputs.python-version }}

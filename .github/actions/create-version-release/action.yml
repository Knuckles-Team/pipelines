name: Create a versioned GitHub release
description: >-
  Create a GitHub release named after the calling job's BUILD_VERSION,
  COMMIT_DATETIME, LATEST_COMMIT and COMMIT_MESSAGE environment variables
  (set by a preceding build step). Shared by python_pipeline.yml (via
  publish-python-package, for both its plain and web-assets variants) and
  maturin_pipeline.yml, which all release from the same four variables.
inputs:
  github-token:
    description: Token used to create the release.
    required: true
  runtime-profiles:
    description: Additional runtime extras as JSON; base and declared mcp/agent/all are always proven.
    required: false
    default: '[]'
  files:
    description: Glob of release asset files to attach.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Verify release wheel proof
      shell: bash
      env:
        RUNTIME_PROFILES: ${{ inputs.runtime-profiles }}
      run: '"$READINESS_PYTHON" -I .pipeline-contract/.github/actions/wheel-readiness/readiness.py verify --release-version "$BUILD_VERSION"'

    # The release links the published PyPI package: the distribution name comes
    # from the caller's pyproject.toml, the version from BUILD_VERSION.
    - name: Resolve the PyPI project link
      id: pypi
      shell: bash
      run: |
        set -euo pipefail
        name="$("$READINESS_PYTHON" -I -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')"
        {
          echo "name=$name"
          echo "url=https://pypi.org/project/$name/$BUILD_VERSION/"
        } >> "$GITHUB_OUTPUT"

    - name: Verify release tag source
      id: release_source
      uses: ./.pipeline-contract/.github/actions/verify-release-source
      with:
        github-token: ${{ inputs.github-token }}

    - name: Create Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      with:
        tag_name: v${{ env.BUILD_VERSION }}
        target_commitish: ${{ steps.release_source.outputs.commit }}
        name: Release v${{ env.BUILD_VERSION }}
        body: |
          PyPI: [`${{ steps.pypi.outputs.name }}` ${{ env.BUILD_VERSION }}](${{ steps.pypi.outputs.url }})

          ```bash
          pip install "${{ steps.pypi.outputs.name }}==${{ env.BUILD_VERSION }}"
          ```

          Released: ${{ env.COMMIT_DATETIME }}
          Commit: ${{ env.LATEST_COMMIT }}
          Pipelines contract: ${{ env.PIPELINES_CONTRACT_COMMIT }}
          Wheel readiness: release-readiness.json workflow artifact
          Changes:
          ${{ env.COMMIT_MESSAGE }}
        files: ${{ inputs.files }}
        draft: false
        prerelease: false
        make_latest: true

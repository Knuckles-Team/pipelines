name: Build, publish and release a Python package
description: >-
  Build a Python package with uv, upload the wheel and sdist as a workflow artifact,
  publish the wheel and the source distribution to PyPI with twine, and create
  a matching GitHub release.
inputs:
  pypi-token:
    description: PyPI API token used by twine.
    required: true
  github-token:
    description: Token used to create the GitHub release.
    required: true
  runtime-profiles:
    description: Additional runtime extras as JSON; base and declared mcp/agent/all are always proven.
    required: false
    default: '[]'
runs:
  using: composite
  steps:
    # PIPE-RELEASE-R016: uv downloads and managed interpreters persist in the
    # runner tool cache (the runner work volume outlives each job; the runner
    # home does not). uv's cache is content-addressed by package, version and
    # hash, so a lock change simply misses; nothing here relaxes a check.
    - name: Persist uv downloads across runs
      shell: bash
      run: |
        root="${RUNNER_TOOL_CACHE:-}"
        if [ -z "$root" ]; then
          exit 0
        fi
        mkdir -p "$root/uv-cache" "$root/uv-python"
        {
          echo "UV_CACHE_DIR=$root/uv-cache"
          echo "UV_PYTHON_INSTALL_DIR=$root/uv-python"
        } >> "$GITHUB_ENV"

    - name: Bind source commit
      uses: ./.pipeline-contract/.github/actions/verify-source-commit
      with:
        phase: before

    - name: Build package
      id: build_package
      shell: bash
      run: |
        echo "Creating virtual environment"
        # Release builds run on the environment version (reference/gate-standard.md
        # "Python version"); requires-python keeps the 3.12 install floor.
        uv venv --python 3.14 .venv
        source .venv/bin/activate
        echo "Installing build prerequisites"
        if [ -f requirements.txt ]; then
          uv pip install -r requirements.txt
        fi
        # Keep the publisher available for packages whose requirements file
        # contains only runtime dependencies (or is intentionally absent for
        # the web-assets variant).
        uv pip install --require-hashes -r "${{ github.action_path }}/twine-requirements.txt"
        echo "Building package"
        rm -rf dist
        uv build --wheel --no-create-gitignore
        BUILD_VERSION=$(ls dist | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*' | head -n 1)
        LATEST_COMMIT="$SOURCE_COMMIT"
        echo "Last Commit: ${LATEST_COMMIT}"
        COMMIT_MESSAGE=$(git log -1 --format=%B "$LATEST_COMMIT" | tr '\n' ' ')
        COMMIT_DATETIME=$(date "+%m/%d/%Y %H:%M:%S")
        {
          echo "COMMIT_DATETIME=$COMMIT_DATETIME"
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE"
          echo "BUILD_VERSION=$BUILD_VERSION"
          echo "LATEST_COMMIT=$LATEST_COMMIT"
        } >> "$GITHUB_ENV"

    - name: Verify source commit after build
      uses: ./.pipeline-contract/.github/actions/verify-source-commit
      with:
        phase: after

    - name: Prove wheel runtime readiness
      uses: ./.pipeline-contract/.github/actions/wheel-readiness
      with:
        runtime-profiles: ${{ inputs.runtime-profiles }}

    # PIPE-RELEASE-R008: the wheel and the source distribution publish together.
    # The sdist builds into its own directory so dist/ stays wheel-only for the
    # wheel guard, and the source phase proves it by an isolated wheel rebuild.
    - name: Build source distribution
      shell: bash
      run: |
        rm -rf dist-sdist
        uv build --sdist --no-create-gitignore --out-dir dist-sdist

    - name: Prove source distribution rebuild
      uses: ./.pipeline-contract/.github/actions/wheel-readiness
      with:
        phase: source
        directory: dist-sdist
        runtime-profiles: ${{ inputs.runtime-profiles }}
        receipt: sdist-readiness.json
        artifact-name: release-readiness-sdist

    - name: Upload Artifact
      id: upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ github.event.repository.name }}-${{ env.BUILD_VERSION }}
        path: |
          dist/*.whl
          dist-sdist/*.tar.gz
        if-no-files-found: error

    - name: Verify release tag before publication
      uses: ./.pipeline-contract/.github/actions/verify-release-source
      with:
        github-token: ${{ inputs.github-token }}

    - name: Publish package
      env:
        RUNTIME_PROFILES: ${{ inputs.runtime-profiles }}
      shell: bash
      run: |
        "$READINESS_PYTHON" -I .pipeline-contract/.github/actions/wheel-readiness/readiness.py verify --release-version "$BUILD_VERSION"
        sdists=(dist-sdist/*-"$BUILD_VERSION".tar.gz)
        [ "${#sdists[@]}" -eq 1 ] && [ -f "${sdists[0]}" ] || { echo "the source distribution does not carry release $BUILD_VERSION" >&2; exit 1; }
        .venv/bin/twine upload --config-file /dev/null --repository-url https://upload.pypi.org/legacy/ dist/*.whl dist-sdist/*.tar.gz --verbose -u "__token__" -p "${{ inputs.pypi-token }}"

    - name: Create Release
      uses: ./.pipeline-contract/.github/actions/create-version-release
      with:
        github-token: ${{ inputs.github-token }}
        runtime-profiles: ${{ inputs.runtime-profiles }}

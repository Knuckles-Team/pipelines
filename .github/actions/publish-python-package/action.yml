name: Build, publish and release a Python package
description: >-
  Build a Python package with uv, upload the wheel as a workflow artifact,
  publish it to PyPI with twine, and create a matching GitHub release.
inputs:
  pypi-token:
    description: PyPI API token used by twine.
    required: true
  github-token:
    description: Token used to create the GitHub release.
    required: true
  runtime-profiles:
    description: JSON array containing base and every advertised runtime extra.
    required: true
runs:
  using: composite
  steps:
    - name: Bind source commit
      uses: ./.pipeline-contract/.github/actions/verify-source-commit
      with:
        phase: before

    - name: Build package
      id: build_package
      shell: bash
      run: |
        echo "Creating virtual environment"
        # Pin to 3.13: Python 3.14 breaks native builds of transitive deps
        # (e.g. litellm's PyO3 chain caps at cp313), failing release CI fleet-wide.
        uv venv --python 3.13 .venv
        source .venv/bin/activate
        echo "Installing build prerequisites"
        if [ -f requirements.txt ]; then
          uv pip install -r requirements.txt
        fi
        # Keep the publisher available for packages whose requirements file
        # contains only runtime dependencies (or is intentionally absent for
        # the web-assets variant).
        uv pip install --require-hashes -r "${{ github.action_path }}/twine-requirements.txt"
        echo "Building package"
        rm -rf dist
        uv build --wheel
        BUILD_VERSION=$(ls dist | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*' | head -n 1)
        LATEST_COMMIT="$SOURCE_COMMIT"
        echo "Last Commit: ${LATEST_COMMIT}"
        COMMIT_MESSAGE=$(git log -1 --format=%B "$LATEST_COMMIT" | tr '\n' ' ')
        COMMIT_DATETIME=$(date "+%m/%d/%Y %H:%M:%S")
        {
          echo "COMMIT_DATETIME=$COMMIT_DATETIME"
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE"
          echo "BUILD_VERSION=$BUILD_VERSION"
          echo "LATEST_COMMIT=$LATEST_COMMIT"
        } >> "$GITHUB_ENV"

    - name: Verify source commit after build
      uses: ./.pipeline-contract/.github/actions/verify-source-commit
      with:
        phase: after

    - name: Prove wheel runtime readiness
      uses: ./.pipeline-contract/.github/actions/wheel-readiness
      with:
        runtime-profiles: ${{ inputs.runtime-profiles }}

    - name: Upload Artifact
      id: upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ github.event.repository.name }}-${{ env.BUILD_VERSION }}
        path: dist/*.whl
        if-no-files-found: error

    - name: Publish package
      env:
        RUNTIME_PROFILES: ${{ inputs.runtime-profiles }}
      shell: bash
      run: |
        "$READINESS_PYTHON" -I .pipeline-contract/.github/actions/wheel-readiness/readiness.py verify --release-version "$BUILD_VERSION"
        .venv/bin/twine upload --config-file /dev/null --repository-url https://upload.pypi.org/legacy/ dist/*.whl --verbose -u "__token__" -p "${{ inputs.pypi-token }}"

    - name: Create Release
      uses: ./.pipeline-contract/.github/actions/create-version-release
      with:
        github-token: ${{ inputs.github-token }}
        runtime-profiles: ${{ inputs.runtime-profiles }}

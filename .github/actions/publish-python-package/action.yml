name: Build, publish and release a Python package
description: >-
  Build a Python package with uv, upload the wheel as a workflow artifact,
  publish it to PyPI with twine, and create a matching GitHub release.
  Called by python_pipeline.yml's single job for both its plain and
  web-assets (`web-assets: true`) variants, which differ only in whether a
  missing requirements.txt is tolerated and whether twine skips an
  already-published version.
inputs:
  pypi-token:
    description: PyPI API token used by twine.
    required: true
  github-token:
    description: Token used to create the GitHub release.
    required: true
  tolerate-missing-requirements:
    description: >-
      Continue when `uv pip install -r requirements.txt` fails (the web
      pipeline package need not vendor its own requirements.txt).
    required: false
    default: 'false'
  twine-skip-existing:
    description: Pass twine --skip-existing (an idempotent re-trigger becomes a no-op).
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Build package
      id: build_package
      shell: bash
      env:
        EXPECTED_COMMIT: ${{ github.sha }}
      run: |
        SOURCE_COMMIT=$(git rev-parse --verify HEAD)
        if [ -z "$EXPECTED_COMMIT" ] || [ "$SOURCE_COMMIT" != "$EXPECTED_COMMIT" ]; then
          echo "checked-out commit ${SOURCE_COMMIT} does not match github.sha ${EXPECTED_COMMIT}" >&2
          exit 1
        fi
        echo "Building from commit: ${SOURCE_COMMIT}"
        echo "Creating virtual environment"
        # Pin to 3.13: Python 3.14 breaks native builds of transitive deps
        # (e.g. litellm's PyO3 chain caps at cp313), failing release CI fleet-wide.
        uv venv --python 3.13 .venv
        source .venv/bin/activate
        echo "Installing dependencies"
        if [ "${{ inputs.tolerate-missing-requirements }}" = "true" ]; then
          uv pip install -r requirements.txt || true
        else
          uv pip install -r requirements.txt
        fi
        # Keep the publisher available for packages whose requirements file
        # contains only runtime dependencies (or is intentionally absent for
        # the web-assets variant).
        uv pip install --require-hashes -r "${{ github.action_path }}/twine-requirements.txt"
        echo "Building package"
        uv build
        if [ "$(git rev-parse --verify HEAD)" != "$SOURCE_COMMIT" ]; then
          echo "HEAD changed while building the package" >&2
          exit 1
        fi
        BUILD_VERSION=$(ls dist | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*' | head -n 1)
        LATEST_COMMIT="$SOURCE_COMMIT"
        echo "Last Commit: ${LATEST_COMMIT}"
        COMMIT_MESSAGE=$(git log -1 --format=%B "$LATEST_COMMIT" | tr '\n' ' ')
        COMMIT_DATETIME=$(date "+%m/%d/%Y %H:%M:%S")
        {
          echo "COMMIT_DATETIME=$COMMIT_DATETIME"
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE"
          echo "BUILD_VERSION=$BUILD_VERSION"
          echo "LATEST_COMMIT=$LATEST_COMMIT"
        } >> "$GITHUB_ENV"

    - name: Upload Artifact
      id: upload_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ github.event.repository.name }}-${{ env.BUILD_VERSION }}
        path: dist/*.whl
        if-no-files-found: error

    - name: Publish package
      shell: bash
      run: |
        if [ "${{ inputs.twine-skip-existing }}" = "true" ]; then
          .venv/bin/twine upload --skip-existing dist/* --verbose -u "__token__" -p "${{ inputs.pypi-token }}"
        else
          .venv/bin/twine upload dist/* --verbose -u "__token__" -p "${{ inputs.pypi-token }}"
        fi

    - name: Create Release
      uses: ./.github/actions/create-version-release
      with:
        github-token: ${{ inputs.github-token }}

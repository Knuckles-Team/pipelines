name: Checkout and verify source
description: Check out the workflow commit and bind it for later integrity checks.
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Bind source commit
      uses: ./.github/actions/verify-source-commit
      with:
        phase: before

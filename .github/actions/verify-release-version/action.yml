name: Verify release version
description: >-
  Fail before any build when the pushed release tag vX.Y.Z differs from the package version the
  build will stamp, when .bumpversion.cfg disagrees, or when that version is already on PyPI.
  Explicit published-wheel mode instead verifies an existing public pure-Python wheel against
  the reviewed package payload and Dockerfile pin before container publication.
inputs:
  mode:
    description: unpublished checks the release tag; published-wheel binds an existing public pure-Python wheel to reviewed container source.
    default: unpublished
  distribution:
    description: Exact project distribution name for published-wheel; the central container workflow can infer it.
    default: ""
  module:
    description: Exact Python package module whose complete payload must match reviewed HEAD; the central container workflow can infer it for one connector module.
    default: ""
  dockerfile:
    description: Reviewed Dockerfile path for published-wheel.
    default: docker/Dockerfile
  docker-root:
    description: Optional checkout holding the Dockerfile when package source and build source are intentionally frozen separately.
    default: ''
  extras:
    description: Exact extras in the Dockerfile package pin.
    default: mcp
  legacy-profile:
    description: Preserve a reviewed tracked wheel-only package tree without running the current ontology renderer.
    default: false
  root:
    description: Directory holding the package pyproject.toml.
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - name: Verify tag, package version and PyPI
      if: inputs.mode == 'unpublished'
      shell: bash
      env:
        RELEASE_REF: ${{ github.ref }}
        RELEASE_ROOT: ${{ inputs.root }}
      run: python3 -I "${{ github.action_path }}/verify_release_version.py" --root "$RELEASE_ROOT" --ref "$RELEASE_REF"
    - name: Set up uv for published wheel verification
      if: inputs.mode == 'published-wheel'
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
    - name: Verify published wheel payload and container pin
      if: inputs.mode == 'published-wheel'
      shell: bash
      env:
        RELEASE_ROOT: ${{ inputs.root }}
        RELEASE_DISTRIBUTION: ${{ inputs.distribution }}
        RELEASE_MODULE: ${{ inputs.module }}
        RELEASE_DOCKERFILE: ${{ inputs.dockerfile }}
        RELEASE_DOCKER_ROOT: ${{ inputs.docker-root }}
        RELEASE_EXTRAS: ${{ inputs.extras }}
        RELEASE_LEGACY_PROFILE: ${{ inputs.legacy-profile }}
      run: |
        docker_root=()
        legacy_profile=()
        if [[ -n "$RELEASE_DOCKER_ROOT" ]]; then docker_root=(--docker-root "$RELEASE_DOCKER_ROOT"); fi
        if [[ "${RELEASE_LEGACY_PROFILE,,}" == true ]]; then legacy_profile=(--legacy-profile); fi
        python3 -I "${{ github.action_path }}/public_wheel.py" \
          --root "$RELEASE_ROOT" --distribution "$RELEASE_DISTRIBUTION" \
          --module "$RELEASE_MODULE" --dockerfile "$RELEASE_DOCKERFILE" --extras "$RELEASE_EXTRAS" \
          "${docker_root[@]}" "${legacy_profile[@]}"
    - name: Validate guard mode
      shell: bash
      env:
        GUARD_MODE: ${{ inputs.mode }}
      run: |
        case "$GUARD_MODE" in unpublished|published-wheel) ;; *) echo "Unknown release guard mode" >&2; exit 1 ;; esac

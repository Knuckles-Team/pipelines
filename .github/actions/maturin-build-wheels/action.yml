name: Build and upload a maturin wheel
description: >-
  Checkout, build a maturin wheel for one target, and upload it as a workflow
  artifact. Shared by maturin_pipeline.yml's macOS and Windows jobs, which
  build one target each with no platform-specific step in between.
inputs:
  target:
    description: Rust/Python target triple passed to PyO3/maturin-action.
    required: true
  artifact-name:
    description: Name of the uploaded artifact.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Verify source commit before build
      shell: bash
      env:
        EXPECTED_COMMIT: ${{ github.sha }}
      run: |
        SOURCE_COMMIT=$(git rev-parse --verify HEAD)
        if [ -z "$EXPECTED_COMMIT" ] || [ "$SOURCE_COMMIT" != "$EXPECTED_COMMIT" ]; then
          echo "checked-out commit ${SOURCE_COMMIT} does not match github.sha ${EXPECTED_COMMIT}" >&2
          exit 1
        fi
        echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"

    - name: Build wheels
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
      with:
        target: ${{ inputs.target }}
        args: --release --out dist

    - name: Verify source commit after build
      shell: bash
      run: |
        if [ "$(git rev-parse --verify HEAD)" != "$SOURCE_COMMIT" ]; then
          echo "HEAD changed while building the wheel" >&2
          exit 1
        fi

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: dist

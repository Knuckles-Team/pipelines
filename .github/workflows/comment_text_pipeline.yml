name: Comment text

# PIPE-GATES-R099 (pull request, comment and commit text is self-evident), comment half:
# lint each new issue or pull request comment and each new pull request review comment for
# internal references, workflow jargon and bare row IDs. The `pr-text` job of
# gates_pipeline.yml lints the pull request title and body; this workflow covers the comments,
# which that job never sees because it runs on `pull_request` only.
#
# Caller contract (copy templates/workflows/comment-text.yml):
#
#   on:
#     issue_comment:
#       types: [created, edited]
#     pull_request_review_comment:
#       types: [created, edited]
#   jobs:
#     comment-text:
#       uses: Knuckles-Team/pipelines/.github/workflows/comment_text_pipeline.yml@main
#
# Staged: findings are reported as warnings and the job passes. A caller sets
# `pr-text-strict: true` to make a finding fail the job. The comment text reaches the linter
# through an environment variable, never through shell interpolation.

on:
  workflow_call:
    inputs:
      pr-text-strict:
        description: >-
          Make a finding in a comment fail the job. The default reports warnings only.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  comment-text:
    name: comment-text
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Lint the comment for internal references
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_TEXT_STRICT: ${{ inputs.pr-text-strict }}
          PIPELINES_SOURCE: git+https://github.com/${{ job.workflow_repository }}@${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          uvx --from "$PIPELINES_SOURCE" pipelines-hook pr-text --comment "$COMMENT_BODY"

name: Connector SDK rebuild

# PIPE-RELEASE-R001.14: a new SDK release reaches running connector images
# with no commit in any connector. The caller triggers this workflow on a repository_dispatch
# from the SDK release (type sdk-release, client_payload.sdk_version) and on a daily schedule
# (the scheduled check). It resolves the SDK version and the newest published release (the newest
# vMAJOR.MINOR.PATCH tag whose version the package index serves), skips when the registry already
# holds the image tagged <version>-sdk-scion-sdk-<sdk> and otherwise rebuilds that release through
# container_pipeline.yml, stamping the tag's version, with the files rendered from pyproject.toml.
#
# Caller contract (copy):
#
#   on:
#     repository_dispatch:
#       types: [sdk-release]
#     schedule:
#       - cron: '17 5 * * *'
#     workflow_dispatch:
#       inputs:
#         release_repair:
#           description: Republish the already published container after the reviewed public-wheel guard.
#           required: false
#           default: false
#           type: boolean
#         release_source_sha:
#           description: Full SHA of the original package source that produced the public wheel.
#           required: false
#           default: ''
#           type: string
#         release_source_epoch:
#           description: Exact SOURCE_DATE_EPOCH used to generate the public connector payload.
#           required: false
#           default: ''
#           type: string
#         legacy_profile:
#           description: Preserve the reviewed tracked wheel-only package tree without renderer generation.
#           required: false
#           default: false
#           type: boolean
#   jobs:
#     rebuild:
#       uses: Knuckles-Team/pipelines/.github/workflows/connector_sdk_rebuild_pipeline.yml@main
#       with:
#         release_repair: ${{ inputs.release_repair || false }}
#         legacy_profile: ${{ inputs.legacy_profile || false }}
#         release_source_sha: ${{ inputs.release_source_sha || '' }}
#         release_source_epoch: ${{ inputs.release_source_epoch || '' }}
#       secrets:
#         DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
#         DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
#         DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
#         DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}

on:
  workflow_call:
    inputs:
      sdk_version:
        description: SDK version to build against; empty resolves the dispatch payload, then the latest release on PyPI.
        required: false
        type: string
        default: ''
      release_repair:
        description: >-
          Explicit reviewed release repair. Only a workflow_dispatch on the current main HEAD
          may publish the already published connector source through the guarded container path.
        required: false
        type: boolean
        default: false
      release_source_sha:
        description: Full immutable source SHA that produced the already-published connector wheel.
        required: false
        type: string
        default: ''
      release_source_epoch:
        description: Exact SOURCE_DATE_EPOCH used to generate the already-published connector payload.
        required: false
        type: string
        default: ''
      legacy_profile:
        description: >-
          Explicit wheel-only legacy profile. The repair proves the immutable public package
          source and builds the current main tracked Dockerfile with render_connector=false.
        required: false
        type: boolean
        default: false
    secrets:
      DOCKER_REGISTRY:
        required: false
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
      DOCKER_REPOSITORY:
        required: false

permissions:
  contents: read

jobs:
  resolve:
    name: resolve
    runs-on: self-hosted
    outputs:
      sdk_version: ${{ steps.sdk.outputs.sdk_version }}
      stale: ${{ steps.sdk.outputs.stale }}
      source_ref: ${{ steps.sdk-context.outputs.source_ref }}
      release_tag: ${{ steps.latest-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # Main may carry a version bump that is not released yet, and a release tag may sit
      # ahead of its own pyproject.toml (the tag carries the version). Outside a release repair
      # the rebuild targets the newest published release: the newest vMAJOR.MINOR.PATCH tag
      # whose version the package index serves (PIPE-RELEASE-R001.14).
      - name: Find the newest published release tag
        id: latest-tag
        if: inputs.release_repair != true
        run: |
          set -euo pipefail
          name="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["name"])')"
          published="$(python3 -c '
          import json, re, sys, urllib.error, urllib.request
          name = re.sub(r"[-_.]+", "-", sys.argv[1]).lower()
          try:
              body = urllib.request.urlopen("https://pypi.org/pypi/" + name + "/json", timeout=60).read()
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              body = b"{\"releases\": {}}"
          print("\n".join(json.loads(body)["releases"]))
          ' "$name")"
          tag=''
          while IFS= read -r candidate; do
            if grep -qxF -- "${candidate#v}" <<< "$published"; then
              tag="$candidate"
              break
            fi
          done < <(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [[ -z "$tag" ]]; then
            echo "::notice::No v* release tag of ${name} is published on the package index yet; nothing to rebuild."
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout latest released tag
        if: inputs.release_repair != true && steps.latest-tag.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: refs/tags/${{ steps.latest-tag.outputs.tag }}
          path: .latest-release
          persist-credentials: false

      - name: Validate release source checkout destination
        if: inputs.release_repair == true
        run: |
          set -euo pipefail
          if [[ -e .release-source || -L .release-source ]]; then
            echo '::error::Immutable release source checkout destination already exists.'
            exit 1
          fi

      - name: Checkout immutable release source
        if: inputs.release_repair == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.release_source_sha }}
          fetch-depth: 0
          path: .release-source
          persist-credentials: false

      - name: Select SDK resolution context
        id: sdk-context
        env:
          RELEASE_REPAIR: ${{ inputs.release_repair }}
          LEGACY_PROFILE: ${{ inputs.legacy_profile }}
          LATEST_TAG: ${{ steps.latest-tag.outputs.tag }}
        run: |
          set -euo pipefail
          context=.
          source_ref=''
          if [[ "${RELEASE_REPAIR,,}" == true && "${LEGACY_PROFILE,,}" != true ]]; then
            context=.release-source
          elif [[ "${RELEASE_REPAIR,,}" != true && -n "$LATEST_TAG" ]]; then
            context=.latest-release
            source_ref="refs/tags/$LATEST_TAG"
          fi
          printf 'path=%s\n' "$context" >> "$GITHUB_OUTPUT"
          printf 'source_ref=%s\n' "$source_ref" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        if: inputs.release_repair != true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve the SDK version and whether the image is stale
        id: sdk
        env:
          INPUT_SDK: ${{ inputs.sdk_version }}
          PAYLOAD_SDK: ${{ github.event.client_payload.sdk_version }}
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          RELEASE_REPAIR: ${{ inputs.release_repair }}
          SDK_CONTEXT: ${{ steps.sdk-context.outputs.path }}
          SOURCE_REF: ${{ steps.sdk-context.outputs.source_ref }}
          LATEST_TAG: ${{ steps.latest-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_REPAIR,,}" != true && -z "$SOURCE_REF" ]]; then
            echo '::notice::No v* release tag exists yet; skipping the SDK rebuild.'
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sdk_distribution=scion-sdk
          sdk="${INPUT_SDK:-${PAYLOAD_SDK:-}}"
          if [[ -z "$sdk" ]]; then
            sdk="$(python3 -c 'import json,sys,urllib.request as u;print(json.load(u.urlopen("https://pypi.org/pypi/" + sys.argv[1] + "/json"))["info"]["version"])' "$sdk_distribution")"
          fi
          if [[ ! "$sdk" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::SDK version is not MAJOR.MINOR.PATCH."
            exit 1
          fi
          python3 -m pip install --quiet uv
          if [[ "${RELEASE_REPAIR,,}" != true ]]; then
            # The release tag carries the version; its pyproject.toml may lag it.
            version="${LATEST_TAG#v}"
          else
            version="$(uvx --from "git+https://github.com/${PIPELINES_REPOSITORY}@${PIPELINES_SHA}" pipelines-connector version --root "$SDK_CONTEXT" read)"
          fi
          sdk_tag="${version}-sdk-${sdk_distribution}-${sdk}"
          stale=true
          if [[ "${RELEASE_REPAIR,,}" != true ]] && docker buildx imagetools inspect "${IMAGE}:${sdk_tag}" > /dev/null 2>&1; then
            stale=false
          fi
          echo "sdk_version=$sdk" >> "$GITHUB_OUTPUT"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

  rebuild:
    name: rebuild
    needs: resolve
    if: needs.resolve.outputs.stale == 'true'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/container_pipeline.yml@main
    with:
      render_connector: ${{ !inputs.legacy_profile }}
      legacy_profile: ${{ inputs.legacy_profile }}
      release_repair: ${{ inputs.release_repair }}
      release_source_sha: ${{ inputs.release_source_sha }}
      release_source_epoch: ${{ inputs.release_source_epoch }}
      sdk_version: ${{ needs.resolve.outputs.sdk_version }}
      source_ref: ${{ needs.resolve.outputs.source_ref }}
      release_tag: ${{ needs.resolve.outputs.release_tag }}
      stamp_version_from_tag: ${{ needs.resolve.outputs.release_tag != '' }}
    secrets:
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}

name: Connector SDK rebuild

# PIPE-RELEASE-R001.14: a new SDK release reaches running connector images
# with no commit in any connector. The caller triggers this workflow on a repository_dispatch
# from the SDK release (type sdk-release, client_payload.sdk_version and
# client_payload.sdk_distribution) and on a daily schedule
# (the scheduled check). It resolves the SDK version, skips when the registry already holds
# the image tagged <version>-sdk<sdk> and otherwise rebuilds both images through
# container_pipeline.yml with the files rendered from pyproject.toml.
#
# Caller contract (copy):
#
#   on:
#     repository_dispatch:
#       types: [sdk-release]
#     schedule:
#       - cron: '17 5 * * *'
#     workflow_dispatch:
#       inputs:
#         release_repair:
#           description: Republish the already published container after the reviewed public-wheel guard.
#           required: false
#           default: false
#           type: boolean
#         release_source_sha:
#           description: Full SHA of the original package source that produced the public wheel.
#           required: false
#           default: ''
#           type: string
#         release_source_epoch:
#           description: Exact SOURCE_DATE_EPOCH used to generate the public connector payload.
#           required: false
#           default: ''
#           type: string
#         legacy_profile:
#           description: Preserve the reviewed tracked wheel-only package tree without renderer generation.
#           required: false
#           default: false
#           type: boolean
#   jobs:
#     rebuild:
#       uses: Knuckles-Team/pipelines/.github/workflows/connector_sdk_rebuild_pipeline.yml@main
#       with:
#         release_repair: ${{ inputs.release_repair || false }}
#         release_source_sha: ${{ inputs.release_source_sha || '' }}
#         release_source_epoch: ${{ inputs.release_source_epoch || '' }}
#       secrets: inherit

on:
  workflow_call:
    inputs:
      sdk_version:
        description: SDK version to build against; empty resolves the dispatch payload, then the latest release on PyPI.
        required: false
        type: string
        default: ''
      sdk_distribution:
        description: SDK distribution to resolve and pass to the connector renderer; empty detects the project dependency.
        required: false
        type: string
        default: ''
      release_repair:
        description: >-
          Explicit reviewed release repair. Only a workflow_dispatch on the current main HEAD
          may publish the already published connector source through the guarded container path.
        required: false
        type: boolean
        default: false
      release_source_sha:
        description: Full immutable source SHA that produced the already-published connector wheel.
        required: false
        type: string
        default: ''
      release_source_epoch:
        description: Exact SOURCE_DATE_EPOCH used to generate the already-published connector payload.
        required: false
        type: string
        default: ''
      legacy_profile:
        description: >-
          Explicit wheel-only legacy profile. The repair proves the immutable public package
          source and builds the current main tracked Dockerfile with render_connector=false.
        required: false
        type: boolean
        default: false
    secrets:
      DOCKER_REGISTRY:
        required: false
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  resolve:
    name: resolve
    runs-on: self-hosted
    outputs:
      sdk_version: ${{ steps.sdk.outputs.sdk_version }}
      sdk_distribution: ${{ steps.sdk.outputs.sdk_distribution }}
      stale: ${{ steps.sdk.outputs.stale }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release source checkout destination
        if: inputs.release_repair == true
        run: |
          set -euo pipefail
          if [[ -e .release-source || -L .release-source ]]; then
            echo '::error::Immutable release source checkout destination already exists.'
            exit 1
          fi

      - name: Checkout immutable release source
        if: inputs.release_repair == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.release_source_sha }}
          fetch-depth: 0
          path: .release-source
          persist-credentials: false

      - name: Select SDK resolution context
        id: sdk-context
        env:
          RELEASE_REPAIR: ${{ inputs.release_repair }}
          LEGACY_PROFILE: ${{ inputs.legacy_profile }}
        run: |
          set -euo pipefail
          context=.
          if [[ "${RELEASE_REPAIR,,}" == true && "${LEGACY_PROFILE,,}" != true ]]; then
            context=.release-source
          fi
          printf 'path=%s\n' "$context" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        if: inputs.release_repair != true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve the SDK version and whether the image is stale
        id: sdk
        env:
          INPUT_SDK: ${{ inputs.sdk_version }}
          INPUT_SDK_DISTRIBUTION: ${{ inputs.sdk_distribution }}
          PAYLOAD_SDK: ${{ github.event.client_payload.sdk_version }}
          PAYLOAD_SDK_DISTRIBUTION: ${{ github.event.client_payload.sdk_distribution }}
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          RELEASE_REPAIR: ${{ inputs.release_repair }}
          SDK_CONTEXT: ${{ steps.sdk-context.outputs.path }}
        run: |
          set -euo pipefail
          sdk_distribution="${INPUT_SDK_DISTRIBUTION:-${PAYLOAD_SDK_DISTRIBUTION:-}}"
          if [[ -z "$sdk_distribution" ]]; then
            sdk_distribution="$(python3 - <<'PY'
          import os
          import tomllib

          project = tomllib.load(open(os.path.join(os.environ["SDK_CONTEXT"], "pyproject.toml"), "rb")).get("project", {})
          values = list(project.get("dependencies", []))
          for entries in project.get("optional-dependencies", {}).values():
              values.extend(entries)
          names = set()
          for value in values:
              name = str(value).strip()
              for marker in ("[", " ", "<", ">", "=", "!", "~", ";"):
                  name = name.split(marker, 1)[0]
              names.add(name.lower().replace("_", "-").replace(".", "-"))
          print("scion-sdk" if "scion-sdk" in names else "agent-connector-sdk")
          PY
            )"
          fi
          case "$sdk_distribution" in
            agent-connector-sdk|scion-sdk) ;;
            *) echo "::error::Unsupported SDK distribution: $sdk_distribution"; exit 1 ;;
          esac
          sdk="${INPUT_SDK:-${PAYLOAD_SDK:-}}"
          if [[ -z "$sdk" ]]; then
            sdk="$(python3 -c 'import json,sys,urllib.request as u;print(json.load(u.urlopen("https://pypi.org/pypi/" + sys.argv[1] + "/json"))["info"]["version"])' "$sdk_distribution")"
          fi
          if [[ ! "$sdk" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::SDK version is not MAJOR.MINOR.PATCH."
            exit 1
          fi
          python3 -m pip install --quiet uv
          version="$(uvx --from "git+https://github.com/${PIPELINES_REPOSITORY}@${PIPELINES_SHA}" pipelines-connector version --root "$SDK_CONTEXT" read)"
          sdk_tag="${version}-sdk${sdk}"
          if [[ "$sdk_distribution" == "scion-sdk" ]]; then
            sdk_tag="${version}-sdk-${sdk_distribution}-${sdk}"
          fi
          stale=true
          if [[ "${RELEASE_REPAIR,,}" != true ]] && docker buildx imagetools inspect "${IMAGE}:${sdk_tag}" > /dev/null 2>&1; then
            stale=false
          fi
          echo "sdk_version=$sdk" >> "$GITHUB_OUTPUT"
          echo "sdk_distribution=$sdk_distribution" >> "$GITHUB_OUTPUT"
          echo "stale=$stale" >> "$GITHUB_OUTPUT"

  rebuild:
    name: rebuild
    needs: resolve
    if: needs.resolve.outputs.stale == 'true'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/container_pipeline.yml@main
    with:
      render_connector: ${{ !inputs.legacy_profile }}
      legacy_profile: ${{ inputs.legacy_profile }}
      release_repair: ${{ inputs.release_repair }}
      release_source_sha: ${{ inputs.release_source_sha }}
      release_source_epoch: ${{ inputs.release_source_epoch }}
      sdk_version: ${{ needs.resolve.outputs.sdk_version }}
      sdk_distribution: ${{ needs.resolve.outputs.sdk_distribution }}
    secrets: inherit

name: Connector PR

# The fast pull request workflow of the connector fleet (PIPE-RELEASE-R011): the
# caller's pre-commit file at the commit stage, then the affected unit tests, in at
# most 10 minutes. It wraps gates_pipeline.yml with the connector defaults and never
# publishes: release build and publish stay in the connector's own pipeline.yml.
#
# Caller contract (copy; a reusable workflow cannot set the caller's groups):
#
#   on: pull_request
#   concurrency:
#     group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
#     cancel-in-progress: true
#   permissions:
#     contents: read
#   jobs:
#     gates:
#       uses: Knuckles-Team/pipelines/.github/workflows/connector_pr_pipeline.yml@main

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runner label or label list for runs-on.
        required: false
        type: string
        default: '"ubuntu-latest"'
      test-scope:
        description: Tests directory for the affected-test subset; empty disables the test step.
        required: false
        type: string
        default: tests
      sync-args:
        description: Extra arguments for `uv sync --frozen`. A connector with an extra that cannot build on a CPU runner (for example GPU-only wheels) lists the extras to install instead of `--all-extras`.
        required: false
        type: string
        default: --all-extras --all-groups
      skip-hooks:
        description: Comma-separated hook ids exported as SKIP, for hooks that cannot run on a hosted runner. The native scanners are installed below, so none is listed here.
        required: false
        type: string
        default: docker-compose-check

permissions:
  contents: read

jobs:
  gates:
    name: gates
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      config: .pre-commit-config.yaml
      stages: pre-commit
      skip-hooks: ${{ inputs.skip-hooks }}
      # The dupehound-changed hook fails closed in CI without its scanner: the PR gate
      # builds the pinned dupehound (cached) instead of skipping the hook.
      scanners: dupehound
      # The connector hooks are `language: system`: they need the project's own
      # environment (all extras and groups, so the test extra's pytest-asyncio is
      # present), and bun (mermaid-validate) on PATH, as the release pipeline provides.
      setup-command: |
        # The prohibited-identity catalog is operator-owned and never committed: it comes from the caller's
        # PROHIBITED_IDENTITY_CATALOG Actions variable, as in the core repos' CI. A caller without the variable
        # keeps the tracked-privacy hook failing closed (PIPE-GATES-R016.42).
        if [ -n "${PROHIBITED_IDENTITY_CATALOG:-}" ]; then
          mkdir -p "$HOME/.config/agent-utilities/governance"
          printf '%s' "$PROHIBITED_IDENTITY_CATALOG" > "$HOME/.config/agent-utilities/governance/prohibited-identities.json"
        fi
        uv sync --frozen ${{ inputs.sync-args }}
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        # pre-commit runs under uvx, whose own python precedes PATH: expose the project packages too.
        echo "PYTHONPATH=$("$PWD/.venv/bin/python" -c 'import site;print(site.getsitepackages()[0])'):$PWD" >> "$GITHUB_ENV"
        echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
        npm install --global --prefix "$HOME/.npm-global" bun
        echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
      timeout-minutes: 10
      runner: ${{ inputs.runner }}
      test-scope: ${{ inputs.test-scope }}

  # PIPE-RELEASE-R017: a broken Dockerfile is caught on the pull request, not at release. The
  # image builds only when the change touches a container input, because runner capacity is the
  # bottleneck, and a repository without docker/Dockerfile skips cleanly.
  container-inputs:
    name: container-inputs
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
    outputs:
      build: ${{ steps.changed.outputs.build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect container input changes
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ ! -f docker/Dockerfile ]]; then
            echo "No docker/Dockerfile; skipping the container build check."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_REF" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          build=false
          while IFS= read -r path; do
            case "$path" in
              docker/*|Dockerfile*|*/Dockerfile*|.dockerignore|pyproject.toml|uv.lock|package.json|pnpm-lock.yaml|patches/*)
                build=true
                break
                ;;
            esac
          done < <(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "build=$build" >> "$GITHUB_OUTPUT"

  container-build:
    name: container-build
    needs: container-inputs
    if: needs.container-inputs.outputs.build == 'true'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/container_build_check.yml@main

name: Pages

on:
  push:
    branches:
      - main
    paths:
      - pages/**
      - specs/**
      - reference/**
      - .config/spec-dashboard.json
      - scripts/spec_dashboard*.py
      - templates/mkdocs-theme/**
      - .github/workflows/pages_pipeline.yml
      - mkdocs.yml
      - .github/workflows/pages.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages_pipeline.yml
    with:
      content_source: pages
      shared_theme_enabled: true
      spec_dashboard_enabled: true
      spec_dashboard_config: .config/spec-dashboard.json

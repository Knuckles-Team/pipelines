name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      dockerfile:
        required: false
        type: string
        default: 'docker/Dockerfile'
      build_context:
        required: false
        type: string
        default: '.'
      build_target:
        description: Empty preserves agent/mcp detection; default builds the final stage once; otherwise select one named stage.
        required: false
        type: string
        default: ''
      runtime_artifact_id:
        description: Immutable artifact ID from an upstream producer in this workflow run; requires all runtime provenance inputs.
        required: false
        type: string
        default: ''
      runtime_profile:
        description: Verified context profile (graphos or connector/<distribution>); empty disables runtime staging.
        required: false
        type: string
        default: ''
      source_revision:
        description: Full caller source SHA, equal to github.sha and the selected first-party source receipt.
        required: false
        type: string
        default: ''
      graph_os_revision:
        description: Full GraphOS source SHA; required exactly when the profile includes graph-os.
        required: false
        type: string
        default: ''
      runtime_lock_sha256:
        description: Expected SHA256 of the producer-qualified requirements.lock.
        required: false
        type: string
        default: ''
      source_freeze_sha256:
        description: Expected SHA256 of the producer-qualified source-freeze.json, binding all wheel bytes and receipts.
        required: false
        type: string
        default: ''
    secrets:
      DOCKER_REGISTRY:
        required: false
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
      DOCKER_REPOSITORY:
        required: false

permissions:
  contents: read

jobs:
  publish-docker:
    runs-on: self-hosted

    # Two right-sized images from the ONE multi-stage docker/Dockerfile, one matrix
    # leg per build target:
    #   - agent  (DEFAULT, full runtime): tags latest / <branch> / sha-<sha>
    #   - mcp    (slim, MCP-server only):  tags mcp / <branch>-mcp / sha-<sha>-mcp
    # The agent image overlaps latest/main; mcp is the slimmed variant tag. fail-fast is
    # off so one leg failing (e.g. a single-server package without that target) never
    # cancels the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: agent
            suffix: ''
            main_tag: latest
          - target: mcp
            suffix: '-mcp'
            main_tag: mcp

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Single-surface packages ship only one stage (e.g. an agent-only or mcp-only
      # package). If this leg's target stage isn't in the Dockerfile, skip the build
      # so the missing leg is a clean no-op instead of failing the run. A genuinely
      # broken build of a stage that DOES exist still fails (below).
      - name: Detect build target
        id: target
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          REQUESTED_TARGET: ${{ inputs.build_target }}
          MATRIX_TARGET: ${{ matrix.target }}
          RUNTIME_REQUEST: ${{ inputs.runtime_artifact_id }}${{ inputs.runtime_profile }}${{ inputs.source_revision }}${{ inputs.graph_os_revision }}${{ inputs.runtime_lock_sha256 }}${{ inputs.source_freeze_sha256 }}
        run: |
          set -euo pipefail
          if [[ -n "$RUNTIME_REQUEST" ]]; then
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
          else
            echo 'runtime=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$RUNTIME_REQUEST" && -z "$REQUESTED_TARGET" ]]; then
            echo '::error::Runtime staging requires an explicit build_target.'
            exit 1
          fi
          if [[ -n "$REQUESTED_TARGET" && ! "$REQUESTED_TARGET" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]; then
            echo '::error::Invalid build_target.'
            exit 1
          fi
          selected_leg=agent
          if [[ "$REQUESTED_TARGET" == mcp ]]; then
            selected_leg=mcp
          fi
          if [[ -n "$REQUESTED_TARGET" && "$MATRIX_TARGET" != "$selected_leg" ]]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target="${REQUESTED_TARGET:-$MATRIX_TARGET}"
          echo "cache-key=$target" >> "$GITHUB_OUTPUT"
          if [[ "$target" == default ]]; then
            echo 'target=' >> "$GITHUB_OUTPUT"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif awk -v target="$target" 'toupper($1)=="FROM" {for(i=2;i<NF;i++) if(toupper($i)=="AS" && $(i+1)==target) found=1} END {exit !found}' "$DOCKERFILE"; then
            echo "target=$target" >> "$GITHUB_OUTPUT"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$REQUESTED_TARGET" ]]; then
            echo '::error::Requested stage is absent from the Dockerfile.'
            exit 1
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Dockerfile has no '$target' stage — skipping this leg (single-surface package)."
          fi

      - name: Checkout pipeline contract
        if: &stage_runtime steps.target.outputs.exists == 'true' && steps.target.outputs.runtime == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-contract
          persist-credentials: false

      - name: Stage verified runtime context
        id: runtime
        if: *stage_runtime
        uses: ./.pipeline-contract/.github/actions/stage-container-runtime
        with:
          build-context: ${{ inputs.build_context }}
          artifact-id: ${{ inputs.runtime_artifact_id }}
          profile: ${{ inputs.runtime_profile }}
          source-revision: ${{ inputs.source_revision }}
          graph-os-revision: ${{ inputs.graph_os_revision }}
          lock-sha256: ${{ inputs.runtime_lock_sha256 }}
          freeze-sha256: ${{ inputs.source_freeze_sha256 }}

      - name: Set up Docker Buildx
        if: steps.target.outputs.exists == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Image = <docker-hub-user>/<repo-name>, e.g. knucklessg1/openbao-mcp
          # (matches the *-mcp Portainer stack image refs). Derived from the repo
          # name so no per-repo DOCKER_REPOSITORY secret is needed.
          images: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          # Per-target tagging: the agent leg gets the bare tags (latest/<branch>/sha),
          # the mcp leg gets the same set suffixed with -mcp, plus its `mcp` main tag.
          tags: |
            type=ref,event=branch,suffix=${{ matrix.suffix }}
            type=ref,event=pr,suffix=${{ matrix.suffix }}
            type=sha,suffix=${{ matrix.suffix }}
            type=raw,value=${{ matrix.main_tag }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Build + push with up to 3 attempts. Docker Hub intermittently 400s a layer
      # blob PUT ("400 Bad request" HTML from the CDN edge) on an otherwise-healthy
      # push; a clean retry succeeds. The layer cache holds the already-built layers,
      # so retry attempts skip the rebuild and only re-push — cheap and fast.
      # Cache backend = REGISTRY (Docker Hub `:buildcache` tag), NOT `type=gha`: the
      # GHA cache backend's Azure SAS token expires on long builds → "Signature not
      # valid in the specified time frame", which intermittently fails the build. The
      # registry cache reuses the already-authenticated Docker login (no SAS token),
      # so it's durable. ignore-error on cache-to keeps cache an optimization, never a gate.
      # Per-target buildcache tag so the agent/mcp legs don't clobber each other's cache.
      # The three attempts below share one `with:` block via a YAML anchor
      # (&docker_build_push_with / *docker_build_push_with) so the block is
      # spelled out exactly once — a differential clone gate over the raw
      # workflow text would otherwise see the same duplicated block whenever
      # its content changes (e.g. a routine action-version bump), even though
      # the retry-with-identical-config duplication itself is intentional.
      - name: Build and push Docker image (attempt 1)
        id: buildx1
        if: steps.target.outputs.exists == 'true'
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with: &docker_build_push_with
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ steps.target.outputs.target }}
          build-args: ${{ steps.runtime.outputs.build-args }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: false
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:buildcache-${{ steps.target.outputs.cache-key }}
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:buildcache-${{ steps.target.outputs.cache-key }},mode=max,ignore-error=true

      - name: Wait before retry
        if: steps.buildx1.outcome == 'failure'
        run: sleep 30

      - name: Build and push Docker image (attempt 2)
        id: buildx2
        if: steps.buildx1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with: *docker_build_push_with

      - name: Wait before final retry
        if: steps.buildx1.outcome == 'failure' && steps.buildx2.outcome == 'failure'
        run: sleep 60

      - name: Build and push Docker image (final attempt)
        if: steps.buildx1.outcome == 'failure' && steps.buildx2.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with: *docker_build_push_with

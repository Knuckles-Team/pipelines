name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      dockerfile:
        required: false
        type: string
        default: 'docker/Dockerfile'
      build_context:
        required: false
        type: string
        default: '.'
      render_connector:
        description: >-
          Connector repository: render docker/Dockerfile, docker/debug.Dockerfile and the
          compose files from pyproject.toml and the shared templates before the build
          (pipelines-connector render, PIPE-RELEASE-R001.13). The connector commits none of them.
        required: false
        type: boolean
        default: false
      sdk_version:
        description: >-
          SDK version this build re-resolves inside the wheel's supported range
          (PIPE-RELEASE-R001.14). Passed as build-arg SDK_VERSION and added to the image tags as
          <version>-sdk<sdk_version>. Empty resolves nothing and adds no tag.
        required: false
        type: string
        default: ''
      sdk_distribution:
        description: SDK distribution to refresh in a rendered connector image; empty preserves the legacy SDK tag and renderer detection.
        required: false
        type: string
        default: ''
      build_target:
        description: Empty preserves agent/mcp detection; default builds the final stage once; otherwise select one named stage.
        required: false
        type: string
        default: ''
      runtime_artifact_id:
        description: Immutable artifact ID from an upstream producer in this workflow run; requires all runtime provenance inputs.
        required: false
        type: string
        default: ''
      runtime_profile:
        description: Verified /2 profile (arbora or connector/<distribution>/<mcp|agent>); empty disables runtime staging.
        required: false
        type: string
        default: ''
      source_revision:
        description: Full caller source SHA, equal to github.sha and the selected first-party source receipt.
        required: false
        type: string
        default: ''
      arbora_revision:
        description: Full Arbora source SHA; required exactly when the profile includes arbora.
        required: false
        type: string
        default: ''
      runtime_lock_sha256:
        description: Expected SHA256 of the producer-qualified requirements.lock.
        required: false
        type: string
        default: ''
      source_freeze_sha256:
        description: Expected SHA256 of the producer-qualified source-freeze.json, binding all wheel bytes and receipts.
        required: false
        type: string
        default: ''
    secrets:
      DOCKER_REGISTRY:
        required: false
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
      DOCKER_REPOSITORY:
        required: false

permissions:
  contents: read

jobs:
  publish-docker:
    runs-on: self-hosted

    # Two right-sized images from the ONE multi-stage docker/Dockerfile, one matrix
    # leg per build target:
    #   - agent  (DEFAULT, full runtime): tags latest / <version> / <branch> / sha-<sha>
    #   - mcp    (slim, MCP-server only):  tags mcp / <version>-mcp / <branch>-mcp / sha-<sha>-mcp
    # The agent image overlaps latest/main; mcp is the slimmed variant tag. fail-fast is
    # off so one leg failing (e.g. a single-server package without that target) never
    # cancels the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: agent
            suffix: ''
            main_tag: latest
          - target: mcp
            suffix: '-mcp'
            main_tag: mcp

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Determine whether to render connector container files
        id: render-needed
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          RENDER_CONNECTOR: ${{ inputs.render_connector }}
        run: |
          set -euo pipefail
          render=false
          if [[ "${RENDER_CONNECTOR,,}" == true ]]; then
            render=true
          elif [[ "$DOCKERFILE" == docker/Dockerfile && ! -e "$DOCKERFILE" && ! -L "$DOCKERFILE" && -f pyproject.toml ]]; then
            if python3 - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          import tomllib

          try:
              pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          except (OSError, tomllib.TOMLDecodeError):
              sys.exit(1)
          points = pyproject.get("project", {}).get("entry-points", {}).get("agent_connector_sdk.connector", {})
          sources = subprocess.run(
              ["git", "ls-files", "--", "*connector_sources.py"], capture_output=True, text=True, check=False
          ).stdout.splitlines()
          sys.exit(
              0
              if (isinstance(points, dict) and bool(points))
              or any(Path(path).name == "connector_sources.py" for path in sources)
              else 1
          )
          PY
            then
              render=true
            fi
          fi
          printf 'render=%s\n' "$render" >> "$GITHUB_OUTPUT"

      - name: Render the connector container files
        id: render
        if: steps.render-needed.outputs.render == 'true'
        env:
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
          SDK_VERSION: ${{ inputs.sdk_version }}
          SDK_DISTRIBUTION: ${{ inputs.sdk_distribution }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet uv
          render=(uvx --from "git+https://github.com/${PIPELINES_REPOSITORY}@${PIPELINES_SHA}" pipelines-connector render --root . --out docker)
          if [[ -n "$SDK_DISTRIBUTION" ]]; then
            case "$SDK_DISTRIBUTION" in
              agent-connector-sdk|scion-sdk) ;;
              *) echo "::error::Unsupported SDK distribution: $SDK_DISTRIBUTION"; exit 1 ;;
            esac
            render+=(--sdk-distribution "$SDK_DISTRIBUTION")
          fi
          "${render[@]}"
          if [[ -n "$SDK_VERSION" ]]; then
            printf 'build-args<<EOF\nSDK_VERSION=%s\nEOF\n' "$SDK_VERSION" >> "$GITHUB_OUTPUT"
          fi

      # Single-surface packages ship only one stage (e.g. an agent-only or mcp-only
      # package). If this leg's target stage isn't in the Dockerfile, skip the build
      # so the missing leg is a clean no-op instead of failing the run. A genuinely
      # broken build of a stage that DOES exist still fails (below).
      - name: Detect build target
        id: target
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          REQUESTED_TARGET: ${{ inputs.build_target }}
          MATRIX_TARGET: ${{ matrix.target }}
          RUNTIME_REQUEST: ${{ inputs.runtime_artifact_id }}${{ inputs.runtime_profile }}${{ inputs.source_revision }}${{ inputs.arbora_revision }}${{ inputs.runtime_lock_sha256 }}${{ inputs.source_freeze_sha256 }}
        run: |
          set -euo pipefail
          if [[ -n "$RUNTIME_REQUEST" ]]; then
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
          else
            echo 'runtime=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$RUNTIME_REQUEST" && -z "$REQUESTED_TARGET" ]]; then
            echo '::error::Runtime staging requires an explicit build_target.'
            exit 1
          fi
          if [[ -n "$REQUESTED_TARGET" && ! "$REQUESTED_TARGET" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]; then
            echo '::error::Invalid build_target.'
            exit 1
          fi
          selected_leg=agent
          if [[ "$REQUESTED_TARGET" == mcp ]]; then
            selected_leg=mcp
          fi
          if [[ -n "$REQUESTED_TARGET" && "$MATRIX_TARGET" != "$selected_leg" ]]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target="${REQUESTED_TARGET:-$MATRIX_TARGET}"
          echo "cache-key=$target" >> "$GITHUB_OUTPUT"
          if [[ "$target" == default ]]; then
            echo 'target=' >> "$GITHUB_OUTPUT"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif awk -v target="$target" '{sub(/\r$/, "", $0)} toupper($1)=="FROM" {for(i=2;i<NF;i++) if(toupper($i)=="AS" && $(i+1)==target) found=1} END {exit !found}' "$DOCKERFILE"; then
            echo "target=$target" >> "$GITHUB_OUTPUT"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$REQUESTED_TARGET" ]]; then
            echo '::error::Requested stage is absent from the Dockerfile.'
            exit 1
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Dockerfile has no '$target' stage — skipping this leg (single-surface package)."
          fi

      - name: Validate pipeline checkout destination
        if: &stage_runtime steps.target.outputs.exists == 'true' && steps.target.outputs.runtime == 'true'
        env:
          CONTRACT_PATH: ${{ github.workspace }}/.pipeline-contract
        run: |
          set -euo pipefail
          if [[ -e "$CONTRACT_PATH" || -L "$CONTRACT_PATH" ]]; then
            echo '::error::Pipeline checkout destination already exists; refusing to replace caller content.'
            exit 1
          fi

      - name: Checkout pipeline contract
        if: *stage_runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-contract
          persist-credentials: false

      - name: Stage verified runtime context
        id: runtime
        if: *stage_runtime
        uses: ./.pipeline-contract/.github/actions/stage-container-runtime
        with:
          build-context: ${{ inputs.build_context }}
          build-target: ${{ inputs.build_target }}
          artifact-id: ${{ inputs.runtime_artifact_id }}
          profile: ${{ inputs.runtime_profile }}
          source-revision: ${{ inputs.source_revision }}
          arbora-revision: ${{ inputs.arbora_revision }}
          lock-sha256: ${{ inputs.runtime_lock_sha256 }}
          freeze-sha256: ${{ inputs.source_freeze_sha256 }}

      # PIPE-RELEASE-R015: reuse ONE named BuildKit builder per runner pod instead of
      # creating and removing a builder every job. Each pod's Docker daemon (and its
      # volumes) outlives the runner container, so the builder and its local layer
      # cache survive between jobs. Per-job create/boot cost 130-900 s and removal up
      # to 490 s on a busy daemon (measured on connector release runs); a warm builder
      # costs seconds and keeps base-image and dependency layers local. The registry
      # cache below still carries layers across pods. A wedged builder is replaced.
      - name: Use the persistent BuildKit builder
        id: builder
        if: steps.target.outputs.exists == 'true'
        env:
          BUILDER_NAME: ci-shared
        run: |
          set -euo pipefail
          flags='--allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host'
          boot() {
            docker buildx inspect "$BUILDER_NAME" > /dev/null 2>&1 \
              || docker buildx create --name "$BUILDER_NAME" --driver docker-container --buildkitd-flags "$flags" > /dev/null
            timeout 300 docker buildx inspect --bootstrap "$BUILDER_NAME" > /dev/null
          }
          if ! boot; then
            echo '::warning::Persistent builder did not boot; replacing it.'
            docker buildx rm --force "$BUILDER_NAME" > /dev/null 2>&1 || true
            boot
          fi
          echo "name=$BUILDER_NAME" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Version tags (<version> on the agent leg, <version>-mcp on the mcp leg) so a
      # deploy can pin by release instead of a floating tag or a digest. The version is
      # the package's own: [project].version of pyproject.toml, else [package].version
      # of Cargo.toml, read from the build context and then the repo root. A setuptools
      # dynamic version (`[tool.setuptools.dynamic] version = {attr = "..."}`) is read
      # from that module's literal `__version__`. A package with none of these skips
      # the version tags with a notice; the
      # other tags are unchanged. A version that is not a valid Docker tag fails.
      - name: Resolve package version
        id: version
        if: steps.target.outputs.exists == 'true'
        env:
          BUILD_CONTEXT: ${{ inputs.build_context }}
        run: |
          set -euo pipefail
          read_version() {
            # $1 = manifest, $2 = table holding a static `version = "..."`
            awk -v table="$2" '
              {sub(/\r$/, "", $0)}
              /^[[:space:]]*\[/ {in_table = ($0 ~ "^[[:space:]]*\\[" table "\\][[:space:]]*(#.*)?$"); next}
              in_table && /^[[:space:]]*version[[:space:]]*=/ {
                line = $0; sub(/^[^=]*=[[:space:]]*/, "", line)
                if (match(line, /^"[^"]*"/) || match(line, /^\047[^\047]*\047/)) {print substr(line, 2, RLENGTH - 2); exit}
              }' "$1"
          }
          read_dynamic_version() {
            # $1 = project dir. setuptools `version = {attr = "pkg.mod.__version__"}`:
            # read the literal `__version__ = "..."` from that module's source (never imported).
            local attr module file
            attr="$(awk '
              {sub(/\r$/, "", $0)}
              /^[[:space:]]*\[/ {in_table = ($0 ~ "^[[:space:]]*\\[tool\\.setuptools\\.dynamic\\][[:space:]]*(#.*)?$"); next}
              in_table && /^[[:space:]]*version[[:space:]]*=/ {
                if (match($0, /attr[[:space:]]*=[[:space:]]*"[A-Za-z0-9_.]+"/)) {
                  value = substr($0, RSTART, RLENGTH); sub(/^[^"]*"/, "", value); sub(/"$/, "", value); print value; exit
                }
              }' "$1/pyproject.toml")"
            [[ "$attr" == *.* ]] || return 0
            module="${attr%.*}"; module="${module//.//}"
            for file in "$1/$module.py" "$1/$module/__init__.py" "$1/src/$module.py" "$1/src/$module/__init__.py"; do
              if [[ -f "$file" ]]; then
                sed -nE "s/^${attr##*.}[[:space:]]*=[[:space:]]*[\"']([^\"']+)[\"'].*/\\1/p" "$file" | head -n 1
                return 0
              fi
            done
          }
          version=''
          for dir in "$BUILD_CONTEXT" .; do
            if [[ -z "$version" && -f "$dir/pyproject.toml" ]]; then
              version="$(read_version "$dir/pyproject.toml" project)"
            fi
            if [[ -z "$version" && -f "$dir/pyproject.toml" ]]; then
              version="$(read_dynamic_version "$dir")"
            fi
            if [[ -z "$version" && -f "$dir/Cargo.toml" ]]; then
              version="$(read_version "$dir/Cargo.toml" package)"
            fi
          done
          version="${version#v}"
          version="${version//+/-}"
          if [[ -z "$version" ]]; then
            echo '::notice::No static package version found; skipping version tags.'
            echo 'version=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,119}$ ]]; then
            echo '::error::Package version is not a valid Docker tag.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Image = <docker-hub-user>/<repo-name>, e.g. knucklessg1/openbao-mcp
          # (matches the *-mcp Portainer stack image refs). Derived from the repo
          # name so no per-repo DOCKER_REPOSITORY secret is needed.
          images: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          # Per-target tagging: the agent leg gets the bare tags (latest/<branch>/sha),
          # the mcp leg gets the same set suffixed with -mcp, plus its `mcp` main tag.
          tags: |
            type=ref,event=branch,suffix=${{ matrix.suffix }}
            type=ref,event=pr,suffix=${{ matrix.suffix }}
            type=sha,suffix=${{ matrix.suffix }}
            type=raw,value=${{ matrix.main_tag }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.version }},suffix=${{ matrix.suffix }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.version != '' }}
            type=raw,value=${{ steps.version.outputs.version }}-sdk${{ inputs.sdk_version }}${{ matrix.suffix }},enable=${{ inputs.sdk_version != '' && steps.version.outputs.version != '' && inputs.sdk_distribution != 'scion-sdk' }}
            type=raw,value=${{ steps.version.outputs.version }}-sdk-${{ inputs.sdk_distribution }}-${{ inputs.sdk_version }}${{ matrix.suffix }},enable=${{ inputs.sdk_version != '' && steps.version.outputs.version != '' && inputs.sdk_distribution == 'scion-sdk' }}

      # Build + push with up to 3 attempts. Docker Hub intermittently 400s a layer
      # blob PUT ("400 Bad request" HTML from the CDN edge) on an otherwise-healthy
      # push; a clean retry succeeds. The layer cache holds the already-built layers,
      # so retry attempts skip the rebuild and only re-push — cheap and fast.
      # Cache backend = REGISTRY (Docker Hub `:buildcache` tag), NOT `type=gha`: the
      # GHA cache backend's Azure SAS token expires on long builds → "Signature not
      # valid in the specified time frame", which intermittently fails the build. The
      # registry cache reuses the already-authenticated Docker login (no SAS token),
      # so it's durable. ignore-error on cache-to keeps cache an optimization, never a gate.
      # Per-target buildcache tag so the agent/mcp legs don't clobber each other's cache.
      # The three attempts below share one `with:` block via a YAML anchor
      # (&docker_build_push_with / *docker_build_push_with) so the block is
      # spelled out exactly once — a differential clone gate over the raw
      # workflow text would otherwise see the same duplicated block whenever
      # its content changes (e.g. a routine action-version bump), even though
      # the retry-with-identical-config duplication itself is intentional.
      - name: Build and push Docker image (attempt 1)
        id: buildx1
        if: steps.target.outputs.exists == 'true'
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with: &docker_build_push_with
          builder: ${{ steps.builder.outputs.name }}
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ steps.target.outputs.target }}
          build-args: |
            ${{ steps.runtime.outputs.build-args }}
            ${{ steps.render.outputs.build-args }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: false
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:buildcache-${{ steps.target.outputs.cache-key }}
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:buildcache-${{ steps.target.outputs.cache-key }},mode=max,ignore-error=true

      - name: Wait before retry
        if: steps.buildx1.outcome == 'failure'
        run: sleep 30

      - name: Build and push Docker image (attempt 2)
        id: buildx2
        if: steps.buildx1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with: *docker_build_push_with

      - name: Wait before final retry
        if: steps.buildx1.outcome == 'failure' && steps.buildx2.outcome == 'failure'
        run: sleep 60

      - name: Build and push Docker image (final attempt)
        if: steps.buildx1.outcome == 'failure' && steps.buildx2.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with: *docker_build_push_with

      # Keep the persistent builder's local cache bounded; the registry cache is the
      # durable copy. Never a gate.
      - name: Bound the builder cache
        if: always() && steps.builder.outputs.name != ''
        env:
          BUILDER_NAME: ${{ steps.builder.outputs.name }}
        run: docker buildx prune --builder "$BUILDER_NAME" --force --keep-storage 30gb > /dev/null 2>&1 || true

      # Post-release verification (PIPE-RELEASE-R012): a release publishes both the
      # PyPI version and the <version>-mcp image. This step fails the run when either
      # is missing after the publish, so a skipped or blocked leg is never silent.
      - name: Verify the release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.target.outputs.exists == 'true' && steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SUFFIX: ${{ matrix.suffix }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
          VERIFY_ATTEMPTS: '6'
          VERIFY_DELAY: '20'
        run: |
          set -euo pipefail
          exists() {
            local i
            for ((i = 1; i <= VERIFY_ATTEMPTS; i++)); do
              if curl -fsS -o /dev/null "$1"; then return 0; fi
              sleep "$VERIFY_DELAY"
            done
            return 1
          }
          status=0
          tag="${VERSION}${SUFFIX}"
          if ! exists "https://hub.docker.com/v2/repositories/${DOCKER_USER}/${REPO_NAME}/tags/${tag}"; then
            echo "::error::Docker image ${DOCKER_USER}/${REPO_NAME}:${tag} is missing after the release."
            status=1
          fi
          name=''
          for dir in "$BUILD_CONTEXT" .; do
            if [[ -z "$name" && -f "$dir/pyproject.toml" ]]; then
              name="$(python3 -c 'import sys,tomllib;print(tomllib.load(open(sys.argv[1],"rb")).get("project",{}).get("name",""))' "$dir/pyproject.toml")"
            fi
          done
          if [[ -n "$name" ]] && ! exists "https://pypi.org/pypi/${name}/${VERSION}/json"; then
            echo "::error::PyPI release ${name}==${VERSION} is missing after the release."
            status=1
          fi
          exit "$status"

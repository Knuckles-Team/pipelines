name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      dockerfile:
        required: false
        type: string
        default: 'docker/Dockerfile'
      build_context:
        required: false
        type: string
        default: '.'
      render_connector:
        description: >-
          Connector repository: render docker/Dockerfile, docker/debug.Dockerfile and the
          compose files from pyproject.toml and the shared templates before the build
          (pipelines-connector render, PIPE-RELEASE-R001.13). The connector commits none of them.
        required: false
        type: boolean
        default: false
      legacy_profile:
        description: >-
          Explicit wheel-only legacy profile. Preserve the reviewed tracked package tree and
          tracked custom Dockerfile without invoking the current connector renderer. This may
          be combined with release_repair to build from current main while proving the original
          public wheel source and epoch; it is never inferred from a missing Dockerfile.
        required: false
        type: boolean
        default: false
      release_repair:
        description: >-
          Explicit reviewed release repair. Only a workflow_dispatch on the current main HEAD
          may enable it; the published-wheel guard must pass before registry login/build and the
          existing public PyPI release is only verified, never republished.
        required: false
        type: boolean
        default: false
      release_source_sha:
        description: >-
          Full immutable source SHA that originally produced the already-published wheel. Repair
          requires this commit to be an ancestor of the current main HEAD.
        required: false
        type: string
        default: ''
      release_source_epoch:
        description: Exact SOURCE_DATE_EPOCH used to generate the published connector payload.
        required: false
        type: string
        default: ''
      published_wheel_distribution:
        description: >-
          Optional connector distribution name for the public-wheel release preflight. Empty
          derives the name from reviewed pyproject.toml; non-connectors skip the preflight.
        required: false
        type: string
        default: ''
      published_wheel_module:
        description: >-
          Optional connector Python module for the public-wheel release preflight. Empty derives
          the sole connector entry-point/source module and refuses an ambiguous identity.
        required: false
        type: string
        default: ''
      published_wheel_extras:
        description: Optional assertion for the reviewed target extra; empty derives it from connector metadata.
        required: false
        type: string
        default: ''
      sdk_version:
        description: >-
          SDK version this build re-resolves inside the wheel's supported range
          (PIPE-RELEASE-R001.14). Passed as build-arg SDK_VERSION and added to the image tags as
          <version>-sdk<sdk_version>. Empty resolves nothing and adds no tag.
        required: false
        type: string
        default: ''
      sdk_distribution:
        description: SDK distribution to refresh in a rendered connector image; empty preserves the legacy SDK tag and renderer detection.
        required: false
        type: string
        default: ''
      build_target:
        description: Empty preserves agent/mcp detection; default builds the final stage once; otherwise select one named stage.
        required: false
        type: string
        default: ''
      runtime_artifact_id:
        description: Immutable artifact ID from an upstream producer in this workflow run; requires all runtime provenance inputs.
        required: false
        type: string
        default: ''
      runtime_profile:
        description: Verified /2 profile (arbora or connector/<distribution>/<mcp|agent>); empty disables runtime staging.
        required: false
        type: string
        default: ''
      source_revision:
        description: Full caller source SHA, equal to github.sha and the selected first-party source receipt.
        required: false
        type: string
        default: ''
      arbora_revision:
        description: Full Arbora source SHA; required exactly when the profile includes arbora.
        required: false
        type: string
        default: ''
      runtime_lock_sha256:
        description: Expected SHA256 of the producer-qualified requirements.lock.
        required: false
        type: string
        default: ''
      source_freeze_sha256:
        description: Expected SHA256 of the producer-qualified source-freeze.json, binding all wheel bytes and receipts.
        required: false
        type: string
        default: ''
      stamp_version_from_tag:
        description: >-
          On a v* tag, set [project].version in the build workspace to the tag's version before
          the image version is resolved (PIPE-RELEASE-R018); image tags then derive from the tag.
        required: false
        type: boolean
        default: false
    secrets:
      DOCKER_REGISTRY:
        required: false
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
      DOCKER_REPOSITORY:
        required: false

permissions:
  contents: read

jobs:
  publish-docker:
    runs-on: self-hosted

    # One image from the ONE multi-stage docker/Dockerfile: the MCP server (the
    # default) built from the `mcp` target, with plain tags latest / <version> /
    # <branch> / sha-<sha> and no suffix.
    env:
      BUILD_TARGET: mcp

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # PIPE-RELEASE-R018: the tag carries the version. Main's pyproject lags until the sync
      # pull request merges, so the build workspace takes the tag's version before anything reads it.
      - name: Stamp the tag version
        if: inputs.stamp_version_from_tag && startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          python3 -m pip install --quiet uv
          uvx --from "git+https://github.com/${PIPELINES_REPOSITORY}@${PIPELINES_SHA}" pipelines-connector version --root . set "$version"

      - name: Validate reviewed release repair request
        if: inputs.release_repair == true
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REVIEWED_SHA: ${{ github.sha }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_TARGET: ${{ inputs.build_target }}
          RENDER_CONNECTOR: ${{ inputs.render_connector }}
          LEGACY_PROFILE: ${{ inputs.legacy_profile }}
          SOURCE_SHA: ${{ inputs.release_source_sha }}
          SOURCE_EPOCH: ${{ inputs.release_source_epoch }}
          RUNTIME_INPUTS: ${{ inputs.runtime_artifact_id }}${{ inputs.runtime_profile }}${{ inputs.source_revision }}${{ inputs.arbora_revision }}${{ inputs.runtime_lock_sha256 }}${{ inputs.source_freeze_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == workflow_dispatch ]] || {
            echo '::error::Reviewed release repair requires workflow_dispatch.'
            exit 1
          }
          [[ "$REF" == refs/heads/main ]] || {
            echo "::error::Reviewed release repair requires refs/heads/main, got $REF."
            exit 1
          }
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Reviewed release repair requires a full immutable source SHA.'
            exit 1
          }
          actual_sha="$(git rev-parse --verify HEAD)"
          [[ "$actual_sha" == "$REVIEWED_SHA" ]] || {
            echo "::error::Checked out HEAD $actual_sha does not equal github.sha $REVIEWED_SHA."
            exit 1
          }
          main_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
          [[ "$main_sha" == "$REVIEWED_SHA" ]] || {
            echo "::error::Reviewed release repair requires the current main HEAD ($main_sha), got $REVIEWED_SHA."
            exit 1
          }
          [[ "$BUILD_CONTEXT" == . && "$DOCKERFILE" == docker/Dockerfile ]] || {
            echo '::error::Reviewed release repair only permits the canonical repository Docker context.'
            exit 1
          }
          [[ -z "$BUILD_TARGET" && -z "$RUNTIME_INPUTS" ]] || {
            echo '::error::Reviewed release repair does not accept a runtime artifact or alternate build target.'
            exit 1
          }
          if [[ "${LEGACY_PROFILE,,}" == true ]]; then
            [[ "${RENDER_CONNECTOR,,}" == false ]] || {
              echo '::error::Legacy release repair requires render_connector=false.'
              exit 1
            }
          else
            [[ "${RENDER_CONNECTOR,,}" == true ]] || {
              echo '::error::Reviewed release repair requires the canonical connector renderer.'
              exit 1
            }
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Reviewed release repair requires the original package source SHA.'
            exit 1
          }
          [[ "$SOURCE_EPOCH" =~ ^[0-9]+$ ]] || {
            echo '::error::Reviewed release repair requires the original package generation epoch.'
            exit 1
          }

      - name: Validate legacy profile request
        if: inputs.legacy_profile == true
        env:
          BUILD_CONTEXT: ${{ inputs.build_context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          RENDER_CONNECTOR: ${{ inputs.render_connector }}
          LEGACY_PROFILE: ${{ inputs.legacy_profile }}
        run: |
          set -euo pipefail
          [[ "$BUILD_CONTEXT" == . && "$DOCKERFILE" == docker/Dockerfile ]] || {
            echo '::error::Legacy profile only permits the canonical repository Docker context and tracked Dockerfile path.'
            exit 1
          }
          [[ "${RENDER_CONNECTOR,,}" == false ]] || {
            echo '::error::Legacy profile requires render_connector=false.'
            exit 1
          }

      - name: Validate release source checkout destination
        if: inputs.release_repair == true
        env:
          SOURCE_ROOT: ${{ github.workspace }}/.release-source
        run: |
          set -euo pipefail
          if [[ -e "$SOURCE_ROOT" || -L "$SOURCE_ROOT" ]]; then
            echo '::error::Immutable release source checkout destination already exists.'
            exit 1
          fi

      - name: Checkout immutable release source
        if: inputs.release_repair == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.release_source_sha }}
          fetch-depth: 0
          path: .release-source
          persist-credentials: false

      - name: Validate immutable release source ancestry and epoch
        if: inputs.release_repair == true
        env:
          REVIEWED_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ inputs.release_source_sha }}
          SOURCE_EPOCH: ${{ inputs.release_source_epoch }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git -C .release-source rev-parse --verify HEAD)"
          [[ "$checked_out_sha" == "$SOURCE_SHA" ]] || {
            echo "::error::Immutable release source checkout $checked_out_sha does not equal requested source $SOURCE_SHA."
            exit 1
          }
          checked_out_epoch="$(git -C .release-source show -s --format=%ct "$SOURCE_SHA")"
          [[ "$checked_out_epoch" == "$SOURCE_EPOCH" ]] || {
            echo "::error::Original source epoch $checked_out_epoch does not equal reviewed release epoch $SOURCE_EPOCH."
            exit 1
          }
          git -C .release-source cat-file -e "$REVIEWED_SHA^{commit}" || {
            echo '::error::Immutable source checkout does not contain the reviewed current main commit.'
            exit 1
          }
          git -C .release-source merge-base --is-ancestor "$SOURCE_SHA" "$REVIEWED_SHA" || {
            echo '::error::Original release source is not an ancestor of the reviewed current main HEAD.'
            exit 1
          }

      - name: Select immutable release build context
        id: build-context
        env:
          INPUT_BUILD_CONTEXT: ${{ inputs.build_context }}
          INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
          RELEASE_REPAIR: ${{ inputs.release_repair }}
          LEGACY_PROFILE: ${{ inputs.legacy_profile }}
        run: |
          set -euo pipefail
          context="$INPUT_BUILD_CONTEXT"
          if [[ "${RELEASE_REPAIR,,}" == true && "${LEGACY_PROFILE,,}" != true ]]; then
            context=.release-source
          fi
          printf 'path=%s\n' "$context" >> "$GITHUB_OUTPUT"
          dockerfile="$INPUT_DOCKERFILE"
          if [[ "${RELEASE_REPAIR,,}" == true && "$dockerfile" != /* ]]; then
            dockerfile="$context/$dockerfile"
          fi
          printf 'dockerfile=%s\n' "$dockerfile" >> "$GITHUB_OUTPUT"

      - name: Determine whether to render connector container files
        id: render-needed
        env:
          BUILD_CONTEXT: ${{ steps.build-context.outputs.path }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          RENDER_CONNECTOR: ${{ inputs.render_connector }}
          LEGACY_PROFILE: ${{ inputs.legacy_profile }}
        run: |
          set -euo pipefail
          render=false
          legacy_profile="${LEGACY_PROFILE:-false}"
          dockerfile="$DOCKERFILE"
          if [[ "$dockerfile" != /* ]]; then
            dockerfile="$BUILD_CONTEXT/$dockerfile"
          fi
          if [[ "${RENDER_CONNECTOR,,}" == true ]]; then
            render=true
          elif [[ "${legacy_profile,,}" != true && "$DOCKERFILE" == docker/Dockerfile && ! -e "$dockerfile" && ! -L "$dockerfile" && -f "$BUILD_CONTEXT/pyproject.toml" ]]; then
            if (
              cd "$BUILD_CONTEXT"
              python3 - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          import tomllib

          try:
              pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          except (OSError, tomllib.TOMLDecodeError):
              sys.exit(1)
          points = pyproject.get("project", {}).get("entry-points", {}).get("scion_sdk.connector", {})
          sources = subprocess.run(
              ["git", "ls-files", "--", "*connector_sources.py"], capture_output=True, text=True, check=False
          ).stdout.splitlines()
          sys.exit(
              0
              if (isinstance(points, dict) and bool(points))
              or any(Path(path).name == "connector_sources.py" for path in sources)
              else 1
          )
          PY
            ); then
              render=true
            fi
          fi
          printf 'render=%s\n' "$render" >> "$GITHUB_OUTPUT"

      - name: Render the connector container files
        id: render
        if: steps.render-needed.outputs.render == 'true'
        env:
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
          SDK_VERSION: ${{ inputs.sdk_version }}
          SDK_DISTRIBUTION: ${{ inputs.sdk_distribution }}
          BUILD_CONTEXT: ${{ steps.build-context.outputs.path }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet uv
          render=(uvx --from "git+https://github.com/${PIPELINES_REPOSITORY}@${PIPELINES_SHA}" pipelines-connector render --root "$BUILD_CONTEXT" --out "$BUILD_CONTEXT/docker")
          if [[ -n "$SDK_DISTRIBUTION" ]]; then
            case "$SDK_DISTRIBUTION" in
              agent-connector-sdk|scion-sdk) ;;
              *) echo "::error::Unsupported SDK distribution: $SDK_DISTRIBUTION"; exit 1 ;;
            esac
            render+=(--sdk-distribution "$SDK_DISTRIBUTION")
          fi
          "${render[@]}"
          if [[ -n "$SDK_VERSION" ]]; then
            printf 'build-args<<EOF\nSDK_VERSION=%s\nEOF\n' "$SDK_VERSION" >> "$GITHUB_OUTPUT"
          fi

      # Single-surface packages ship only one stage (e.g. an agent-only or mcp-only
      # package). If this leg's target stage isn't in the Dockerfile, skip the build
      # so the missing leg is a clean no-op instead of failing the run. A genuinely
      # broken build of a stage that DOES exist still fails (below).
      - name: Detect build target
        id: target
        env:
          BUILD_CONTEXT: ${{ steps.build-context.outputs.path }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          REQUESTED_TARGET: ${{ inputs.build_target }}
          MATRIX_TARGET: ${{ env.BUILD_TARGET }}
          LEGACY_PROFILE: ${{ inputs.legacy_profile }}
          RUNTIME_REQUEST: ${{ inputs.runtime_artifact_id }}${{ inputs.runtime_profile }}${{ inputs.source_revision }}${{ inputs.arbora_revision }}${{ inputs.runtime_lock_sha256 }}${{ inputs.source_freeze_sha256 }}
        run: |
          set -euo pipefail
          if [[ -n "$RUNTIME_REQUEST" ]]; then
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
          else
            echo 'runtime=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$RUNTIME_REQUEST" && -z "$REQUESTED_TARGET" ]]; then
            echo '::error::Runtime staging requires an explicit build_target.'
            exit 1
          fi
          if [[ -n "$REQUESTED_TARGET" && ! "$REQUESTED_TARGET" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]*$ ]]; then
            echo '::error::Invalid build_target.'
            exit 1
          fi
          target="${REQUESTED_TARGET:-$MATRIX_TARGET}"
          echo "cache-key=$target" >> "$GITHUB_OUTPUT"
          legacy_profile="${LEGACY_PROFILE:-false}"
          dockerfile="$DOCKERFILE"
          if [[ "$dockerfile" != /* ]]; then
            dockerfile="$BUILD_CONTEXT/$dockerfile"
          fi
          if [[ "${legacy_profile,,}" == true && "$DOCKERFILE" == docker/Dockerfile && ! -f "$dockerfile" ]]; then
            echo '::error::Legacy profile requires a tracked canonical Dockerfile; refusing to skip the container build.'
            exit 1
          fi
          if [[ "$DOCKERFILE" != docker/Dockerfile && ! -f "$dockerfile" ]]; then
            echo '::error::Selected custom Dockerfile is absent; refusing to skip the container build.'
            exit 1
          fi
          if [[ "$target" == default ]]; then
            echo 'target=' >> "$GITHUB_OUTPUT"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif awk -v target="$target" '{sub(/\r$/, "", $0)} toupper($1)=="FROM" {for(i=2;i<NF;i++) if(toupper($i)=="AS" && $(i+1)==target) found=1} END {exit !found}' "$dockerfile"; then
            echo "target=$target" >> "$GITHUB_OUTPUT"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$REQUESTED_TARGET" ]]; then
            echo '::error::Requested stage is absent from the Dockerfile.'
            exit 1
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Dockerfile has no '$target' stage — skipping this leg (single-surface package)."
          fi

      - name: Validate pipeline checkout destination
        if: &stage_runtime steps.target.outputs.exists == 'true' && steps.target.outputs.runtime == 'true'
        env:
          CONTRACT_PATH: ${{ github.workspace }}/.pipeline-contract
        run: |
          set -euo pipefail
          if [[ -e "$CONTRACT_PATH" || -L "$CONTRACT_PATH" ]]; then
            echo '::error::Pipeline checkout destination already exists; refusing to replace caller content.'
            exit 1
          fi

      - name: Checkout pipeline contract
        if: *stage_runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-contract
          persist-credentials: false

      - name: Stage verified runtime context
        id: runtime
        if: *stage_runtime
        uses: ./.pipeline-contract/.github/actions/stage-container-runtime
        with:
          build-context: ${{ steps.build-context.outputs.path }}
          build-target: ${{ inputs.build_target }}
          artifact-id: ${{ inputs.runtime_artifact_id }}
          profile: ${{ inputs.runtime_profile }}
          source-revision: ${{ inputs.source_revision }}
          arbora-revision: ${{ inputs.arbora_revision }}
          lock-sha256: ${{ inputs.runtime_lock_sha256 }}
          freeze-sha256: ${{ inputs.source_freeze_sha256 }}

      # A main-branch connector publish may have no tracked Dockerfile because the
      # canonical renderer writes it only for this job.  Fetch the contract before
      # the public-wheel check when runtime staging did not already fetch it.
      - name: Validate release guard checkout destination
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) || inputs.release_repair == true) && steps.target.outputs.exists == 'true' && steps.target.outputs.runtime != 'true'
        env:
          CONTRACT_PATH: ${{ github.workspace }}/.pipeline-contract
        run: |
          set -euo pipefail
          if [[ -e "$CONTRACT_PATH" || -L "$CONTRACT_PATH" ]]; then
            echo '::error::Pipeline checkout destination already exists; refusing to replace caller content.'
            exit 1
          fi

      - name: Checkout release guard contract
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) || inputs.release_repair == true) && steps.target.outputs.exists == 'true' && steps.target.outputs.runtime != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-contract
          persist-credentials: false

      - name: Determine published connector wheel
        id: published-wheel
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) || inputs.release_repair == true) && steps.target.outputs.exists == 'true'
        env:
          BUILD_CONTEXT: ${{ steps.build-context.outputs.path }}
          MATRIX_TARGET: ${{ env.BUILD_TARGET }}
          PUBLISHED_WHEEL_DISTRIBUTION: ${{ inputs.published_wheel_distribution }}
          PUBLISHED_WHEEL_MODULE: ${{ inputs.published_wheel_module }}
          PUBLISHED_WHEEL_EXTRAS: ${{ inputs.published_wheel_extras }}
          RELEASE_REPAIR: ${{ inputs.release_repair }}
          PUBLIC_WHEEL_GUARD: ${{ github.workspace }}/.pipeline-contract/.github/actions/verify-release-version/public_wheel.py
        run: |
          set -euo pipefail
          identity="$(python3 -I "$PUBLIC_WHEEL_GUARD" --root "$BUILD_CONTEXT" --resolve-identity \
            --distribution "$PUBLISHED_WHEEL_DISTRIBUTION" --module "$PUBLISHED_WHEEL_MODULE")"
          extras="$(python3 -I "$PUBLIC_WHEEL_GUARD" --root "$BUILD_CONTEXT" --resolve-extras \
            --target "$MATRIX_TARGET")"
          if [[ -n "$PUBLISHED_WHEEL_EXTRAS" && "$PUBLISHED_WHEEL_EXTRAS" != "$extras" ]]; then
            echo "::error::Requested published wheel extras do not match the reviewed container target."
            exit 1
          fi
          if [[ "${RELEASE_REPAIR:-false}" == true && "$(python3 -c 'import json,sys; print(str(json.loads(sys.argv[1]).get("connector", False)).lower())' "$identity")" != true ]]; then
            echo '::error::Reviewed release repair requires a connector identity.'
            exit 1
          fi
          python3 - "$identity" "$GITHUB_OUTPUT" "$extras" <<'PY'
          import json
          import sys

          identity = json.loads(sys.argv[1])
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              for key in ("connector", "distribution", "module"):
                  value = identity.get(key, "")
                  if isinstance(value, bool):
                      value = str(value).lower()
                  output.write(f"{key}={value}\n")
              output.write(f"extras={sys.argv[3]}\n")
          PY

      - name: Verify published connector wheel before container build
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) || inputs.release_repair == true) && steps.target.outputs.exists == 'true' && steps.published-wheel.outputs.connector == 'true'
        uses: ./.pipeline-contract/.github/actions/verify-release-version
        env:
          SOURCE_DATE_EPOCH: ${{ inputs.release_source_epoch }}
        with:
          mode: published-wheel
          distribution: ${{ steps.published-wheel.outputs.distribution }}
          module: ${{ steps.published-wheel.outputs.module }}
          dockerfile: ${{ inputs.dockerfile }}
          docker-root: ${{ inputs.release_repair == true && inputs.legacy_profile == true && steps.build-context.outputs.path || '' }}
          extras: ${{ steps.published-wheel.outputs.extras }}
          legacy-profile: ${{ inputs.legacy_profile }}
          release-version: ${{ inputs.stamp_version_from_tag && startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          root: ${{ inputs.release_repair == true && inputs.legacy_profile == true && '.release-source' || steps.build-context.outputs.path }}

      # PIPE-RELEASE-R015: reuse ONE named BuildKit builder per runner pod instead of
      # creating and removing a builder every job. Each pod's Docker daemon (and its
      # volumes) outlives the runner container, so the builder and its local layer
      # cache survive between jobs. Per-job create/boot cost 130-900 s and removal up
      # to 490 s on a busy daemon (measured on connector release runs); a warm builder
      # costs seconds and keeps base-image and dependency layers local. The registry
      # cache below still carries layers across pods. A wedged builder is replaced.
      - name: Use the persistent BuildKit builder
        id: builder
        if: steps.target.outputs.exists == 'true'
        env:
          BUILDER_NAME: ci-shared
        run: |
          set -euo pipefail
          flags='--allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host'
          boot() {
            docker buildx inspect "$BUILDER_NAME" > /dev/null 2>&1 \
              || docker buildx create --name "$BUILDER_NAME" --driver docker-container --buildkitd-flags "$flags" > /dev/null
            timeout 300 docker buildx inspect --bootstrap "$BUILDER_NAME" > /dev/null
          }
          if ! boot; then
            echo '::warning::Persistent builder did not boot; replacing it.'
            docker buildx rm --force "$BUILDER_NAME" > /dev/null 2>&1 || true
            boot
          fi
          echo "name=$BUILDER_NAME" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Version tags (<version>) so a
      # deploy can pin by release instead of a floating tag or a digest. The version is
      # the package's own: [project].version of pyproject.toml, else [package].version
      # of Cargo.toml, read from the build context and then the repo root. A setuptools
      # dynamic version (`[tool.setuptools.dynamic] version = {attr = "..."}`) is read
      # from that module's literal `__version__`. A package with none of these skips
      # the version tags with a notice; the
      # other tags are unchanged. A version that is not a valid Docker tag fails.
      - name: Resolve package version
        id: version
        if: steps.target.outputs.exists == 'true'
        env:
          BUILD_CONTEXT: ${{ steps.build-context.outputs.path }}
        run: |
          set -euo pipefail
          read_version() {
            # $1 = manifest, $2 = table holding a static `version = "..."`
            awk -v table="$2" '
              {sub(/\r$/, "", $0)}
              /^[[:space:]]*\[/ {in_table = ($0 ~ "^[[:space:]]*\\[" table "\\][[:space:]]*(#.*)?$"); next}
              in_table && /^[[:space:]]*version[[:space:]]*=/ {
                line = $0; sub(/^[^=]*=[[:space:]]*/, "", line)
                if (match(line, /^"[^"]*"/) || match(line, /^\047[^\047]*\047/)) {print substr(line, 2, RLENGTH - 2); exit}
              }' "$1"
          }
          read_dynamic_version() {
            # $1 = project dir. setuptools `version = {attr = "pkg.mod.__version__"}`:
            # read the literal `__version__ = "..."` from that module's source (never imported).
            local attr module file
            attr="$(awk '
              {sub(/\r$/, "", $0)}
              /^[[:space:]]*\[/ {in_table = ($0 ~ "^[[:space:]]*\\[tool\\.setuptools\\.dynamic\\][[:space:]]*(#.*)?$"); next}
              in_table && /^[[:space:]]*version[[:space:]]*=/ {
                if (match($0, /attr[[:space:]]*=[[:space:]]*"[A-Za-z0-9_.]+"/)) {
                  value = substr($0, RSTART, RLENGTH); sub(/^[^"]*"/, "", value); sub(/"$/, "", value); print value; exit
                }
              }' "$1/pyproject.toml")"
            [[ "$attr" == *.* ]] || return 0
            module="${attr%.*}"; module="${module//.//}"
            for file in "$1/$module.py" "$1/$module/__init__.py" "$1/src/$module.py" "$1/src/$module/__init__.py"; do
              if [[ -f "$file" ]]; then
                sed -nE "s/^${attr##*.}[[:space:]]*=[[:space:]]*[\"']([^\"']+)[\"'].*/\\1/p" "$file" | head -n 1
                return 0
              fi
            done
          }
          version=''
          for dir in "$BUILD_CONTEXT" .; do
            if [[ -z "$version" && -f "$dir/pyproject.toml" ]]; then
              version="$(read_version "$dir/pyproject.toml" project)"
            fi
            if [[ -z "$version" && -f "$dir/pyproject.toml" ]]; then
              version="$(read_dynamic_version "$dir")"
            fi
            if [[ -z "$version" && -f "$dir/Cargo.toml" ]]; then
              version="$(read_version "$dir/Cargo.toml" package)"
            fi
          done
          version="${version#v}"
          version="${version//+/-}"
          if [[ -z "$version" ]]; then
            echo '::notice::No static package version found; skipping version tags.'
            echo 'version=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,119}$ ]]; then
            echo '::error::Package version is not a valid Docker tag.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Image = <docker-hub-user>/<repo-name>, e.g. knucklessg1/openbao-mcp
          # (matches the *-mcp Portainer stack image refs). Derived from the repo
          # name so no per-repo DOCKER_REPOSITORY secret is needed.
          images: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          # Plain tags only (latest/<version>/<branch>/sha-<sha>); the MCP server is the default image.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || inputs.release_repair == true }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || inputs.release_repair == true) && steps.version.outputs.version != '' }}
            type=raw,value=${{ steps.version.outputs.version }}-sdk${{ inputs.sdk_version }},enable=${{ inputs.sdk_version != '' && steps.version.outputs.version != '' && inputs.sdk_distribution != 'scion-sdk' }}
            type=raw,value=${{ steps.version.outputs.version }}-sdk-${{ inputs.sdk_distribution }}-${{ inputs.sdk_version }},enable=${{ inputs.sdk_version != '' && steps.version.outputs.version != '' && inputs.sdk_distribution == 'scion-sdk' }}

      # Build + push with up to 3 attempts. Docker Hub intermittently 400s a layer
      # blob PUT ("400 Bad request" HTML from the CDN edge) on an otherwise-healthy
      # push; a clean retry succeeds. The layer cache holds the already-built layers,
      # so retry attempts skip the rebuild and only re-push — cheap and fast.
      # Cache backend = REGISTRY (Docker Hub `:buildcache` tag), NOT `type=gha`: the
      # GHA cache backend's Azure SAS token expires on long builds → "Signature not
      # valid in the specified time frame", which intermittently fails the build. The
      # registry cache reuses the already-authenticated Docker login (no SAS token),
      # so it's durable. ignore-error on cache-to keeps cache an optimization, never a gate.
      # Per-target buildcache tag keyed by build target.
      # The three attempts below share one `with:` block via a YAML anchor
      # (&docker_build_push_with / *docker_build_push_with) so the block is
      # spelled out exactly once — a differential clone gate over the raw
      # workflow text would otherwise see the same duplicated block whenever
      # its content changes (e.g. a routine action-version bump), even though
      # the retry-with-identical-config duplication itself is intentional.
      - name: Build and push Docker image (attempt 1)
        id: buildx1
        if: steps.target.outputs.exists == 'true'
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with: &docker_build_push_with
          builder: ${{ steps.builder.outputs.name }}
          context: ${{ steps.build-context.outputs.path }}
          file: ${{ steps.build-context.outputs.dockerfile }}
          target: ${{ steps.target.outputs.target }}
          build-args: |
            ${{ steps.runtime.outputs.build-args }}
            ${{ steps.render.outputs.build-args }}
          push: ${{ github.event_name == 'push' || inputs.release_repair == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: false
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:buildcache-${{ steps.target.outputs.cache-key }}
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:buildcache-${{ steps.target.outputs.cache-key }},mode=max,ignore-error=true

      - name: Wait before retry
        if: steps.buildx1.outcome == 'failure'
        run: sleep 30

      - name: Build and push Docker image (attempt 2)
        id: buildx2
        if: steps.buildx1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with: *docker_build_push_with

      - name: Wait before final retry
        if: steps.buildx1.outcome == 'failure' && steps.buildx2.outcome == 'failure'
        run: sleep 60

      - name: Build and push Docker image (final attempt)
        if: steps.buildx1.outcome == 'failure' && steps.buildx2.outcome == 'failure'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with: *docker_build_push_with

      # Keep the persistent builder's local cache bounded; the registry cache is the
      # durable copy. Never a gate.
      - name: Bound the builder cache
        if: always() && steps.builder.outputs.name != ''
        env:
          BUILDER_NAME: ${{ steps.builder.outputs.name }}
        run: docker buildx prune --builder "$BUILDER_NAME" --force --keep-storage 30gb > /dev/null 2>&1 || true

      # Post-release verification (PIPE-RELEASE-R012): a release publishes both the
      # PyPI version and the <version> image. This step fails the run when either
      # is missing after the publish, so a skipped or blocked leg is never silent.
      - name: Verify the release artifacts
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) || inputs.release_repair == true) && steps.target.outputs.exists == 'true' && steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_CONTEXT: ${{ steps.build-context.outputs.path }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
          VERIFY_ATTEMPTS: '6'
          VERIFY_DELAY: '20'
        run: |
          set -euo pipefail
          exists() {
            local i
            for ((i = 1; i <= VERIFY_ATTEMPTS; i++)); do
              if curl -fsS -o /dev/null "$1"; then return 0; fi
              sleep "$VERIFY_DELAY"
            done
            return 1
          }
          status=0
          tag="${VERSION}"
          if ! exists "https://hub.docker.com/v2/repositories/${DOCKER_USER}/${REPO_NAME}/tags/${tag}"; then
            echo "::error::Docker image ${DOCKER_USER}/${REPO_NAME}:${tag} is missing after the release."
            status=1
          fi
          name=''
          for dir in "$BUILD_CONTEXT" .; do
            if [[ -z "$name" && -f "$dir/pyproject.toml" ]]; then
              name="$(python3 -c 'import sys,tomllib;print(tomllib.load(open(sys.argv[1],"rb")).get("project",{}).get("name",""))' "$dir/pyproject.toml")"
            fi
          done
          if [[ -n "$name" ]] && ! exists "https://pypi.org/pypi/${name}/${VERSION}/json"; then
            echo "::error::PyPI release ${name}==${VERSION} is missing after the release."
            status=1
          fi
          exit "$status"

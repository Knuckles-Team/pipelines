name: Nightly conformance

# PIPE-GATES-R020. A consumer's scheduled workflow (never a pull request) calls
# this with its attached-source matrix. Each {dialect, image, digest, version}
# entry starts by digest and runs `cargo test --test attached_conformance`; a
# failure passes only under a reviewed deviation in deviations.toml beside the
# manifest. Results go to the job summary.
#
#   on:
#     schedule: [{cron: '0 3 * * *'}]
#   jobs:
#     conformance:
#       uses: Knuckles-Team/pipelines/.github/workflows/nightly-conformance.yml@main

on:
  workflow_call:
    inputs:
      manifest:
        description: Path of the caller's attached-source matrix.
        required: false
        type: string
        default: conformance/attached_matrix.toml
      timeout_minutes:
        description: Minutes an image may take to start, in [1, 60].
        required: false
        type: number
        default: 10
      runner:
        description: Runner label.
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  conformance:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the gate script
        env:
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/pipelines-src"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 "https://github.com/$PIPELINES_REPOSITORY" "$PIPELINES_SHA"
          git -C "$src" checkout -q FETCH_HEAD
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the conformance matrix
        env:
          MANIFEST: ${{ inputs.manifest }}
          TIMEOUT: ${{ inputs.timeout_minutes }}
        run: python3 "$RUNNER_TEMP/pipelines-src/scripts/nightly_conformance.py" --manifest "$MANIFEST" --timeout-minutes "$TIMEOUT"

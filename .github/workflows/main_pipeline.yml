name: Main

# The main/tag workflow of the gate standard (reference/gate-standard.md):
# the full test suite and one dependency audit. Callers run it on a push to
# main and on release tags; release build and publish stay in the caller's
# release workflow. Never publishes.
#
# Caller contract (copy):
#
#   on:
#     push:
#       branches: [main]
#       tags: ['v*']
#   concurrency:
#     group: main-${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: true
#   jobs:
#     main:
#       uses: Knuckles-Team/pipelines/.github/workflows/main_pipeline.yml@main

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version uv provisions for the hooks, tests and builds (the environment version; reference/gate-standard.md "Python version").
        required: false
        type: string
        default: '3.14'
      backward-python:
        description: >-
          Backward-support Python version (the requires-python floor, e.g. '3.12'). When set,
          one extra job syncs the lock on it and imports the package, then runs
          backward-test-scope if given. Empty disables the job; never a full matrix.
        required: false
        type: string
        default: ''
      backward-test-scope:
        description: Space-separated fast test paths run on backward-python; empty runs the import smoke only.
        required: false
        type: string
        default: ''
      backward-module:
        description: Module imported by the backward smoke; empty derives it from the pyproject.toml project name.
        required: false
        type: string
        default: ''
      test-scope:
        description: Tests directory of the full suite; empty disables the test job.
        required: false
        type: string
        default: tests
      runner:
        description: >-
          JSON runner label or label list for runs-on. The reserved value
          "arbora-ci-trusted" opts this suite into the dedicated trusted group
          for default-branch pushes; non-main events use ubuntu-latest.
        required: false
        type: string
        default: '"ubuntu-latest"'
      rust:
        description: Audit Cargo.lock with cargo-deny instead of the Python lock with pip-audit.
        required: false
        type: boolean
        default: false
      setup-command:
        description: Shell command run once after uv is installed and before the suite.
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: Wall-clock cap for each job.
        required: false
        type: number
        default: 60

permissions:
  contents: read

jobs:
  runner-selection:
    name: runner-selection
    runs-on: ubuntu-latest
    outputs:
      runs-on: ${{ steps.select.outputs.runs-on }}
    steps:
      - name: Select a trusted runner only for the default branch
        id: select
        env:
          REQUESTED_RUNNER: ${{ inputs.runner }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_RUNNER" == '"arbora-ci-trusted"' && "$EVENT_NAME" == "push" && "$REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo 'runs-on={"group":"arbora-ci-trusted","labels":["self-hosted","linux","x64","homelab","avx2","rust-1.96"]}' >> "$GITHUB_OUTPUT"
          elif [[ "$REQUESTED_RUNNER" == '"arbora-ci-trusted"' ]]; then
            echo 'runs-on="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          else
            printf 'runs-on=%s\n' "$REQUESTED_RUNNER" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: tests
    if: inputs.test-scope != ''
    needs: runner-selection
    runs-on: ${{ fromJSON(needs.runner-selection.outputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Caller setup
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -c "$SETUP_COMMAND"

      - name: Full test suite
        env:
          TEST_SCOPE: ${{ inputs.test-scope }}
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: |
          set -euo pipefail
          if [[ -n "$SETUP_COMMAND" ]]; then
            uv run --frozen --no-sync pytest -q "$TEST_SCOPE"
          else
            uv sync --frozen
            uv run --frozen pytest -q "$TEST_SCOPE"
          fi

  backward:
    name: backward-python
    if: inputs.backward-python != ''
    needs: runner-selection
    runs-on: ${{ fromJSON(needs.runner-selection.outputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ inputs.backward-python }}
          enable-cache: true

      - name: Caller setup
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -c "$SETUP_COMMAND"

      - name: Backward-support install smoke
        env:
          BACKWARD_SCOPE: ${{ inputs.backward-test-scope }}
          BACKWARD_MODULE: ${{ inputs.backward-module }}
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: |
          set -euo pipefail
          run=(uv run --frozen --no-sync)
          [[ -n "$SETUP_COMMAND" ]] || uv sync --frozen
          module="$BACKWARD_MODULE"
          if [[ -z "$module" ]]; then
            module="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["name"].replace("-","_"))')"
          fi
          "${run[@]}" python -c 'import importlib, sys; importlib.import_module(sys.argv[1]); print(sys.version)' "$module"
          if [[ -n "$BACKWARD_SCOPE" ]]; then
            # shellcheck disable=SC2086
            "${run[@]}" pytest -q $BACKWARD_SCOPE
          fi

  supply-chain:
    name: supply-chain
    needs: runner-selection
    runs-on: ${{ fromJSON(needs.runner-selection.outputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: ${{ !inputs.rust }}
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Audit Python dependencies (pip-audit)
        if: ${{ !inputs.rust }}
        run: |
          set -euo pipefail
          requirements="$RUNNER_TEMP/requirements.txt"
          uv export --frozen --format requirements-txt --no-emit-project --no-dev --quiet > "$requirements"
          uvx pip-audit@2.10.1 --disable-pip -r "$requirements"

      - name: Install cargo-deny
        if: inputs.rust
        uses: taiki-e/install-action@328a871ad8f62ecac78390391f463ccabc974b72 # v2.69.9
        with:
          tool: cargo-deny

      - name: Audit Rust dependencies (cargo deny)
        if: inputs.rust
        run: cargo deny check advisories

name: Release npm Package

# PIPE-RELEASE-R033: one shared lane for an npm package. A consumer's ci.yml and release.yml call this
# workflow at @main. The gates run on every call; the publish runs only on a v* tag with `publish: true`.
# The lane records no state: the tag and the registry hold it.
#
# Credential: the repository secret NPM_TOKEN is used for one case only, the first publish of a package the
# registry does not know yet. Every later publish uses npm trusted publishing (OIDC, no stored token) with the
# token's environment empty. The caller's job must grant `id-token: write`.
# With no credential for the case at hand, the publish step exits 1 with NPM_AUTH_MISSING and nothing publishes.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for the lane.
        required: false
        default: '22'
        type: string
      package-manager:
        description: pnpm or npm; the lockfile is installed frozen.
        required: false
        default: pnpm
        type: string
      typecheck:
        description: Command for the type check; empty skips the step.
        required: false
        default: ''
        type: string
      lint:
        description: Command for the lint; empty skips the step.
        required: false
        default: ''
        type: string
      test:
        description: Command for the tests; empty skips the step.
        required: false
        default: ''
        type: string
      build:
        description: Command for the build; empty skips the step.
        required: false
        default: ''
        type: string
      pre-publish:
        description: Command run after the gates and before publish; empty skips the step.
        required: false
        default: ''
        type: string
      publish:
        description: Publish to the registry. Takes effect only on a v* tag.
        required: false
        default: false
        type: boolean
    secrets:
      NPM_TOKEN:
        description: Registry token for a package's first publish only. Optional; later publishes use trusted publishing.
        required: false

permissions:
  contents: read

jobs:
  npm:
    runs-on: self-hosted
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            pnpm) pnpm install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "::error::GATE_FAILED install: package-manager must be pnpm or npm, not $PACKAGE_MANAGER"; exit 1 ;;
          esac

      # Each gate runs in order. A non-zero exit stops the lane with GATE_FAILED and the step name.
      - name: Typecheck
        if: inputs.typecheck != ''
        env:
          GATE_COMMAND: ${{ inputs.typecheck }}
        run: bash -c "$GATE_COMMAND" || { echo "::error::GATE_FAILED typecheck"; exit 1; }

      - name: Lint
        if: inputs.lint != ''
        env:
          GATE_COMMAND: ${{ inputs.lint }}
        run: bash -c "$GATE_COMMAND" || { echo "::error::GATE_FAILED lint"; exit 1; }

      - name: Test
        if: inputs.test != ''
        env:
          GATE_COMMAND: ${{ inputs.test }}
        run: bash -c "$GATE_COMMAND" || { echo "::error::GATE_FAILED test"; exit 1; }

      - name: Build
        if: inputs.build != ''
        env:
          GATE_COMMAND: ${{ inputs.build }}
        run: bash -c "$GATE_COMMAND" || { echo "::error::GATE_FAILED build"; exit 1; }

      # Publishing refuses before anything is written: the tag must be v plus the package version, and the
      # registry must not hold the version yet.
      - name: Verify the tag version
        if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet uv
          uvx --from "git+https://github.com/${PIPELINES_REPOSITORY}@${PIPELINES_SHA}" pipelines-hook npm-tag-version --tag "$REF_NAME" --root .

      - name: Pre-publish
        if: inputs.publish && startsWith(github.ref, 'refs/tags/v') && inputs.pre-publish != ''
        env:
          GATE_COMMAND: ${{ inputs.pre-publish }}
        run: bash -c "$GATE_COMMAND" || { echo "::error::GATE_FAILED pre-publish"; exit 1; }

      # PIPE-RELEASE-R033.2 to R033.4: the registry decides the publish mode. A package the registry does not
      # know yet (E404) gets its first publish with NPM_TOKEN and then a trusted-publisher registration.
      # A package the registry knows publishes by OIDC only, with the token's environment empty.
      # Trusted publishing needs npm 11.5.1 or newer, and `npm trust` needs 11.10.0 or newer.
      - name: Detect the publish mode
        id: mode
        if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          npm install --global --quiet npm@^11.10.0
          name=$(node -p "require('./package.json').name")
          if out=$(npm view "$name" name 2>&1); then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "$name exists on the registry; publishing by trusted publishing only."
          elif printf '%s' "$out" | grep -q 'E404'; then
            echo "mode=first" >> "$GITHUB_OUTPUT"
            echo "$name is not on the registry yet; this is its first publish."
          else
            echo "::error::REGISTRY_UNREADABLE: the registry lookup of $name failed. Nothing published."
            exit 1
          fi

      - name: Publish the first release with the token
        if: steps.mode.outputs.mode == 'first'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HAVE_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAVE_TOKEN" != "true" ]; then
            echo "::error::NPM_AUTH_MISSING: the package is new and NPM_TOKEN is unset. Nothing published."
            exit 1
          fi
          npm publish --provenance --access public || {
            echo "::error::PUBLISH_FAILED: the registry refused the first publish with NPM_TOKEN. Nothing published."
            exit 1
          }

      # Registration never fails the release: the version is already published. When the registry refuses it,
      # the lane warns, and the owner registers the trusted publisher once on npmjs.com.
      - name: Register the trusted publisher
        if: steps.mode.outputs.mode == 'first'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          name=$(node -p "require('./package.json').name")
          path=${WORKFLOW_REF#"$REPOSITORY"/.github/workflows/}
          file=${path%%@*}
          if timeout 120 npm trust github "$name" --repo "$REPOSITORY" --file "$file" --yes < /dev/null; then
            echo "Registered $REPOSITORY $file as the trusted publisher of $name."
          else
            echo "::warning::TRUSTED_PUBLISHER_UNREGISTERED: npm refused to register the trusted publisher with a token. On npmjs.com open $name, Settings, Trusted publishing, and add GitHub Actions for $REPOSITORY with workflow $file. Later releases need it."
          fi

      - name: Publish by trusted publishing
        if: steps.mode.outputs.mode == 'oidc'
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::NPM_AUTH_MISSING: the job has no id-token: write for trusted publishing. Nothing published."
            exit 1
          fi
          npm publish --provenance --access public || {
            echo "::error::PUBLISH_FAILED: the package needs a trusted publisher registered on npmjs.com for this repository and calling workflow. Nothing published."
            exit 1
          }

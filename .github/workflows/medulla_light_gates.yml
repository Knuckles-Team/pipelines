name: Medulla lightweight gates

# Reusable, release-critical checks for the Medulla caller.  The caller owns
# its native jobs and consumes the `code` output from `changes`; this workflow
# only carries the three lightweight jobs that currently run independently in
# Medulla's CI.

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          JSON runner label or label list for runs-on. Custom runners are
          accepted only for same-repository pull requests and default-branch
          pushes; every other event, including fork pull requests, is forced
          to ubuntu-latest. The reserved value "arbora-ci-trusted" selects
          the dedicated group only on those trusted events.
        required: false
        type: string
        default: '"ubuntu-latest"'
    outputs:
      code:
        description: Whether the caller's change scope contains code changes.
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read

jobs:
  changes:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    name: Change scope
    # Keep the runner policy in the immutable central workflow.  A fork must
    # not be able to pass a self-hosted group or arbitrary JSON through input.
    runs-on: >-
      ${{ fromJSON(
        (
          (
            (github.event_name == 'push' &&
             github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository)
          ) &&
          inputs.runner == '"arbora-ci-trusted"' &&
          '{"group":"arbora-ci-trusted","labels":["self-hosted","linux","x64","homelab","rust-1.96"]}'
        ) ||
        (
          (
            (github.event_name == 'push' &&
             github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository)
          ) &&
          inputs.runner != '"arbora-ci-trusted"' &&
          inputs.runner
        ) ||
        '"ubuntu-latest"'
      ) }}
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_change_scope.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"

  lint-and-architecture:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 60 }}
    name: Lint, format and architecture (pre-commit)
    runs-on: >-
      ${{ fromJSON(
        (
          (
            (github.event_name == 'push' &&
             github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository)
          ) &&
          inputs.runner == '"arbora-ci-trusted"' &&
          '{"group":"arbora-ci-trusted","labels":["self-hosted","linux","x64","homelab","rust-1.96"]}'
        ) ||
        (
          (
            (github.event_name == 'push' &&
             github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository)
          ) &&
          inputs.runner != '"arbora-ci-trusted"' &&
          inputs.runner
        ) ||
        '"ubuntu-latest"'
      ) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # spec-status reconstructs generated status from commit trailers.
          fetch-depth: 0
          persist-credentials: false
      - name: Use the runner-provided portable Python (trusted runner)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python3)"
          required_version="$(tr -d '[:space:]' < .python-version)"
          actual_version="$("$python_bin" -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          case "$actual_version" in
            "$required_version"|"$required_version".*) ;;
            *)
              echo "Runner Python $actual_version does not satisfy .python-version $required_version" >&2
              exit 1
              ;;
          esac
          venv="$RUNNER_TEMP/medulla-python"
          "$python_bin" -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"
          "$venv/bin/python" --version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.environment != 'self-hosted'
        with:
          python-version-file: '.python-version'
      - name: Install manifest Rust toolchain and rustfmt
        run: rustup toolchain install --profile minimal --component rustfmt && rustup show active-toolchain
      - name: Install uv, pre-commit and the hooks' one third-party import
        run: python -m pip install --disable-pip-version-check uv==0.8.17 pre-commit==4.6.2 pyyaml==6.0.3
      # lane-guard is owned by meristem and read from a sibling checkout.
      - name: Check out meristem gate scripts
        run: |
          git clone --depth 1 https://github.com/Knuckles-Team/meristem "$RUNNER_TEMP/meristem"
          echo "AGENT_UTILITIES_ROOT=$RUNNER_TEMP/meristem" >> "$GITHUB_ENV"
      # Hook environments follow reference/ci-standard.md "Pre-commit hook
      # environments". The key matches medulla ci.yml so main saves serve PRs.
      - name: Resolve the shared hook revision
        id: hook-rev
        run: |
          set -euo pipefail
          echo "sha=$(git ls-remote https://github.com/Knuckles-Team/pipelines refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore pre-commit environments
        id: hook-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.config/pre-commit.yaml') }}-${{ steps.hook-rev.outputs.sha }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.config/pre-commit.yaml') }}-${{ steps.hook-rev.outputs.sha }}-partial-
            pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.config/pre-commit.yaml') }}-

      - name: Drop the stale shared-hook environment
        if: steps.hook-cache.outputs.cache-matched-key != '' && !startsWith(steps.hook-cache.outputs.cache-matched-key, format('pre-commit-{0}-{1}-{2}-{3}', runner.os, runner.arch, hashFiles('.config/pre-commit.yaml'), steps.hook-rev.outputs.sha))
        run: |
          set -euo pipefail
          db="$HOME/.cache/pre-commit/db.db"
          [[ -f "$db" ]] || exit 0
          python3 - "$db" <<'PY'
          import shutil, sqlite3, sys
          con = sqlite3.connect(sys.argv[1])
          rows = con.execute("SELECT path FROM repos WHERE repo LIKE '%Knuckles-Team/pipelines%'").fetchall()
          for (path,) in rows:
              shutil.rmtree(path, ignore_errors=True)
          con.execute("DELETE FROM repos WHERE repo LIKE '%Knuckles-Team/pipelines%'")
          con.commit()
          PY

      - name: Install pre-commit environments
        id: hook-install
        run: |
          set -euo pipefail
          pre-commit install-hooks --config .config/pre-commit.yaml

      - name: Save pre-commit environments
        if: success() && steps.hook-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.config/pre-commit.yaml') }}-${{ steps.hook-rev.outputs.sha }}

      - name: Save partly installed pre-commit environments
        if: (failure() || cancelled()) && steps.hook-install.outcome != 'success' && steps.hook-install.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.config/pre-commit.yaml') }}-${{ steps.hook-rev.outputs.sha }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      # Match the caller's existing lint and architecture gate commands.
      - name: pre-commit (commit stage, PR diff or full publication)
        env:
          SKIP: lane-guard,cargo-deny-advisories
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            pre-commit run --config .config/pre-commit.yaml --from-ref "$BASE" --to-ref "$HEAD" --show-diff-on-failure
          else
            pre-commit run --config .config/pre-commit.yaml --all-files --show-diff-on-failure
          fi
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: CI change-scope regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1
          python -m pytest --noconftest -o addopts='' tests/test_ci_change_scope.py
      - name: Server package tests
        working-directory: packaging/medulla-server
        run: python -m pytest -o addopts='' -p no:cacheprovider tests

  spec-gates:
    timeout-minutes: 5
    name: Spec status lifecycle gates
    runs-on: >-
      ${{ fromJSON(
        (
          (
            (github.event_name == 'push' &&
             github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository)
          ) &&
          inputs.runner == '"arbora-ci-trusted"' &&
          '{"group":"arbora-ci-trusted","labels":["self-hosted","linux","x64","homelab","rust-1.96"]}'
        ) ||
        (
          (
            (github.event_name == 'push' &&
             github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository)
          ) &&
          inputs.runner != '"arbora-ci-trusted"' &&
          inputs.runner
        ) ||
        '"ubuntu-latest"'
      ) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the runner-provided portable Python (trusted runner)
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python3)"
          required_version="$(tr -d '[:space:]' < .python-version)"
          actual_version="$("$python_bin" -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          case "$actual_version" in
            "$required_version"|"$required_version".*) ;;
            *)
              echo "Runner Python $actual_version does not satisfy .python-version $required_version" >&2
              exit 1
              ;;
          esac
          venv="$RUNNER_TEMP/medulla-python"
          "$python_bin" -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"
          "$venv/bin/python" --version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.environment != 'self-hosted'
        with:
          python-version-file: '.python-version'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: spec-status
        run: uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' pipelines-hook spec-status
      - name: spec-decomposition
        run: uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' pipelines-hook spec-decomposition
      - name: spec-trailers
        if: github.event_name == 'pull_request'
        run: uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' pipelines-hook spec-trailers --base-ref "origin/${{ github.base_ref }}"

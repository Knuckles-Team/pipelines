name: Deploy GitHub Pages

on:
  workflow_call:
    inputs:
      content_source:
        description: >-
          Documentation content source directory (mkdocs's `docs_dir`). Only
          consulted when a caller opts into `shared_theme_enabled` and/or
          `agent_readiness_enabled` below -- a repository whose own
          `mkdocs.yml` already declares `docs_dir` keeps building unaffected
          by this input either way. New repositories default to the pages/
          layout; a repository still declaring content under docs/ must set
          this explicitly to "docs" once it opts into either feature. There
          is no silent fallback between layouts: a missing or mismatched
          content_source fails the build loudly rather than guessing.
        required: false
        type: string
        default: pages
      shared_theme_enabled:
        description: >-
          Deliberately inherit the one shared Pages theme (Material config,
          markdown extensions, CSS) from this repository's
          templates/mkdocs-theme/base.mkdocs.yml via mkdocs's native
          INHERIT:, so the caller's own mkdocs.yml only needs to declare its
          content manifest (site_name/site_url/nav/docs_dir).
        required: false
        type: boolean
        default: false
      agent_readiness_enabled:
        description: "Deliberately enable canonical source-Markdown readiness delivery."
        required: false
        type: boolean
        default: false
      readiness_input:
        description: >-
          Canonical agent-readiness.json path. Defaults to the pages/ layout;
          a repository whose readiness file lives elsewhere (e.g. still under
          docs/) must declare that explicitly -- there is no fallback probe
          across layouts.
        required: false
        type: string
        default: pages/agent-readiness.json
      readiness_schema:
        description: >-
          Canonical universal-skills readiness schema path. Defaults to the
          pages/ layout; declare explicitly for a repository on another
          layout.
        required: false
        type: string
        default: pages/agent-readiness.schema.json
      readiness_manifest:
        description: "Canonical generated agent-readiness manifest path."
        required: false
        type: string
        default: agent-readiness-manifest.json
      markdown_manifest:
        description: "Canonical generated Markdown mirror manifest path."
        required: false
        type: string
        default: markdown-mirror-manifest.json

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.14.7

      - name: Install MkDocs
        run: |
          pip install mkdocs-material==9.7.6 mkdocs-awesome-pages-plugin==2.10.1

      - name: Validate declared content source
        if: inputs.shared_theme_enabled || inputs.agent_readiness_enabled
        env:
          CONTENT_SOURCE: ${{ inputs.content_source }}
        run: |
          set -euo pipefail
          if [ -z "${CONTENT_SOURCE}" ]; then
            echo "::error::content_source must not be empty -- a repository must explicitly declare its documentation source directory (e.g. 'pages' or 'docs') before enabling shared_theme_enabled or agent_readiness_enabled. No default is silently assumed." >&2
            exit 1
          fi
          if [ ! -d "${CONTENT_SOURCE}" ]; then
            echo "::error::declared content_source '${CONTENT_SOURCE}' does not exist in this repository. This is not a fallback point -- fix the 'content_source' input on the calling pages.yml, or add the directory." >&2
            exit 1
          fi
          if [ -f "mkdocs.yml" ]; then
            declared_docs_dir="$(python3 -c "import sys, yaml; yaml.SafeLoader.add_multi_constructor('tag:yaml.org,2002:python/name:', lambda loader, suffix, node: suffix); yaml.SafeLoader.add_multi_constructor('tag:yaml.org,2002:python/object/apply:', lambda loader, suffix, node: suffix); config = yaml.safe_load(open('mkdocs.yml', encoding='utf-8')) or {}; docs_dir = config.get('docs_dir', 'docs') if isinstance(config, dict) else 'docs'; sys.stdout.write(str(docs_dir))")"
            if [ "${declared_docs_dir}" != "${CONTENT_SOURCE}" ]; then
              echo "::error::mkdocs.yml declares docs_dir='${declared_docs_dir}' but content_source='${CONTENT_SOURCE}' was declared for this build. mkdocs.yml's docs_dir is the single authority the docs-readiness tooling reads too -- fix one to match the other. There is no automatic reconciliation between them." >&2
              exit 1
            fi
          fi

      - name: Checkout shared Pages theme
        if: inputs.shared_theme_enabled
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-theme
          persist-credentials: false
          sparse-checkout: |
            templates/mkdocs-theme/base.mkdocs.yml
            templates/mkdocs-theme/extra.css

      - name: Apply shared Pages theme
        if: inputs.shared_theme_enabled
        env:
          CONTENT_SOURCE: ${{ inputs.content_source }}
        run: |
          set -euo pipefail
          mkdir -p "${CONTENT_SOURCE}/_pipelines-theme"
          cp .pipeline-theme/templates/mkdocs-theme/extra.css "${CONTENT_SOURCE}/_pipelines-theme/extra.css"
          if [ -f "mkdocs.yml" ]; then
            if ! grep -q '^INHERIT:' mkdocs.yml; then
              printf 'INHERIT: .pipeline-theme/templates/mkdocs-theme/base.mkdocs.yml\n' | cat - mkdocs.yml > mkdocs.yml.pipelines-tmp
              mv mkdocs.yml.pipelines-tmp mkdocs.yml
            fi
          else
            printf 'INHERIT: .pipeline-theme/templates/mkdocs-theme/base.mkdocs.yml\ndocs_dir: %s\nsite_name: Project Documentation\n' "${CONTENT_SOURCE}" > mkdocs.yml
          fi

      - name: Build Docs
        env:
          READINESS_ENABLED: ${{ inputs.agent_readiness_enabled }}
          CONTENT_SOURCE: ${{ inputs.content_source }}
        run: |
          set -euo pipefail
          if [ -f "mkdocs.yml" ]; then
            if [ "$READINESS_ENABLED" = "true" ]; then
              mkdocs build --strict
            else
              mkdocs build
            fi
          else
            if [ "$READINESS_ENABLED" = "true" ]; then
              echo "agent readiness requires an explicit mkdocs.yml" >&2
              exit 1
            fi
            # Create a minimal mkdocs.yml honoring the declared content
            # source -- never assume the historical docs/ default.
            python3 -c "import sys, pathlib; content_source = sys.argv[1]; pathlib.Path('mkdocs.yml').write_text('site_name: Project Documentation\ndocs_dir: ' + content_source + '\ntheme:\n  name: material\nmarkdown_extensions:\n  - pymdownx.highlight:\n      anchor_linenums: true\n  - pymdownx.superfences:\n      custom_fences:\n        - name: mermaid\n          class: mermaid\n          format: !!python/name:pymdownx.superfences.fence_code_format\n', encoding='utf-8')" "$CONTENT_SOURCE"
            mkdocs build
          fi

      - name: Checkout Pages readiness contract
        if: inputs.agent_readiness_enabled
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-contract
          persist-credentials: false
          sparse-checkout: |
            scripts/__init__.py
            scripts/pages_readiness.py

      - name: Publish source Markdown mirrors and derived discovery assets
        if: inputs.agent_readiness_enabled
        env:
          CONTENT_SOURCE: ${{ inputs.content_source }}
          READINESS_INPUT: ${{ inputs.readiness_input }}
          READINESS_SCHEMA: ${{ inputs.readiness_schema }}
          READINESS_MANIFEST: ${{ inputs.readiness_manifest }}
          MARKDOWN_MANIFEST: ${{ inputs.markdown_manifest }}
        run: |
          set -euo pipefail
          python .pipeline-contract/scripts/pages_readiness.py build \
            --root "$GITHUB_WORKSPACE" \
            --site site \
            --content-source "$CONTENT_SOURCE" \
            --readiness-input "$READINESS_INPUT" \
            --schema "$READINESS_SCHEMA" \
            --readiness-manifest "$READINESS_MANIFEST" \
            --mirror-manifest "$MARKDOWN_MANIFEST"

      - name: Run offline Agent Readiness TCK
        if: inputs.agent_readiness_enabled
        env:
          CONTENT_SOURCE: ${{ inputs.content_source }}
          READINESS_INPUT: ${{ inputs.readiness_input }}
          READINESS_SCHEMA: ${{ inputs.readiness_schema }}
          READINESS_MANIFEST: ${{ inputs.readiness_manifest }}
          MARKDOWN_MANIFEST: ${{ inputs.markdown_manifest }}
        run: |
          set -euo pipefail
          python .pipeline-contract/scripts/pages_readiness.py tck \
            --root "$GITHUB_WORKSPACE" \
            --site site \
            --content-source "$CONTENT_SOURCE" \
            --readiness-input "$READINESS_INPUT" \
            --schema "$READINESS_SCHEMA" \
            --readiness-manifest "$READINESS_MANIFEST" \
            --mirror-manifest "$MARKDOWN_MANIFEST"

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

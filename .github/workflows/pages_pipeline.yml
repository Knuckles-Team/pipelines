name: Deploy GitHub Pages

on:
  workflow_call:
    inputs:
      agent_readiness_enabled:
        description: "Deliberately enable canonical source-Markdown readiness delivery."
        required: false
        type: boolean
        default: false
      readiness_input:
        description: "Canonical docs/agent-readiness.json path."
        required: false
        type: string
        default: docs/agent-readiness.json
      readiness_schema:
        description: "Canonical universal-skills readiness schema path."
        required: false
        type: string
        default: docs/agent-readiness.schema.json
      readiness_manifest:
        description: "Canonical generated agent-readiness manifest path."
        required: false
        type: string
        default: agent-readiness-manifest.json
      markdown_manifest:
        description: "Canonical generated Markdown mirror manifest path."
        required: false
        type: string
        default: markdown-mirror-manifest.json

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.14.7

      - name: Install MkDocs
        run: |
          pip install mkdocs-material==9.7.6 mkdocs-awesome-pages-plugin==2.10.1

      - name: Build Docs
        env:
          READINESS_ENABLED: ${{ inputs.agent_readiness_enabled }}
        run: |
          set -euo pipefail
          if [ -f "mkdocs.yml" ]; then
            if [ "$READINESS_ENABLED" = "true" ]; then
              mkdocs build --strict
            else
              mkdocs build
            fi
          else
            if [ "$READINESS_ENABLED" = "true" ]; then
              echo "agent readiness requires an explicit mkdocs.yml" >&2
              exit 1
            fi
            # Create a simple mkdocs.yml if it doesn't exist
            printf 'site_name: Project Documentation\ntheme:\n  name: material\nmarkdown_extensions:\n  - pymdownx.highlight:\n      anchor_linenums: true\n  - pymdownx.superfences:\n      custom_fences:\n        - name: mermaid\n          class: mermaid\n          format: !!python/name:pymdownx.superfences.fence_code_format\n' > mkdocs.yml
            mkdocs build
          fi

      - name: Checkout Pages readiness contract
        if: inputs.agent_readiness_enabled
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-contract
          persist-credentials: false
          sparse-checkout: |
            scripts/__init__.py
            scripts/pages_readiness.py

      - name: Publish source Markdown mirrors and derived discovery assets
        if: inputs.agent_readiness_enabled
        env:
          READINESS_INPUT: ${{ inputs.readiness_input }}
          READINESS_SCHEMA: ${{ inputs.readiness_schema }}
          READINESS_MANIFEST: ${{ inputs.readiness_manifest }}
          MARKDOWN_MANIFEST: ${{ inputs.markdown_manifest }}
        run: |
          set -euo pipefail
          python .pipeline-contract/scripts/pages_readiness.py build \
            --root "$GITHUB_WORKSPACE" \
            --site site \
            --readiness-input "$READINESS_INPUT" \
            --schema "$READINESS_SCHEMA" \
            --readiness-manifest "$READINESS_MANIFEST" \
            --mirror-manifest "$MARKDOWN_MANIFEST"

      - name: Run offline Agent Readiness TCK
        if: inputs.agent_readiness_enabled
        env:
          READINESS_INPUT: ${{ inputs.readiness_input }}
          READINESS_SCHEMA: ${{ inputs.readiness_schema }}
          READINESS_MANIFEST: ${{ inputs.readiness_manifest }}
          MARKDOWN_MANIFEST: ${{ inputs.markdown_manifest }}
        run: |
          set -euo pipefail
          python .pipeline-contract/scripts/pages_readiness.py tck \
            --root "$GITHUB_WORKSPACE" \
            --site site \
            --readiness-input "$READINESS_INPUT" \
            --schema "$READINESS_SCHEMA" \
            --readiness-manifest "$READINESS_MANIFEST" \
            --mirror-manifest "$MARKDOWN_MANIFEST"

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

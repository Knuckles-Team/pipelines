name: Gates

# The pull request workflow of the gate standard (reference/gate-standard.md):
# the caller's own pre-commit file (format, hygiene, secrets at the commit
# stage; types, spec at the pre-push stage) and its optional CI-only gate file
# (.config/ci-gates.yaml, PRECOMMIT standard), run diff-scoped on pull requests
# (--from-ref/--to-ref) and over every file on a main push, then the
# affected-test subset. The pre-push `tests-fast` hook is skipped here because
# the affected-test step runs the same subset without the local time cap.
# Never publishes. Full tests and the dependency audit belong to
# main_pipeline.yml; advisory scanners to advisory_pipeline.yml.
#
# Caller contract (copy; a reusable workflow cannot set the caller's groups):
#
#   on:
#     pull_request:
#       paths-ignore: [specs/**, docs/**, '**/*.md', plans/**, LICENSE]
#     push:
#       branches: [main]
#       paths-ignore: [specs/**, docs/**, '**/*.md', plans/**, LICENSE]
#   concurrency:
#     group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('main-{0}', github.workflow) }}
#     cancel-in-progress: true
#   jobs:
#     gates:
#       uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
#
# paths-ignore leaves a required `gates` check pending; pair it with the
# templates/workflows/gates-skip.yml companion (the inverse `paths:` filter).
# Or drop `paths-ignore` from `pull_request` and set `docs-only-paths`: the job
# then detects a docs-only diff itself and passes in seconds, so exactly one
# `gates / gates` check exists and a skip run can never mask a failing real run.
# Every input has a default, so adding the workflow needs no `with:` block.
#
# Trailers belong to pull request commits: a squash merge does not carry the
# `Spec:` trailer, so on push events the `spec-trailers` hook is added to SKIP.
# Pull request runs always enforce it.

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version uv provisions for the hooks, tests and builds (the environment version; reference/gate-standard.md "Python version").
        required: false
        type: string
        default: '3.14'
      config:
        description: Pre-commit configuration file of the caller.
        required: false
        type: string
        default: .config/pre-commit.yaml
      ci-config:
        description: >-
          CI-only gate file (pre-commit format, never installed as a git hook): the
          architecture gates, scanners, drift checks and type checks the
          PRECOMMIT standard keeps out of local hooks. Skipped when the file is absent.
        required: false
        type: string
        default: .config/ci-gates.yaml
      test-scope:
        description: Tests directory for the affected-test subset; empty disables the test step.
        required: false
        type: string
        default: tests
      src-root:
        description: Package under test for test mapping; empty derives it from pyproject.toml.
        required: false
        type: string
        default: ''
      runner:
        description: >-
          JSON runner label or label list for runs-on. The reserved value
          "arbora-ci-trusted" opts this gate into the dedicated trusted group
          for same-repository pull requests and default-branch pushes; fork
          pull requests always fall back to ubuntu-latest.
        required: false
        type: string
        default: '"ubuntu-latest"'
      rust:
        description: Install a minimal Rust toolchain before the gates.
        required: false
        type: boolean
        default: false
      stages:
        description: Space-separated hook stages run over the diff (a connector pull request runs `pre-commit` only).
        required: false
        type: string
        default: pre-commit pre-push
      all-files:
        description: Run every file (main push) instead of the pull request diff.
        required: false
        type: boolean
        default: false
      extra-manual-hooks:
        description: Space-separated hook ids to run at the manual stage after the push stage.
        required: false
        type: string
        default: ''
      skip-hooks:
        description: Comma-separated hook ids exported as SKIP (for hooks that need unavailable private data).
        required: false
        type: string
        default: ''
      scanners:
        description: >-
          Space-separated native scanners (cccc kiss dupehound jscpd) built at their pinned
          versions by scripts/install_scanners.sh and put on PATH before the hooks run. A hook
          that needs a scanner fails closed in CI when it is absent, so a caller whose hooks
          include one lists it here. Empty installs nothing.
        required: false
        type: string
        default: ''
      setup-command:
        description: >-
          Shell command run once after uv is installed and before the hooks, for a
          caller whose hooks need a prepared environment (bootstrap script, extra
          PYTHONPATH via GITHUB_ENV). When set, the affected-test step reuses that
          environment (uv run --no-sync) instead of running uv sync.
        required: false
        type: string
        default: ''
      docs-only-paths:
        description: >-
          Space-separated bash patterns (`*` crosses `/`) of docs and spec paths. When
          set and every file in the pull request diff matches one, the job passes
          right after checkout without running hooks or tests. Empty disables it.
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: Wall-clock cap for the gates job (15 for pull requests, 60 for main).
        required: false
        type: number
        default: 15

permissions:
  contents: read

jobs:
  # Runner selection itself is hosted so an untrusted fork never executes
  # selection code on the dedicated group. Only the small, read-only gate job
  # consumes the opt-in trusted labels; callers keep Docker/release jobs on
  # their existing runner contracts.
  runner-selection:
    name: runner-selection
    runs-on: ubuntu-latest
    outputs:
      runs-on: ${{ steps.select.outputs.runs-on }}
    steps:
      - name: Select a trusted runner only for same-repository code
        id: select
        env:
          REQUESTED_RUNNER: ${{ inputs.runner }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED_RUNNER" != '"arbora-ci-trusted"' ]]; then
            printf 'runs-on=%s\n' "$REQUESTED_RUNNER" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          same_repository=false
          if [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            same_repository=true
          elif [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" == "$REPOSITORY" ]]; then
            same_repository=true
          fi
          if [[ "$same_repository" == true ]]; then
            echo 'runs-on=["self-hosted","linux","x64","homelab","arbora-ci-trusted","avx2","rust-1.96"]' >> "$GITHUB_OUTPUT"
          else
            # A fork PR is untrusted code and must never land on a private runner.
            echo 'runs-on="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          fi

  gates:
    name: gates
    needs: runner-selection
    runs-on: ${{ fromJSON(needs.runner-selection.outputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout with full history for the diff range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect a docs-only change
        id: scope
        env:
          DOCS_ONLY_PATHS: ${{ inputs.docs-only-paths }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ALL_FILES: ${{ inputs.all-files }}
        run: |
          set -euo pipefail
          set -f
          if [[ -z "$DOCS_ONLY_PATHS" || "$EVENT_NAME" != "pull_request" || "$ALL_FILES" == "true" ]]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="$PR_BASE"
          if [[ -z "$base" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            base="$(git merge-base HEAD "origin/$BASE_REF")"
          fi
          code=()
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            matched=false
            for pattern in $DOCS_ONLY_PATHS; do
              # shellcheck disable=SC2053
              if [[ "$file" == $pattern ]]; then matched=true; break; fi
            done
            [[ "$matched" == true ]] || code+=("$file")
          done < <(git diff --name-only "$base" HEAD)
          if [[ "${#code[@]}" -eq 0 ]]; then
            echo "docs-only change: every changed path matches docs-only-paths; the code gates do not apply"
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "code change (${#code[@]} paths, first: ${code[0]}); running the gates"
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.scope.outputs.docs-only != 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            ${{ inputs.config }}
            ${{ inputs.ci-config }}

      - name: Install Rust toolchain
        if: inputs.rust && steps.scope.outputs.docs-only != 'true'
        run: rustup toolchain install stable --profile minimal

      # Pinned native scanners (inputs.scanners), built from the pipelines revision that
      # defines this workflow and cached on the installer's content.
      - name: Fetch the scanner recipes
        id: scanner-src
        if: inputs.scanners != '' && steps.scope.outputs.docs-only != 'true'
        env:
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
          SCANNERS: ${{ inputs.scanners }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/pipelines-src"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 "https://github.com/$PIPELINES_REPOSITORY" "$PIPELINES_SHA"
          git -C "$src" checkout -q FETCH_HEAD
          key="$(cd "$src" && cat scripts/install_scanners.sh scripts/install_jscpd.py | sha256sum | cut -c1-64)"
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "root=$RUNNER_TEMP/pipelines-scanners" >> "$GITHUB_OUTPUT"
          echo "key=${key}-${SCANNERS// /-}" >> "$GITHUB_OUTPUT"

      - name: Restore the scanner toolchain
        id: scanner-cache
        if: inputs.scanners != '' && steps.scope.outputs.docs-only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.scanner-src.outputs.root }}
          key: pipelines-scanners-${{ runner.os }}-${{ runner.arch }}-${{ steps.scanner-src.outputs.key }}

      - name: Build the pinned scanners and put them on PATH
        if: inputs.scanners != '' && steps.scope.outputs.docs-only != 'true'
        env:
          SRC: ${{ steps.scanner-src.outputs.src }}
          ROOT: ${{ steps.scanner-src.outputs.root }}
          SCANNERS: ${{ inputs.scanners }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          bash "$SRC/scripts/install_scanners.sh" "$ROOT" $SCANNERS >> "$GITHUB_PATH"

      - name: Caller setup
        if: inputs.setup-command != '' && steps.scope.outputs.docs-only != 'true'
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
          PROHIBITED_IDENTITY_CATALOG: ${{ vars.PROHIBITED_IDENTITY_CATALOG }}
          FORK_PULL_REQUEST: ${{ github.event.pull_request.head.repo.fork || false }}
        run: bash -c "$SETUP_COMMAND"

      # Consumers pin the shared hooks at the mutable rev ``main``, and
      # pre-commit never refreshes an installed mutable rev. Keying the cache on
      # the config alone restored stale hooks after pipelines main moved, so the
      # key also carries the current pipelines main commit.
      - name: Resolve the shared hook revision
        id: hook-rev
        if: steps.scope.outputs.docs-only != 'true'
        run: |
          set -euo pipefail
          echo "sha=$(git ls-remote https://github.com/Knuckles-Team/pipelines refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache pre-commit environments
        if: steps.scope.outputs.docs-only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.config, inputs.ci-config) }}-${{ steps.hook-rev.outputs.sha }}

      - name: Resolve diff range
        if: steps.scope.outputs.docs-only != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          ALL_FILES: ${{ inputs.all-files }}
        run: |
          set -euo pipefail
          range=(--all-files)
          if [[ "$ALL_FILES" != "true" ]]; then
            base="${PR_BASE:-$PUSH_BEFORE}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
              base="$(git merge-base HEAD "origin/$BASE_REF")"
            fi
            range=(--from-ref "$base" --to-ref HEAD)
            echo "PRE_COMMIT_FROM_REF=$base" >> "$GITHUB_ENV"
            echo "PRE_COMMIT_TO_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "TEST_BASE=$base" >> "$GITHUB_ENV"
          fi
          echo "PRE_COMMIT_RANGE=${range[*]}" >> "$GITHUB_ENV"

      - name: pre-commit (commit and pre-push stages)
        if: steps.scope.outputs.docs-only != 'true'
        env:
          SKIP: ${{ inputs.skip-hooks }}
          CONFIG: ${{ inputs.config }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_SCOPE: ${{ inputs.test-scope }}
          STAGES: ${{ inputs.stages }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then SKIP="${SKIP:+$SKIP,}spec-trailers"; export SKIP; fi
          if [[ -n "$TEST_SCOPE" ]]; then SKIP="${SKIP:+$SKIP,}tests-fast,fast-tests"; export SKIP; fi
          for stage in $STAGES; do
            # shellcheck disable=SC2086
            uvx --from pre-commit==4.6.2 pre-commit run --config "$CONFIG" --hook-stage "$stage" $PRE_COMMIT_RANGE --show-diff-on-failure
          done

      - name: CI-only gates
        if: steps.scope.outputs.docs-only != 'true'
        env:
          SKIP: ${{ inputs.skip-hooks }}
          CI_CONFIG: ${{ inputs.ci-config }}
        run: |
          set -euo pipefail
          if [[ ! -f "$CI_CONFIG" ]]; then echo "no $CI_CONFIG; no CI-only gates"; exit 0; fi
          # shellcheck disable=SC2086
          uvx --from pre-commit==4.6.2 pre-commit run --config "$CI_CONFIG" $PRE_COMMIT_RANGE --show-diff-on-failure

      - name: pre-commit (extra manual hooks)
        if: inputs.extra-manual-hooks != '' && steps.scope.outputs.docs-only != 'true'
        env:
          SKIP: ${{ inputs.skip-hooks }}
          CONFIG: ${{ inputs.config }}
          HOOKS: ${{ inputs.extra-manual-hooks }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then SKIP="${SKIP:+$SKIP,}spec-trailers"; export SKIP; fi
          for hook in $HOOKS; do
            # shellcheck disable=SC2086
            uvx --from pre-commit==4.6.2 pre-commit run --config "$CONFIG" --hook-stage manual $PRE_COMMIT_RANGE "$hook"
          done

      - name: Affected tests
        if: inputs.test-scope != '' && steps.scope.outputs.docs-only != 'true'
        env:
          TEST_SCOPE: ${{ inputs.test-scope }}
          SRC_ROOT: ${{ inputs.src-root }}
          ALL_FILES: ${{ inputs.all-files }}
          SETUP_COMMAND: ${{ inputs.setup-command }}
          PIPELINES_SOURCE: git+https://github.com/${{ job.workflow_repository }}@${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          src="$SRC_ROOT"
          if [[ -z "$src" && -f pyproject.toml ]]; then
            src="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb")).get("project",{}).get("name","").replace("-","_"))')"
          fi
          run=(uv run --frozen)
          if [[ -n "$SETUP_COMMAND" ]]; then
            run=(uv run --frozen --no-sync)
          else
            uv sync --frozen
          fi
          if [[ "$ALL_FILES" == "true" ]]; then
            "${run[@]}" pytest -q "$TEST_SCOPE"
            exit 0
          fi
          scope="$(uvx --from "$PIPELINES_SOURCE" pipelines-hook pr-test-scope --base-ref "$TEST_BASE" --src-root "$src" --tests-root "$TEST_SCOPE")"
          echo "pr-test-scope: $scope"
          case "$scope" in
            NONE) echo "no affected tests" ;;
            FULL) "${run[@]}" pytest -q "$TEST_SCOPE" ;;
            *) mapfile -t tests <<<"$scope"; "${run[@]}" pytest -q "${tests[@]}" ;;
          esac

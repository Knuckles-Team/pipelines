name: Release Python Package

on:
  workflow_call:
    inputs:
      runtime-profiles:
        description: Additional runtime extras as JSON; base and declared mcp/agent/all are always proven.
        required: false
        default: '[]'
        type: string
      role-contract:
        description: >-
          Optional tracked JSON role/extra contract; empty preserves existing publishers,
          while a supplied path runs packaging-roles after wheel readiness.
        required: false
        default: ''
        type: string
      web-assets:
        description: >-
          This package ships a Node/pnpm frontend (package.json) that must be
          built before packaging.
        required: false
        type: boolean
        default: false
      connector:
        description: >-
          Connector repository: generate ontology/shapes/connector.shacl.ttl and
          ontology/certification.json into the build tree before the wheel is built
          (pipelines-connector generate, PIPE-GATES-R016.39). The connector commits neither.
        required: false
        type: boolean
        default: false
      require-tag:
        description: >-
          Fail before building unless the triggering ref is a v* tag, so a
          caller cannot publish from an ordinary branch push. Default false
          keeps existing callers unchanged.
        required: false
        type: boolean
        default: false
      stamp-version-from-tag:
        description: >-
          On a v* tag, set [project].version in the build workspace to the tag's version before
          the release checks and the build (PIPE-RELEASE-R018); the tag carries the version.
        required: false
        type: boolean
        default: false
      release-tag:
        description: >-
          A v* tag this run created on the triggering commit (PIPE-RELEASE-R018.3). It stands in
          for github.ref, which a tag created with the run's own token never triggers. Empty uses
          the triggering ref.
        required: false
        type: string
        default: ''
      release-record-url:
        description: >-
          HTTP endpoint of the arbora release.record operation (PIPE-RELEASE-R009.1). Empty skips
          the record step; a failed post marks the run and never withdraws the release.
        required: false
        type: string
        default: ''
      upgrade-test:
        description: Run the upgrade-test gate (PIPE-RELEASE-R030) before publication.
        required: false
        type: boolean
        default: false
      consumer-gate:
        description: Run the consumer-gate gate (PIPE-RELEASE-R031) before publication.
        required: false
        type: boolean
        default: false
      contract-change:
        description: This release changes a contract; consumer-gate then refuses an empty consumer list.
        required: false
        type: boolean
        default: false
      candidate-sandbox:
        description: Smoke the candidate in a sandbox and publish only the built digests (PIPE-RELEASE-R032).
        required: false
        type: boolean
        default: false
    secrets:
      PYPI_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  # PIPE-RELEASE-R028.1: every declared coding harness bundle is built and validated on the tagged commit before
  # any publish job. The tree is temporary and never uploaded. A repository that declares none passes at once.
  harness-bundles:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release-tag != ''
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout pipeline contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/harness_bundle_proof.py
            /pipelines_hooks/__init__.py
            /pipelines_hooks/connector/__init__.py
            /pipelines_hooks/connector/secret_scan.py
          path: .pipeline-contract
          persist-credentials: false

      - name: Prove the declared harness bundles
        env:
          RELEASE_REF: ${{ inputs.release-tag != '' && inputs.release-tag || github.ref_name }}
        run: python3 -I .pipeline-contract/scripts/harness_bundle_proof.py --root . --version "${RELEASE_REF#v}"

  # PIPE-RELEASE-R030, R031, R032: opt-in pre-publication proofs. Each builds the candidate wheel and runs one
  # published gate against it; publish-pypi needs every job that ran.
  upgrade-test:
    if: inputs.upgrade-test
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build the candidate wheel
        run: |
          set -euo pipefail
          uv build --wheel --out-dir candidate-dist

      - name: Run upgrade-test
        env:
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          wheel=$(ls candidate-dist/*.whl)
          uvx --from "git+https://github.com/${PIPELINES_REPOSITORY}@${PIPELINES_SHA}" pipelines-hook upgrade-test --candidate "$wheel"

  consumer-gate:
    if: inputs.consumer-gate
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build the candidate wheel
        run: |
          set -euo pipefail
          uv build --wheel --out-dir candidate-dist

      - name: Run consumer-gate
        env:
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
          CONTRACT_CHANGE: ${{ inputs.contract-change }}
        run: |
          set -euo pipefail
          wheel=$(ls candidate-dist/*.whl)
          flag=""
          if [ "$CONTRACT_CHANGE" = "true" ]; then flag="--contract-change"; fi
          uvx --from "git+https://github.com/${PIPELINES_REPOSITORY}@${PIPELINES_SHA}" pipelines-hook consumer-gate --candidate "$wheel" $flag

  candidate-sandbox:
    if: inputs.candidate-sandbox
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run candidate-sandbox
        env:
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          uvx --from "git+https://github.com/${PIPELINES_REPOSITORY}@${PIPELINES_SHA}" pipelines-hook candidate-sandbox build --digests candidate-digests.json
          uvx --from "git+https://github.com/${PIPELINES_REPOSITORY}@${PIPELINES_SHA}" pipelines-hook candidate-sandbox smoke

      - name: Keep the recorded candidate digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-digests
          path: candidate-digests.json
          if-no-files-found: error

  publish-pypi:
    needs: [harness-bundles, upgrade-test, consumer-gate, candidate-sandbox]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require a release tag
        if: inputs.require-tag
        env:
          REF: ${{ inputs.release-tag != '' && format('refs/tags/{0}', inputs.release-tag) || github.ref }}
        run: |
          if [[ ! "$REF" =~ ^refs/tags/v ]]; then
            echo "::error::require-tag is set and $REF is not a v* tag; publish only from a release tag."
            exit 1
          fi

      # A called workflow executes in the caller's checkout.  Fetch this
      # workflow's own action bytes at the exact resolved workflow commit
      # before any local composite action is loaded.
      - name: Checkout pipeline contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          # wheel-readiness imports the canonical source-build policy validator
          # from the package below. Keep the checkout sparse, but include that
          # exact import closure; readiness.py adds this contract root to
          # sys.path while retaining isolated (-I) execution.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /pipelines_hooks/__init__.py
            /pipelines_hooks/connector/__init__.py
            /pipelines_hooks/connector/project.py
            /pipelines_hooks/connector/targets.py
            /pipelines_hooks/core/__init__.py
            /pipelines_hooks/core/errors.py
            /scripts/release_record.py
          path: .pipeline-contract
          persist-credentials: false

      # PIPE-RELEASE-R018: the tag carries the version. Main's pyproject lags until the sync
      # pull request merges, so the build workspace takes the tag's version before anything reads it.
      - name: Stamp the tag version
        if: inputs.stamp-version-from-tag && (startsWith(github.ref, 'refs/tags/v') || inputs.release-tag != '')
        env:
          REF_NAME: ${{ inputs.release-tag || github.ref_name }}
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          python3 -m pip install --quiet uv
          uvx --from "git+https://github.com/${PIPELINES_REPOSITORY}@${PIPELINES_SHA}" pipelines-connector version --root . set "$version"

      # PIPE-RELEASE-R002: refuse a stale-version tag, a bumpversion mismatch or an
      # already-published version before any build time is spent. A version a maintainer
      # already published from this commit (local release, PIPE-RELEASE-R029.3) skips the rest.
      - name: Verify release version
        id: version
        uses: ./.pipeline-contract/.github/actions/verify-release-version
        with:
          ref: ${{ inputs.release-tag != '' && format('refs/tags/{0}', inputs.release-tag) || '' }}

      - name: Setup Node.js
        if: steps.version.outputs.published != 'true' && (inputs.web-assets && hashFiles('package.json') != '')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        if: steps.version.outputs.published != 'true' && (inputs.web-assets && hashFiles('pnpm-lock.yaml') != '')
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Frontend Dependencies
        if: steps.version.outputs.published != 'true' && (inputs.web-assets && hashFiles('package.json') != '')
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Frontend
        if: steps.version.outputs.published != 'true' && (inputs.web-assets && hashFiles('package.json') != '')
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run build
          else
            npm run build
          fi

      # A connector served by the SDK ships no legacy ontology mapping; it has nothing to generate.
      - name: Generate the connector ontology artifacts
        if: steps.version.outputs.published != 'true' && inputs.connector && hashFiles('*/ontology/mappings/source.yaml') != ''
        env:
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet uv
          uvx --from "git+https://github.com/${PIPELINES_REPOSITORY}@${PIPELINES_SHA}" pipelines-connector generate --root .

      - name: Download the candidate digests
        if: steps.version.outputs.published != 'true' && inputs.candidate-sandbox
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-digests
          path: candidate

      - name: Build, publish and release
        if: steps.version.outputs.published != 'true'
        uses: ./.pipeline-contract/.github/actions/publish-python-package
        with:
          candidate-digests: ${{ inputs.candidate-sandbox && 'candidate/candidate-digests.json' || '' }}
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          runtime-profiles: ${{ inputs.runtime-profiles }}
          role-contract: ${{ inputs.role-contract }}
          release-digests: ${{ inputs.connector && 'release-digests.json' || '' }}

      # PIPE-RELEASE-R009.1: the last step records the release (artifact digests and the frozen commit). A failure
      # marks the run and never withdraws the release.
      - name: Record the release
        if: steps.version.outputs.published != 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.release-tag != '')
        continue-on-error: true
        env:
          RELEASE_RECORD_URL: ${{ inputs.release-record-url }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag != '' && inputs.release-tag || github.ref_name }}
          RELEASE_DIGESTS_FILE: ${{ inputs.connector && 'release-digests.json' || '' }}
          SOURCE_COMMIT: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ github.sha }}
          LATEST_COMMIT: ${{ github.sha }}
        run: python3 -I .pipeline-contract/scripts/release_record.py

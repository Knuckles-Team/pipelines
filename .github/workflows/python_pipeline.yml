name: Release Python Package

on:
  workflow_call:
    inputs:
      web-assets:
        description: >-
          This package ships a Node/pnpm frontend (package.json) that must be
          built before packaging. Also relaxes the composite publish action
          to tolerate a missing requirements.txt and skip re-publishing a
          version that already exists on PyPI -- the web-package variant
          formerly split out as python_web_pipeline.yml.
        required: false
        type: boolean
        default: false
    secrets:
      PYPI_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish-pypi:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A called workflow executes in the caller's checkout.  Fetch this
      # workflow's own action bytes at the exact resolved workflow commit
      # before any local composite action is loaded.
      - name: Checkout pipeline contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/actions
          path: .pipeline-contract
          persist-credentials: false

      - name: Setup Node.js
        if: inputs.web-assets && hashFiles('package.json') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        if: inputs.web-assets && hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Frontend Dependencies
        if: inputs.web-assets && hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Frontend
        if: inputs.web-assets && hashFiles('package.json') != ''
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run build
          else
            npm run build
          fi

      - name: Build, publish and release
        uses: ./.pipeline-contract/.github/actions/publish-python-package
        with:
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tolerate-missing-requirements: ${{ inputs.web-assets && 'true' || 'false' }}
          twine-skip-existing: ${{ inputs.web-assets && 'false' || 'true' }}

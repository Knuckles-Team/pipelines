name: Release Python Package

on:
  workflow_call:
    inputs:
      runtime-profiles:
        description: Additional runtime extras as JSON; base and declared mcp/agent/all are always proven.
        required: false
        default: '[]'
        type: string
      web-assets:
        description: >-
          This package ships a Node/pnpm frontend (package.json) that must be
          built before packaging.
        required: false
        type: boolean
        default: false
      connector:
        description: >-
          Connector repository: generate ontology/shapes/connector.shacl.ttl and
          ontology/certification.json into the build tree before the wheel is built
          (pipelines-connector generate, PIPE-GATES-R016.39). The connector commits neither.
        required: false
        type: boolean
        default: false
      require-tag:
        description: >-
          Fail before building unless the triggering ref is a v* tag, so a
          caller cannot publish from an ordinary branch push. Default false
          keeps existing callers unchanged.
        required: false
        type: boolean
        default: false
    secrets:
      PYPI_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish-pypi:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require a release tag
        if: inputs.require-tag
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ ! "$REF" =~ ^refs/tags/v ]]; then
            echo "::error::require-tag is set and $REF is not a v* tag; publish only from a release tag."
            exit 1
          fi

      # A called workflow executes in the caller's checkout.  Fetch this
      # workflow's own action bytes at the exact resolved workflow commit
      # before any local composite action is loaded.
      - name: Checkout pipeline contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/actions
          path: .pipeline-contract
          persist-credentials: false

      # PIPE-RELEASE-R002: refuse a stale-version tag, a bumpversion mismatch or an
      # already-published version before any build time is spent.
      - name: Verify release version
        uses: ./.pipeline-contract/.github/actions/verify-release-version

      - name: Setup Node.js
        if: inputs.web-assets && hashFiles('package.json') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        if: inputs.web-assets && hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Frontend Dependencies
        if: inputs.web-assets && hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Frontend
        if: inputs.web-assets && hashFiles('package.json') != ''
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run build
          else
            npm run build
          fi

      - name: Generate the connector ontology artifacts
        if: inputs.connector
        env:
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet uv
          uvx --from "git+https://github.com/${PIPELINES_REPOSITORY}@${PIPELINES_SHA}" pipelines-connector generate --root .

      - name: Build, publish and release
        uses: ./.pipeline-contract/.github/actions/publish-python-package
        with:
          pypi-token: ${{ secrets.PYPI_API_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          runtime-profiles: ${{ inputs.runtime-profiles }}

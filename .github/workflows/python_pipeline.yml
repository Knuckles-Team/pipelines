name: Release Python Package

on:
  workflow_call:
    secrets:
      PYPI_API_TOKEN:
        required: true

jobs:
  publish-pypi:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build package
        id: build_package
        run: |
          echo "Creating virtual environment"
          # Pin to 3.13: Python 3.14 breaks native builds of transitive deps
          # (e.g. litellm's PyO3 chain caps at cp313), failing release CI fleet-wide.
          uv venv --python 3.13 .venv
          source .venv/bin/activate
          echo "Installing dependencies"
          uv pip install -r requirements.txt twine
          echo "Building package"
          uv build
          BUILD_VERSION=$(ls dist | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*' | head -n 1)
          LATEST_COMMIT=$(git rev-parse --verify HEAD)
          echo "Last Commit: ${LATEST_COMMIT}"
          COMMIT_MESSAGE=$(git log -1 --format=%B "$LATEST_COMMIT" | tr '\n' ' ')
          COMMIT_DATETIME=$(date "+%m/%d/%Y %H:%M:%S")
          {
            echo "COMMIT_DATETIME=$COMMIT_DATETIME"
            echo "COMMIT_MESSAGE=$COMMIT_MESSAGE"
            echo "BUILD_VERSION=$BUILD_VERSION"
            echo "LATEST_COMMIT=$LATEST_COMMIT"
          } >> "$GITHUB_ENV"

      - name: Upload Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.BUILD_VERSION }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Publish package
        run: |
          twine upload --skip-existing dist/* --verbose -u "__token__" -p "${{ secrets.PYPI_API_TOKEN }}"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.BUILD_VERSION }}
          name: Release v${{ env.BUILD_VERSION }}
          body: |
            Released: ${{ env.COMMIT_DATETIME }}
            Commit: ${{ env.LATEST_COMMIT }}
            Changes:
            ${{ env.COMMIT_MESSAGE }}
          draft: false
          prerelease: false

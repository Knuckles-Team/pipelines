name: Auto-merge pipeline

# Reusable auto-merge gate (reference/ci-standard.md). The caller template is
# templates/workflows/auto_merge.yml. Arms auto-merge on a pull request only when
# the repository requires the check AND that check concluded success on the exact
# head SHA. The trusted script is fetched from Knuckles-Team/pipelines at main; the
# pull request is never checked out.

on:
  workflow_call:
    inputs:
      required-check:
        description: Name of the caller aggregate check that must be green and required.
        required: false
        type: string
        default: CI required
    secrets:
      merge-token:
        description: Token that arms the merge (a PAT or app token, so downstream workflows fire). Falls back to the workflow token.
        required: false

permissions: {}

concurrency:
  group: auto-merge-${{ github.repository }}-${{ github.event.pull_request.number || github.event.check_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  arm:
    name: Arm green auto-merge
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'check_run' &&
      github.event.check_run.name == inputs.required-check &&
      github.event.check_run.conclusion == 'success')
    permissions:
      contents: write
      pull-requests: write
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MERGE_TOKEN: ${{ secrets.merge-token || github.token }}
      REQUIRED_CHECK: ${{ inputs.required-check }}
      GITHUB_API_URL: ${{ github.api_url }}
    steps:
      - name: Fetch and run the trusted merge gate
        shell: bash
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/pipelines-auto-merge.py"
          gh api --method GET \
            "repos/Knuckles-Team/pipelines/contents/scripts/auto_merge.py?ref=main" \
            --jq .content | base64 --decode > "$trusted"
          test -s "$trusted"
          python3 "$trusted"

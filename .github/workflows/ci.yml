name: CI

# This repository's gates (reference/gate-standard.md): the PR workflow on
# pull requests, the full suite and dependency audit on main and release tags.
# Advisory scanners run weekly in advisory.yml.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('main-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      src-root: pipelines_hooks
      # Hosted by default. The explicit group JSON keeps this caller compatible
      # with the verified non-AVX2 trusted pool; the central workflow still
      # forces fork events to ubuntu-latest.
      runner: ${{ vars.ARBORA_TRUSTED_CI_RUNNER == 'true' && '{"group":"arbora-ci-trusted","labels":["self-hosted","linux","x64","homelab","rust-1.96"]}' || '"ubuntu-latest"' }}
      # tracked-privacy needs the operator's private identity catalog, which is
      # not published to hosted runners; it runs wherever the catalog is installed.
      skip-hooks: tracked-privacy
      scanners: dupehound

  main:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/main_pipeline.yml@main
    with:
      # Keep required main checks hosted until the dedicated pool is live.
      runner: ${{ vars.ARBORA_TRUSTED_CI_RUNNER == 'true' && '{"group":"arbora-ci-trusted","labels":["self-hosted","linux","x64","homelab","rust-1.96"]}' || '"ubuntu-latest"' }}

  ci-required:
    name: CI required
    if: always()
    needs: [gates, main]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on any failed or cancelled job (skipped is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "::error::a required job ended $r"; exit 1;; esac
          done

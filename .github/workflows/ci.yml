name: CI

# This repository's gates (reference/gate-standard.md): the PR workflow on
# pull requests, the full suite and dependency audit on main and release tags.
# Advisory scanners run weekly in advisory.yml.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('main-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@b49b77468d0048f58a5876560f1767072b73c04d
    with:
      src-root: pipelines_hooks
      # Hosted by default. Set the repository/org variable only after the
      # arbora-ci-trusted group and its AVX2/Rust runner have been verified.
      runner: ${{ vars.ARBORA_TRUSTED_CI_RUNNER == 'true' && '"arbora-ci-trusted"' || '"ubuntu-latest"' }}
      # tracked-privacy needs the operator's private identity catalog, which is
      # not published to hosted runners; it runs wherever the catalog is installed.
      skip-hooks: tracked-privacy
      scanners: dupehound

  main:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/main_pipeline.yml@b49b77468d0048f58a5876560f1767072b73c04d
    with:
      # Keep required main checks hosted until the dedicated pool is live.
      runner: ${{ vars.ARBORA_TRUSTED_CI_RUNNER == 'true' && '"arbora-ci-trusted"' || '"ubuntu-latest"' }}

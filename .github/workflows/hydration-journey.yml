name: hydration-journey

# Reusable hydration journey gate (PIPE-GATES-R019). A consumer pull-request
# workflow calls this to run a graph-loaded workflow through the harness, then
# SourceIngest and VerifyIngestReadback through arbora. The job fails when the
# readback digest differs from the digest of the run output. The gate script
# comes from the pipelines revision that defines this workflow.

on:
  workflow_call:
    inputs:
      workflow:
        description: Identifier of the graph-loaded workflow the harness runs.
        required: true
        type: string
      harness_command:
        description: Published harness command; the workflow identifier is appended.
        required: true
        type: string
      arbora_endpoint:
        description: Base URL of the arbora HTTP API.
        required: true
        type: string
      runner:
        description: Runner label.
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      arbora_token:
        description: Bearer token for the arbora HTTP API.
        required: true

permissions:
  contents: read

jobs:
  hydration-journey:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the gate script
        env:
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/pipelines-src"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 "https://github.com/$PIPELINES_REPOSITORY" "$PIPELINES_SHA"
          git -C "$src" checkout -q FETCH_HEAD
          echo "PIPELINES_SRC=$src" >> "$GITHUB_ENV"

      - name: Run the hydration journey
        env:
          PIPELINES_ARBORA_ENDPOINT: ${{ inputs.arbora_endpoint }}
          PIPELINES_ARBORA_TOKEN: ${{ secrets.arbora_token }}
          WORKFLOW: ${{ inputs.workflow }}
          HARNESS_COMMAND: ${{ inputs.harness_command }}
        run: |
          set -euo pipefail
          python3 -I "$PIPELINES_SRC/scripts/hydration_journey.py" --workflow "$WORKFLOW" --harness-command "$HARNESS_COMMAND"

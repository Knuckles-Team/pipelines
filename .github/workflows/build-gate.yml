name: Build gate

# PIPE-GATES-R021. A Rust consumer's pull-request workflow calls this with the path of
# its own manifest of [[clippy]] {name, args} profiles and [[suite]] {crate, filter,
# features} tables. The gate builds the root library, runs clippy with all features and
# all targets for each profile with warnings denied, then runs the scanner and catalog
# suites. The runtime test categories stay with required-runtime.yml (PIPE-GATES-R017).
#
#   jobs:
#     build-gate:
#       uses: Knuckles-Team/pipelines/.github/workflows/build-gate.yml@main
#       with:
#         manifest: ci/build-gate.toml

on:
  workflow_call:
    inputs:
      manifest:
        description: Path of the caller's build-gate manifest.
        required: true
        type: string
      runner:
        description: Runner label.
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  build-gate:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the gate script
        env:
          PIPELINES_REPOSITORY: ${{ job.workflow_repository }}
          PIPELINES_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/pipelines-src"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 "https://github.com/$PIPELINES_REPOSITORY" "$PIPELINES_SHA"
          git -C "$src" checkout -q FETCH_HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build, lint and run the scanner and catalog suites
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: python3 "$RUNNER_TEMP/pipelines-src/scripts/build_gate.py" --manifest "$MANIFEST"

name: Release Maturin Package

on:
  workflow_call:
    inputs:
      runtime-profiles:
        description: Additional runtime extras as JSON; base and declared mcp/agent/all are always proven.
        required: false
        default: '[]'
        type: string
    secrets:
      PYPI_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  # ── Linux Wheels ───────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - &checkout_pipeline_contract
        name: Checkout pipeline contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-contract
          persist-credentials: false

      - name: Setup QEMU
        if: matrix.target == 'aarch64'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: ./.pipeline-contract/.github/actions/maturin-build-wheels
        with:
          target: ${{ matrix.target }}-unknown-linux-gnu
          manylinux: "2_28"
          artifact-name: wheels-linux-${{ matrix.target }}
          readiness-target: linux-${{ matrix.target }}
          runtime-profiles: ${{ inputs.runtime-profiles }}

  # ── macOS Wheels ───────────────────────────────────────────────
  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # x86_64-apple-darwin (macos-13, Intel) omitted: GitHub's Intel-Mac
          # hosted runners are heavily queue-starved and Apple Silicon is the
          # current target. Re-add { target: x86_64-apple-darwin, runner: macos-13 }
          # if Intel-Mac wheels are needed and runner availability allows.
          - target: aarch64-apple-darwin
            runner: macos-14
    steps:
      - *checkout_pipeline_contract

      - uses: ./.pipeline-contract/.github/actions/maturin-build-wheels
        with:
          target: ${{ matrix.target }}
          artifact-name: wheels-macos-${{ matrix.target }}
          readiness-target: macos-aarch64
          runtime-profiles: ${{ inputs.runtime-profiles }}

  # ── Windows Wheels ─────────────────────────────────────────────
  # rdkafka builds its bundled librdkafka via CMake (cmake-build feature) so it
  # compiles under MSVC; cmake ships on the windows-latest runner.
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
    steps:
      - *checkout_pipeline_contract

      - uses: ./.pipeline-contract/.github/actions/maturin-build-wheels
        with:
          target: ${{ matrix.target }}
          artifact-name: wheels-windows-${{ matrix.target }}
          readiness-target: windows-x86_64
          runtime-profiles: ${{ inputs.runtime-profiles }}

  # ── Source Distribution ────────────────────────────────────────
  sdist:
    runs-on: ubuntu-latest
    steps:
      - *checkout_pipeline_contract

      - uses: ./.pipeline-contract/.github/actions/checkout-verified-source

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: Prove exact source archive rebuild
        uses: ./.pipeline-contract/.github/actions/wheel-readiness
        with:
          phase: source
          runtime-profiles: ${{ inputs.runtime-profiles }}
          receipt: sdist.json
          artifact-name: readiness-sdist

      - name: Preserve rebuilt source wheel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-wheel-evidence
          path: source-evidence/
          if-no-files-found: error

      - name: Verify source and upload artifact
        uses: ./.pipeline-contract/.github/actions/verify-and-upload-artifact
        with:
          artifact-name: wheels-sdist
          artifact-path: dist

  # ── Publish + Release ──────────────────────────────────────────
  publish:
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - *checkout_pipeline_contract

      - uses: ./.pipeline-contract/.github/actions/checkout-verified-source

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download target receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: readiness-*
          path: target-receipts
          merge-multiple: true

      - name: Download source wheel evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-wheel-evidence
          path: source-evidence

      - name: Verify source commit after artifact download
        uses: ./.pipeline-contract/.github/actions/verify-source-commit
        with:
          phase: after

      - name: Determine version
        id: version
        run: |
          BUILD_VERSION=$(ls dist | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*' | sort -V | tail -n 1)
          LATEST_COMMIT="$SOURCE_COMMIT"
          COMMIT_MESSAGE=$(git log -1 --format=%B "$LATEST_COMMIT" | tr '\n' ' ')
          COMMIT_DATETIME=$(date "+%m/%d/%Y %H:%M:%S")
          {
            echo "BUILD_VERSION=$BUILD_VERSION"
            echo "LATEST_COMMIT=$LATEST_COMMIT"
            echo "COMMIT_MESSAGE=$COMMIT_MESSAGE"
            echo "COMMIT_DATETIME=$COMMIT_DATETIME"
          } >> "$GITHUB_ENV"

      - name: List artifacts
        run: ls -la dist/

      # `maturin upload`/`publish` are deprecated (PyO3/maturin#2334). The
      # future-proof path is build-then-publish: maturin builds the wheels (the
      # build jobs above, --out dist) and the official PyPA action uploads them
      # via twine. Same PYPI_API_TOKEN secret, so publishing keeps working.
      - name: Prove wheel runtime readiness
        uses: ./.pipeline-contract/.github/actions/wheel-readiness
        with:
          phase: aggregate
          runtime-profiles: ${{ inputs.runtime-profiles }}

      - name: Reverify exact upload bytes
        env:
          RUNTIME_PROFILES: ${{ inputs.runtime-profiles }}
        run: '"$READINESS_PYTHON" -I .pipeline-contract/.github/actions/wheel-readiness/readiness.py verify --release-version "$BUILD_VERSION"'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create Release
        uses: ./.pipeline-contract/.github/actions/create-version-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*
          runtime-profiles: ${{ inputs.runtime-profiles }}

[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "sql-mcp"
version = "2.3.4"
description = "Generic SQL database (Postgres, MySQL/MariaDB, MSSQL, Oracle, SQLite) API + MCP Server for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "agent-connector-sdk[mcp]>=0.4.1,<1.0.0", "python-dotenv>=1.2.4", "sqlalchemy>=2.1.5",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-connector-sdk[mcp]>=0.4.1,<1.0.0",]
postgres = [ "psycopg[binary]>=3.3.6",]
mysql = [ "pymysql>=1.2.3",]
mssql = [ "pyodbc>=5.3.0",]
oracle = [ "oracledb>=26.0.1",]
all = [ "sql-mcp[mcp,postgres,mysql,mssql,oracle]>=1.0.0",]
test = [ "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
sql-mcp = "sql_mcp.mcp_server:mcp_server"

[project.entry-points."agent_connector_sdk.skill_providers"]
sql-mcp = "sql_mcp.skills"

[project.entry-points."agent_connector_sdk.prompt_providers"]
sql-mcp = "sql_mcp.prompts"

[project.entry-points."agent_connector_sdk.ontology_providers"]
sql-mcp = "sql_mcp.ontology"

# The one declared connector identity: the fleet name (SDK-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
sql-mcp = "sql_mcp"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [ "pytest-timeout>=2.4.0",]

[tool.setuptools.package-data]
sql_mcp = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.setuptools.packages.find]
where = [ ".",]
include = [ "sql_mcp*",]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

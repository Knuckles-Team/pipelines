[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "leanix-agent"
version = "2.3.4"
description = "Agent package for communicating with LeanIX Enterprise Architecture Management via REST APIs and GraphQL."
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12"
dependencies = [ "agent-connector-sdk[mcp,graphql]>=0.4.1,<1.0.0", "epistemic-graph>=2.27.1,<3", "requests>=2.34.2",]
license = "MIT"
license-files = ["LICENSE"]

[[project.authors]]
name = "Repository Maintainers"

[project.optional-dependencies]
mcp = []
all = []
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0", "requests-toolbelt>=1.0.0", "rdflib>=7.6.0", "pytest-timeout>=2.4.0" ]

[project.scripts]
leanix-mcp = "leanix_agent.mcp_server:mcp_server"

[project.entry-points."agent_connector_sdk.skill_providers"]
leanix-agent = "leanix_agent.skills"

# CONCEPT:AU-KG.ontology.package-federation-migration — federate this package's OWL/RDF ontology module into the
# agent-connector-sdk hub (fact sheets, applications, IT components). Resolved via
# iter_provider_dirs like the skill/prompt providers.
[project.entry-points."agent_connector_sdk.ontology_providers"]
leanix-agent = "leanix_agent.ontology"


# The one declared connector identity: the fleet name (SDK-CONNECTOR-CONTROL-R071).
[project.entry-points."agent_connector_sdk.connector"]
leanix-mcp = "leanix_agent"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
leanix_agent = [ "mcp_config.json", "agent_data/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]
include = ["leanix_agent*"]
exclude = ["scripts*", "tests*"]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[[tool.uv.dependency-metadata]]
name = "epistemic-graph"
version = "2.27.1"
requires-python = ">=3.12"
requires-dist = ["msgpack>=1.2.1", "pydantic>=2,<3", "pyoxigraph>=0.3.22", "httpx>=0.24.0"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

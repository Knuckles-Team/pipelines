[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelines-hooks"
version = "2.1.1"
description = "Shared, repository-agnostic pre-commit quality gates for the Knuckles-Team fleet"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "packaging==26.3",
    "networkx==3.6.1",
    "platformdirs==4.11.8",
    "PyYAML==6.0.3",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
graph-check = ["rdflib==7.6.0"]

[project.scripts]
pipelines-hook = "pipelines_hooks.cli:main"
pipelines-connector = "pipelines_hooks.connector.cli:main"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "bump2version==1.0.1",
    "mypy==2.4.0",
    "pip==25.1.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "rdflib==7.6.0",
    "setuptools>=84.0.0",
    "types-networkx==3.6.1.20261006",
    "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools]
# Explicit: the vended spec templates ship from the repository's .specify/templates/ (tests/test_spec_templates.py).
packages = ["pipelines_hooks", "pipelines_hooks.ci_replica", "pipelines_hooks.clones", "pipelines_hooks.code", "pipelines_hooks.complexity", "pipelines_hooks.connector", "pipelines_hooks.connector.skill_checks", "pipelines_hooks.core", "pipelines_hooks.docs", "pipelines_hooks.hygiene", "pipelines_hooks.hygiene.connector_central", "pipelines_hooks.identity", "pipelines_hooks.kiss", "pipelines_hooks.privacy", "pipelines_hooks.release", "pipelines_hooks.rust", "pipelines_hooks.security", "pipelines_hooks.specs", "pipelines_hooks.ste", "pipelines_hooks.supply_chain", "pipelines_hooks.validation", "pipelines_hooks.spec_templates"]

[tool.setuptools.package-dir]
"pipelines_hooks.spec_templates" = ".specify/templates"

[tool.setuptools.package-data]
"pipelines_hooks.spec_templates" = ["*.md"]
pipelines_hooks = ["py.typed", "identity/fleet-default-allowlist.json", "ste/ste_words.toml", "gate_sets.toml", "specs/third_party_names.toml", "hygiene/ontology_cqs.json", "hygiene/ontology_codemod_overrides.json", "connector/templates/*.tmpl", "connector/defaults/codespellignore", "connector/defaults/security-contract.json", "hygiene/connector_central/container_generations.json", "hygiene/connector_central/scaffold_fingerprints.json"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Scripts and tests put the repository on sys.path before importing from it.
ignore = ["E402"]

[tool.mypy]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import their shared fixtures as `tests.hooks...`; the bare `pytest` entry point needs the root on sys.path.
pythonpath = ["."]
addopts = "-p no:cacheprovider"

# Configuration of the shared hooks for THIS repository. Every consumer carries
# the same table; see README.md "Shared pre-commit hooks".
[tool.pipelines_hooks]
packages = ["pipelines_hooks"]

[tool.pipelines_hooks.complexity]
census_paths = ["pipelines_hooks", "scripts", "tests"]

[tool.pipelines_hooks.kiss]
paths = ["pipelines_hooks", "scripts", "tests"]

[tool.pipelines_hooks.env_sprawl]
allow_files = ["pipelines_hooks/core/settings.py"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

[[tool.mypy.overrides]]
module = ["rdflib", "rdflib.*"]
ignore_missing_imports = true

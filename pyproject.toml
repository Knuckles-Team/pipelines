[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelines-hooks"
version = "2.1.1"
description = "Shared, repository-agnostic pre-commit quality gates for the Knuckles-Team fleet"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "networkx==3.6.1",
    "platformdirs==4.11.8",
    "PyYAML==6.0.3",
]

[project.scripts]
pipelines-hook = "pipelines_hooks.cli:main"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "mypy==2.4.0",
    "pip==25.1.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "setuptools>=84.0.0",
    "types-networkx==3.6.1.20261006",
    "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipelines_hooks*"]

[tool.setuptools.package-data]
pipelines_hooks = ["py.typed", "identity/fleet-default-allowlist.json", "ste/ste_words.toml", "gate_sets.toml", "specs/third_party_names.toml"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Scripts and tests put the repository on sys.path before importing from it.
ignore = ["E402"]

[tool.mypy]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import their shared fixtures as `tests.hooks...`; the bare `pytest` entry point needs the root on sys.path.
pythonpath = ["."]
addopts = "-p no:cacheprovider"

# Configuration of the shared hooks for THIS repository. Every consumer carries
# the same table; see README.md "Shared pre-commit hooks".
[tool.pipelines_hooks]
packages = ["pipelines_hooks"]

[tool.pipelines_hooks.complexity]
census_paths = ["pipelines_hooks", "scripts", "tests"]

[tool.pipelines_hooks.kiss]
paths = ["pipelines_hooks", "scripts", "tests"]

[tool.pipelines_hooks.env_sprawl]
allow_files = ["pipelines_hooks/core/settings.py"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

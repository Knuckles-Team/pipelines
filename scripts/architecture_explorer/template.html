<title>Arbora Architecture Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one zoomable drawing sheet (semantic zoom over strata) beside a spec ledger panel; stacks on phones. */
:root{
  --bg:#f3f5f8; --sheet:#fbfcfd; --surface:#ffffff; --fg:#152033; --muted:#55657d; --faint:#8a97ab;
  --line:#d5dce6; --grid:#e3e8ef; --edge:#5f7593; --accent:#0b6e8a; --focus:#0b6e8a;
  --band-a:#eef2f7; --band-b:#f6f8fb;
  --l-person:#5b6b80; --l-entry:#2f6fb0; --l-gateway:#087f6d; --l-control:#a03a80; --l-core:#5546c0;
  --l-server:#3a5a86; --l-source:#9a6200; --l-delivery:#4d6b35; --l-unmapped:#b42318;
  --s-verified:#1d7a4a; --s-landed:#2560a6; --s-specified:#8a6a12; --s-retired:#7b8190;
  --font-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141d; --sheet:#121a25; --surface:#172131; --fg:#e7edf6; --muted:#a6b3c6; --faint:#748298;
  --line:#2a3647; --grid:#1d2735; --edge:#9fb0c8; --accent:#5cc3dc; --focus:#5cc3dc;
  --band-a:#152030; --band-b:#111a26;
  --l-person:#9aa9bd; --l-entry:#6fa8e6; --l-gateway:#4fd1ae; --l-control:#e07ac4; --l-core:#a99bff;
  --l-server:#86a7d6; --l-source:#e0a640; --l-delivery:#9cc077; --l-unmapped:#ff7a6b;
  --s-verified:#4cc98a; --s-landed:#6aa6ef; --s-specified:#d8b552; --s-retired:#9aa1b0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141d; --sheet:#121a25; --surface:#172131; --fg:#e7edf6; --muted:#a6b3c6; --faint:#748298;
  --line:#2a3647; --grid:#1d2735; --edge:#9fb0c8; --accent:#5cc3dc; --focus:#5cc3dc;
  --band-a:#152030; --band-b:#111a26;
  --l-person:#9aa9bd; --l-entry:#6fa8e6; --l-gateway:#4fd1ae; --l-control:#e07ac4; --l-core:#a99bff;
  --l-server:#86a7d6; --l-source:#e0a640; --l-delivery:#9cc077; --l-unmapped:#ff7a6b;
  --s-verified:#4cc98a; --s-landed:#6aa6ef; --s-specified:#d8b552; --s-retired:#9aa1b0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body)}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-inline:8px;padding-block:8px;gap:6px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px}
.brand h1{font:700 22px/1.1 var(--font-display);letter-spacing:.01em;margin:0;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px;max-width:80ch}
.totals{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:500 12px var(--font-mono);font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 13px var(--font-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;min-height:34px}
.btn:hover{border-color:var(--edge)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,a:focus-visible,input:focus-visible,canvas:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;min-width:0;flex:1 1 320px;font:500 13px var(--font-body)}
.crumbs button{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 4px;font:inherit;border-radius:4px}
.crumbs button[aria-current]{color:var(--fg);font-weight:600;cursor:default}
.crumbs .sep{color:var(--faint)}
.search{position:relative;flex:1 1 260px;max-width:420px;min-width:0}
.search input{width:100%;font:14px var(--font-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:34px}
.results{position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;max-height:min(60vh,440px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgb(0 0 0 / .18);padding:4px}
.results button{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;color:var(--fg);cursor:pointer;font:13px var(--font-body)}
.results button:hover,.results button[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.results .k{font:500 10.5px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);align-self:center}
.results .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .s{grid-column:2;color:var(--muted);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.results .res{display:flex;align-items:stretch;gap:4px;border-radius:6px}
.results .res:hover,.results .res[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.results .res button{background:none;flex:1 1 auto;min-width:0}
.results .res button:hover{background:none}
.results .res a.src{align-self:center;flex:none;font:500 11px var(--font-mono);color:var(--accent);padding:4px 6px;border-radius:4px;text-decoration:none;border:1px solid var(--line)}
.results .res a.src:focus-visible,.results .res button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.results .res .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.results .rid{font:500 12px var(--font-mono);color:var(--accent)}
.results .rrepo{font:500 11px var(--font-mono);color:var(--muted)}
.results .none{padding:10px;color:var(--muted)}
main.work{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:8px;flex:1;min-height:0}
main.work.nopanel{grid-template-columns:minmax(0,1fr)}
main.work.nopanel .panel{display:none}
.canvas{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:420px;height:100%;touch-action:none}
.canvas:fullscreen{border:0;border-radius:0;height:100vh;min-height:0}
.canvas canvas{display:block;width:100%;height:100%;cursor:grab;transition:opacity .18s ease}
.canvas canvas.dragging{cursor:grabbing}
.canvas canvas.fade{opacity:0;transition:none}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoom .btn{width:34px;padding:0;font:600 16px var(--font-mono)}
.fresh{position:absolute;left:10px;top:10px;z-index:2;font:500 11px var(--font-mono);color:var(--muted);background:color-mix(in srgb,var(--sheet) 85%,transparent);border:1px solid var(--line);border-radius:6px;padding:4px 8px;max-width:calc(100% - 70px)}
.fresh summary{cursor:pointer}
.fresh ul{margin:6px 0 0;padding:0;list-style:none;max-height:40vh;overflow:auto;columns:2;column-gap:14px}
.hint{position:absolute;left:10px;bottom:10px;font:500 11px var(--font-body);color:var(--muted);background:color-mix(in srgb,var(--sheet) 85%,transparent);border:1px solid var(--line);border-radius:6px;padding:4px 8px;pointer-events:none;max-width:calc(100% - 70px)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 12px var(--font-body);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;border:2px solid currentColor}
/* Panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;display:flex;flex-direction:column;overflow:hidden;height:100%;min-height:420px}
.panel .ph{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--lc,var(--muted));display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel h2{font:700 21px/1.15 var(--font-display);margin:4px 0 0;text-wrap:balance}
.panel .path{font:12px var(--font-body);color:var(--muted);margin-top:2px}
.pb{overflow:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.pb section{display:flex;flex-direction:column;gap:6px;min-width:0}
.pb h3{font:600 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.desc{margin:0;max-width:65ch}
.stat{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stat div{border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.stat b{display:block;font:600 17px var(--font-mono);font-variant-numeric:tabular-nums}
.stat span{font:500 10.5px var(--font-mono);letter-spacing:.04em;color:var(--muted)}
.stat .v b{color:var(--s-verified)} .stat .l b{color:var(--s-landed)} .stat .s b{color:var(--s-specified)} .stat .r b{color:var(--s-retired)}
.sbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.sbar i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 12px var(--font-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;cursor:pointer;min-height:30px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.code a{font:12px var(--font-mono);color:var(--accent);word-break:break-all;text-decoration:none}
.code a:hover{text-decoration:underline}
.code .repo{font:500 10.5px var(--font-mono);color:var(--faint);margin-right:6px}
.kids button,.links button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--fg);cursor:pointer;font:13px var(--font-body)}
.kids button:hover,.links button:hover{border-color:var(--edge)}
.kids .n,.links .n{font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.specs li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;padding:7px 0;border-top:1px solid var(--line)}
.specs li.flash{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:4px}
.specs .id{font:500 12px var(--font-mono);color:var(--accent);text-decoration:none;word-break:break-all}
.specs .ti{grid-column:2;min-width:0;overflow-wrap:anywhere}
.specs .fa{grid-column:2;font:11px var(--font-mono);color:var(--faint)}
.specs li{cursor:pointer}
.specs button.ti{display:flex;gap:6px;align-items:baseline;text-align:left;background:none;border:0;padding:0;margin:0;color:var(--fg);font:inherit;cursor:pointer}
.specs button.ti .tw{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.specs button.ti .cv{flex:none;color:var(--muted);font:600 12px var(--font-mono);transition:transform .12s ease}
.specs li[data-open="1"] button.ti .cv{transform:rotate(90deg)}
.specs button.ti:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.specs .de{grid-column:2;min-width:0;color:var(--muted);font-size:12.5px;line-height:1.4;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.specs li[data-open="1"] .de{display:none}
.xtools{display:flex;flex-wrap:wrap;gap:6px}
.xbody{grid-column:1/-1;min-width:0;cursor:auto;margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:color-mix(in srgb,var(--accent) 4%,var(--surface));display:flex;flex-direction:column;gap:10px;overflow-wrap:anywhere}
.xbody h4.xh{font:600 10.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
.xbody .xs{min-width:0}
.xbody .md{min-width:0;font-size:13px;line-height:1.5}
.xbody .md>*:first-child{margin-top:0} .xbody .md>*:last-child{margin-bottom:0}
.xbody .md p,.xbody .md ul,.xbody .md ol,.xbody .md blockquote,.xbody .md pre,.xbody .md .tbl{margin:0 0 .6em}
.xbody .md ul,.xbody .md ol{padding-left:1.3em}
.xbody .md h3,.xbody .md h4,.xbody .md h5,.xbody .md h6{font:600 13px var(--font-body);color:var(--fg);letter-spacing:0;text-transform:none;margin:.8em 0 .3em}
.xbody .md code{font:12px var(--font-mono);background:var(--band-a);border-radius:3px;padding:0 3px}
.xbody .md pre{overflow-x:auto;background:var(--band-a);border:1px solid var(--line);border-radius:6px;padding:8px;max-width:100%}
.xbody .md pre code{background:none;padding:0;white-space:pre}
.xbody .md .tbl{overflow-x:auto;max-width:100%}
.xbody .md table{border-collapse:collapse;font-size:12px}
.xbody .md th,.xbody .md td{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
.xbody .md th{background:var(--band-a)}
.xbody .md blockquote{border-left:3px solid var(--line);padding-left:10px;color:var(--muted)}
.xbody .md a,.xbody a{color:var(--accent)}
.xbody .ev{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font:12px var(--font-mono)}
.xbody .ev .k{color:var(--muted);font-weight:500}
.xbody .ev a,.xbody .ev code{word-break:break-all}
.xbody ul.tl{margin:0;padding-left:1.1em;font-size:12.5px}
.xbody details{border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
.xbody details>summary{cursor:pointer;padding:6px 10px;font:600 12.5px var(--font-body);min-height:32px;display:flex;align-items:center}
.xbody details>summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:6px}
.xbody details>.md{padding:0 10px 8px}
.xbody details>.dl{padding:0 10px 4px;font:11.5px var(--font-mono)}
.badge{font:600 10px var(--font-mono);letter-spacing:.05em;padding:2px 6px;border-radius:4px;border:1px solid currentColor;align-self:start;white-space:nowrap}
.badge.VERIFIED{color:var(--s-verified)} .badge.LANDED{color:var(--s-landed)} .badge.SPECIFIED{color:var(--s-specified)} .badge.RETIRED{color:var(--s-retired)}
.more{align-self:flex-start}
.muted{color:var(--muted)}
footer.foot{font:11.5px var(--font-mono);color:var(--faint);display:flex;flex-wrap:wrap;gap:4px 14px}
@media (max-width: 520px){ .stat{grid-template-columns:repeat(3,minmax(0,1fr))} }
.stat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.tools{font:500 12px var(--font-mono);color:var(--muted)}
@media (max-width: 980px){
  main.work{grid-template-columns:minmax(0,1fr)}
  .app{height:auto}
  .canvas{height:72vh;min-height:360px}
  .panel{height:auto;min-height:0}
  .pb{overflow:visible}
  .search{max-width:none;flex-basis:100%}
}
@media (prefers-reduced-motion: reduce){ .canvas canvas{transition:opacity .2s linear} }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Arbora Architecture Explorer</h1>
      <p id="sub">Runtime architecture mapped to spec rows on each default branch.</p>
    </div>
    <div class="totals" id="totals"></div>
  </header>
  <div class="toolbar">
    <button class="btn" id="back" type="button" title="Return to the previous view">&#8592; Back</button>
    <button class="btn" id="up" type="button" title="Zoom out one level (Esc)">&#8593; Up</button>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <div class="search" role="search">
      <input id="q" type="search" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-haspopup="listbox" aria-keyshortcuts="/" autocomplete="off" spellcheck="false" placeholder="Search a capability, spec ID or part  ( / )" aria-label="Search a capability, spec ID or part. Press slash to focus." aria-controls="results">
      <div class="results" id="results" role="listbox" aria-label="Search results" hidden></div>
      <div class="sr" id="qstatus" role="status" aria-live="polite"></div>
    </div>
    <button class="btn" id="theme" type="button" title="Switch light or dark">Theme</button>
  </div>
  <main class="work">
    <div class="canvas" id="wrap">
      <canvas id="cv" tabindex="0" role="img" aria-label="Zoomable architecture map. Use the parts list in the side panel to move with the keyboard."></canvas>
      <div class="zoom">
        <button class="btn" id="zin" type="button" aria-label="Zoom in">+</button>
        <button class="btn" id="zout" type="button" aria-label="Zoom out">&#8722;</button>
        <button class="btn" id="zfit" type="button" aria-label="Show the whole map">&#9635;</button>
        <button class="btn" id="zfull" type="button" aria-label="Full screen (F)" title="Full screen (F)">&#x26F6;</button>
        <button class="btn" id="zpanel" type="button" aria-label="Hide the side panel" aria-pressed="false" title="Hide or show the side panel">&#x25E7;</button>
      </div>
      <details class="fresh" id="fresh"><summary id="freshsum">Built</summary><ul id="freshlist"></ul></details>
      <div class="hint" id="hint">Click a part to zoom in. Scroll or pinch to zoom. Drag to pan. Esc zooms out.</div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
  <div class="legend" id="legend" aria-label="Layer colors"></div>
  <footer class="foot" id="foot"></footer>
</div>

<script>
const PAYLOAD = /*__DATA__*/null;
(function(){
"use strict";
const T = PAYLOAD.tree, META = PAYLOAD.meta;
const ST = ["VERIFIED","LANDED","SPECIFIED","RETIRED"];
const LAYERS = {person:"People and clients",entry:"Front ends",gateway:"Arbora door",control:"Agent control plane",core:"Engine",server:"Engine server",source:"Sources and connectors",delivery:"Delivery and content",unmapped:"Unmapped"};
const nodes = {}, parentOf = {};
(function index(n,p){ nodes[n.id]=n; parentOf[n.id]=p; n.children.forEach(c=>index(c,n.id)); })(T,null);
(function agg(n){ const c={total:0,VERIFIED:0,LANDED:0,SPECIFIED:0,RETIRED:0};
  n.specs.forEach(s=>{c.total++; c[s.status]=(c[s.status]||0)+1;});
  n.children.forEach(ch=>{const k=agg(ch); for(const x in k) c[x]+=k[x];}); n.count=c; return c; })(T);
const $ = id => document.getElementById(id);
const el = (tag, attrs, kids) => { const e=document.createElement(tag); if(attrs) for(const k in attrs){ if(k==="text") e.textContent=attrs[k]; else e.setAttribute(k,attrs[k]); } (kids||[]).forEach(k=>k&&e.appendChild(k)); return e; };
const store = { get(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} } };
const gh = repo => "https://github.com/" + META.owner + "/" + (META.slugs[repo]||repo);
const fmt = n => n.toLocaleString("en-US");
const pathTo = id => { const p=[]; let x=id; while(x){ p.unshift(x); x=parentOf[x]; } return p; };
const reduced = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- world geometry: every node gets a world rectangle ----------
const R = {};      // id -> [x,y,w,h] in world units
const LT = {};     // id -> {s, ox, oy} transform from the node's layout space into world
function place(n, rect, isRoot){
  R[n.id]=rect;
  const L=n.layout; if(!L) return;
  let s, ox, oy;
  if(isRoot){ s=1; ox=0; oy=0; }
  else { const head=rect[3]*0.09, pad=rect[2]*0.01;
    s=Math.min((rect[2]-2*pad)/L.w, (rect[3]-head-pad)/L.h);
    ox=rect[0]+(rect[2]-L.w*s)/2; oy=rect[1]+head+((rect[3]-head-pad)-L.h*s)/2; }
  LT[n.id]={s,ox,oy};
  n.children.forEach(c=>{ const k=L.kids[c.id]; if(k) place(c,[ox+k[0]*s, oy+k[1]*s, k[2]*s, k[3]*s], false); });
}
place(T,[0,0,T.layout.w,T.layout.h],true);

// ---------- canvas + camera ----------
const cv=$("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1, cam={x:0,y:0,k:1}, anim=null, dirty=true, C={};
function readColors(){ const cs=getComputedStyle(document.documentElement); const g=v=>cs.getPropertyValue(v).trim();

  p.catch(()=>detailCache.delete(key)); detailCache.set(key,p); } return detailCache.get(key); }
function linkEl(label,url){ return /^https:\/\/github\.com\//.test(url||"")?el("a",{href:url,target:"_blank",rel:"noopener noreferrer",text:label}):el("code",{text:label}); }
function sect(title,body){ return el("div",{class:"xs"},[el("h4",{class:"xh",text:title}),body]); }
function mdBox(markup){ return safeHtml(el("div",{class:"md"}),markup); }
function detailBody(s,d){ const r=d.rows[s.id], box=document.createDocumentFragment();
  if(!r){ box.append(el("p",{class:"muted",text:"No detail was published for this row."})); return box; }
  box.append(sect("Requirement",r.req?mdBox(r.req):el("p",{class:"muted",text:"No requirement text was found in requirements.md."})));
  if(r.acc) box.append(sect("Acceptance criteria",mdBox(r.acc)));
  const ev=el("div",{class:"ev"},[el("span",{class:"badge "+s.status,text:s.status})]);
  if(r.landed_in.length){ ev.append(el("span",{class:"k",text:"landed_in"})); r.landed_in.forEach(c=>ev.append(linkEl(c.label,c.url))); }
  if(r.verified_by.length){ ev.append(el("span",{class:"k",text:"verified_by"})); r.verified_by.forEach(t=>ev.append(linkEl(t.label,t.url))); }
  if(r.rollup_of.length){ ev.append(el("span",{class:"k",text:"rollup_of"})); r.rollup_of.forEach(id=>ev.append(el("a",{href:"#q="+encodeURIComponent(id),text:id}))); }
  box.append(sect("Status and evidence",ev));
  if(r.tests&&r.tests.length){ const ul=el("ul",{class:"tl"}); r.tests.forEach(t=>ul.append(safeHtml(el("li"),t))); box.append(sect("Test spec lines",ul)); }
  const fl=el("div",{class:"ev"}); d.files.forEach(f=>fl.append(linkEl(f.name,f.url))); box.append(sect("Files on GitHub",fl));
  if(d.docs.length){ const wrap=el("div",{class:"xs"},[el("h4",{class:"xh",text:"Design"})]);
    d.docs.forEach(doc=>{ const det=el("details"), sum=el("summary",{text:doc.label+" ("+doc.name+")"}); det.append(sum); let done=false;
      det.addEventListener("toggle",()=>{ if(det.open&&!done){ done=true; det.append(mdBox(doc.html)); det.append(el("div",{class:"dl"},[linkEl("Open "+doc.name+" on GitHub",doc.url)])); } }); wrap.append(det); });
    box.append(wrap); }
  return box; }
function fillBody(box,s){ box.textContent=""; box.append(el("p",{class:"muted",role:"status",text:"Loading full spec…"}));
  loadDetail(s).then(d=>{ box.textContent=""; box.append(detailBody(s,d)); }).catch(()=>{ box.textContent="";
    const b=el("button",{class:"btn",type:"button",text:"Retry"}); b.onclick=()=>fillBody(box,s);
    box.append(el("p",{class:"muted",role:"alert",text:"The full spec could not be loaded. "}),b,el("div",{class:"ev"},[linkEl("Open requirements.md on GitHub",gh(s.repo)+"/blob/HEAD/specs/"+s.family+"/requirements.md")])); }); }
function resetSpecs(){ const n=nodes[selected]; scope=(n&&n.specs.length)?"node":"tree"; filt="ALL"; limit=150; flashSpec=null; flashIds=new Set(); }
function specRows(n){ if(scope==="node") return n.specs; const out=[]; (function w(x){ out.push(...x.specs); x.children.forEach(w); })(n); return out; }
function statBlock(c){ const d=el("div",{class:"stat"});
  [["total","SPECS",""],["VERIFIED","VERIFIED","v"],["LANDED","LANDED","l"],["SPECIFIED","SPECIFIED","s"],["RETIRED","RETIRED","r"]].forEach(([k,l,cl])=>d.append(el("div",{class:cl},[el("b",{text:fmt(c[k]||0)}),el("span",{text:l})])));
  const bar=el("div",{class:"sbar","aria-hidden":"true"}); if(c.total) ST.forEach(s=>{ if(c[s]) bar.append(el("i",{style:"width:"+(100*c[s]/c.total)+"%;background:var(--s-"+s.toLowerCase()+")"})); }); return [d,bar]; }
function renderPanel(){
  const n=nodes[selected], p=$("panel"); p.textContent=""; p.style.setProperty("--lc","var(--l-"+(n.layer||"core")+")");

  pb.append(el("section",{},[el("h3",{text:"Description"}),el("p",{class:"desc",text:n.description}), n.tools?el("p",{class:"tools",text:n.tools+" served operation tools"}):null]));
  if(n.external){ pb.append(el("section",{},[el("h3",{text:"Outside the ecosystem"}),el("p",{class:"muted",text:"No spec rows are written for this box. The parts connected to it own the rows."})])); }
  else pb.append(el("section",{},[el("h3",{text:"Spec rows in this part and below"}),...statBlock(n.count)]));
  if(n.children.length){ const ul=el("ul",{class:"plain kids"});
    n.children.forEach(c=>{ const b=el("button",{type:"button"},[el("span",{text:c.label}),el("span",{class:"n",text:c.external?"external":fmt(c.count.total)+" · V"+c.count.VERIFIED})]); b.onclick=()=>go(c.id); ul.append(el("li",{},[b])); });
    pb.append(el("section",{},[el("h3",{text:"Parts ("+n.children.length+")"}),ul])); }
  if(n.code.length){ const ul=el("ul",{class:"plain code"});
    n.code.forEach(c=>ul.append(el("li",{},[el("span",{class:"repo",text:n.repo}),el("a",{href:gh(n.repo)+"/tree/HEAD/"+c,target:"_blank",rel:"noopener",text:c})])));
    pb.append(el("section",{},[el("h3",{text:"Code paths"}),ul])); }
  else if(n.repo && n.layer==="source" && !n.children.length){ pb.append(el("section",{},[el("h3",{text:"Repository"}),el("ul",{class:"plain code"},[el("li",{},[el("a",{href:gh(n.repo),target:"_blank",rel:"noopener",text:META.owner+"/"+n.repo})])])])); }
  const host=nodes[parentOf[n.id]||"root"]||T, wired=[], seen=new Set();
  (n.links||[]).forEach(l=>nodes[l]&&wired.push([l,"wired to"]));
  ((host.layout&&host.layout.edges)||[]).forEach(e=>{ if(e.from===n.id&&nodes[e.to]) wired.push([e.to,"→ "+(e.label||"flow")]); if(e.to===n.id&&nodes[e.from]) wired.push([e.from,"← "+(e.label||"flow")]); });
  if(wired.length){ const ul=el("ul",{class:"plain links"});
    wired.forEach(([id,how])=>{ const k=id+how; if(seen.has(k)) return; seen.add(k); const b=el("button",{type:"button"},[el("span",{text:pathTo(id).slice(1).map(i=>nodes[i].label).join(" › ")}),el("span",{class:"n",text:how})]); b.onclick=()=>go(id,{hit:true}); ul.append(el("li",{},[b])); });
    pb.append(el("section",{},[el("h3",{text:"Wired with"}),ul])); }
  if(n.external) return;
  const all=specRows(n), counts={ALL:all.length}; ST.forEach(s=>counts[s]=0); all.forEach(s=>counts[s.status]++);
  const sec=el("section",{id:"specsec"}); sec.append(el("h3",{text:"Spec rows"}));
  const sc=el("div",{class:"chips",role:"group","aria-label":"Scope"});
  [["node","This part ("+fmt(n.specs.length)+")"],["tree","Include parts below ("+fmt(n.count.total)+")"]].forEach(([k,l])=>{ const b=el("button",{class:"chip",type:"button","aria-pressed":String(scope===k),text:l}); b.onclick=()=>{scope=k;filt="ALL";limit=150;renderPanel();}; sc.append(b); });
  const fc=el("div",{class:"chips",role:"group","aria-label":"Status filter"});
  ["ALL",...ST].forEach(s=>{ if(s!=="ALL"&&!counts[s]) return; const b=el("button",{class:"chip",type:"button","aria-pressed":String(filt===s),text:(s==="ALL"?"All":s)+" "+fmt(counts[s])}); b.onclick=()=>{filt=s;limit=150;renderPanel();}; fc.append(b); });
  sec.append(sc,fc);
  const rows=all.filter(s=>filt==="ALL"||s.status===filt);
  if(!rows.length) sec.append(el("p",{class:"muted",text: n.children.length&&scope==="node" ? "No rows sit on this part itself. Choose “Include parts below” to list the rows of its parts." : "No spec rows map to this part."}));
  const ul=el("ul",{class:"plain specs"}), shown=rows.slice(0,limit), items=[];
  // Open or close one row in place, so the list keeps its scroll position.
  function setOpen(it,open){ const {li,s,tg}=it; if(open) openRows.add(s.id); else openRows.delete(s.id);
    li.setAttribute("data-open",open?"1":"0"); tg.setAttribute("aria-expanded",String(open)); tg.setAttribute("aria-label",(open?"Collapse ":"Expand ")+s.id+", "+(s.title||"untitled"));
    const have=li.querySelector(":scope > .xbody");
    if(open&&!have){ const body=el("div",{class:"xbody",id:"x-"+cssId(s.id),role:"region","aria-label":s.id+" full spec"}); li.append(body); fillBody(body,s); }
    else if(!open&&have) have.remove(); }
  let collapse=null; const sync=()=>{ if(collapse) collapse.disabled=!openRows.size; };

    li.append(el("span",{class:"badge "+s.status,text:s.status}), el("a",{class:"id",href:gh(s.repo)+"/blob/HEAD/specs/"+s.family+"/requirements.md",target:"_blank",rel:"noopener",text:s.id}), tg);
    if(s.desc) li.append(el("span",{class:"de",text:s.desc}));

    const it={li,s,tg}; items.push(it); const flip=()=>{ setOpen(it,!openRows.has(s.id)); sync(); };

  sec.append(ul);

  pb.append(sec);
  if(flashSpec){ const li=p.querySelector('[data-spec="'+CSS.escape(flashSpec)+'"]'); if(li) setTimeout(()=>li.scrollIntoView({block:"center"}),30); }
}

// ---------- search ----------
/*__SEARCH__*/
const DESC={}; Object.values(nodes).forEach(n=>n.specs.forEach(r=>{ if(r.desc) DESC[r.id]=r.desc; }));
const SX = ArchSearch.create(PAYLOAD.search,id=>DESC[id]);
const q=$("q"), res=$("results"), qstat=$("qstatus"); let hits=[], cur=-1, activeQ="";
function setCur(i){ const bs=[...res.querySelectorAll(".res")]; cur=i; bs.forEach((b,k)=>b.setAttribute("aria-selected",String(k===i)));
  if(i>=0&&bs[i]){ q.setAttribute("aria-activedescendant",bs[i].id); bs[i].scrollIntoView({block:"nearest"}); } else q.removeAttribute("aria-activedescendant"); }
function showResults(open){ res.hidden=!open; q.setAttribute("aria-expanded",String(open)); }
function doSearch(){ const v=q.value.trim(); res.textContent=""; cur=-1; q.removeAttribute("aria-activedescendant");
  if(v.length<2){ hits=[]; showResults(false); qstat.textContent=""; return; }
  hits=SX.search(v);
  if(!hits.length){ res.append(el("div",{class:"none",text:"No capability, part or spec row matches “"+v+"”."})); showResults(true); qstat.textContent="No results"; return; }
  hits.forEach((h,i)=>{ const isRow=h.kind==="row", n=nodes[h.node];
    const where=pathTo(h.node).slice(1).map(x=>nodes[x].label).join(" › ")||n.label;
    const main=el("button",{type:"button",tabindex:"-1","aria-label":(isRow?h.id+", "+h.title+", ":h.title+", part, ")+h.repo+(isRow?", in "+where:"")},[
      el("span",{class:"k",text:isRow?"spec":"part"}),
      el("span",{class:"t"},[isRow?el("span",{class:"rid",text:h.id+"  "}):null, document.createTextNode(h.title)]),
      el("span",{class:"s"},[el("span",{class:"rrepo",text:h.repo||"architecture"}), document.createTextNode(" · "+where)])]);
    main.onmousedown=e=>e.preventDefault(); main.onclick=()=>choose(i);
    const row=el("div",{class:"res",role:"option",id:"res-"+i,"aria-selected":"false"},[main]);
    if(isRow){ const a=el("a",{class:"src",href:gh(h.repo)+"/blob/HEAD/specs/"+h.family+"/requirements.md",target:"_blank",rel:"noopener",tabindex:"-1","aria-label":"Open "+h.id+" in the "+h.repo+" repository on GitHub",text:"spec \u2197"}); a.onmousedown=e=>e.preventDefault(); row.append(a); }
    res.append(row); });
  showResults(true); setCur(0); qstat.textContent=hits.length+" result"+(hits.length===1?"":"s")+" for "+v; }
// Show the rows of the current search that sit on the chosen part (the picked row first).
function showMatches(h){ const ids=hits.filter(x=>x.kind==="row"&&x.node===h.node).map(x=>x.id);
  if(h.kind==="row"&&!ids.includes(h.id)) ids.unshift(h.id);
  const specs=nodes[h.node].specs; flashIds=new Set(ids); flashSpec=h.kind==="row"?h.id:ids[0]||null;
  scope="node"; filt="ALL"; const idx=Math.max(0,...ids.map(i=>specs.findIndex(s=>s.id===i))); limit=Math.max(150,idx+20); }
function choose(i, keep){ const h=hits[i]; if(!h) return; if(!keep){ showResults(false); q.blur(); } activeQ=q.value.trim();
  go(h.node,{hit:true,keepSpecs:true,open:true}); showMatches(h); renderPanel(); syncHash(); }
q.addEventListener("input",()=>{ if(!q.value.trim()) activeQ=""; doSearch(); });
q.addEventListener("keydown",e=>{ const n=res.querySelectorAll(".res").length;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(res.hidden){ doSearch(); return; } if(!n) return; setCur((cur+(e.key==="ArrowDown"?1:-1)+n)%n); }
  else if(e.key==="Home"&&n&&!res.hidden&&e.ctrlKey){ e.preventDefault(); setCur(0); }
  else if(e.key==="Enter"){ e.preventDefault(); if(res.hidden) doSearch(); if(hits.length) choose(cur<0?0:cur); }
  else if(e.key==="Escape"){ if(!res.hidden||q.value){ e.preventDefault(); e.stopPropagation(); if(!res.hidden) showResults(false); else { q.value=""; activeQ=""; syncHash(); } } else q.blur(); } });
q.addEventListener("blur",()=>setTimeout(()=>{ if(document.activeElement!==q) showResults(false); },150));
q.addEventListener("focus",()=>{ if(q.value.trim().length>=2) doSearch(); });
document.addEventListener("pointerdown",e=>{ if(!res.hidden&&!e.target.closest(".search")) showResults(false); });
document.addEventListener("keydown",e=>{ if(e.key==="/"&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ const t=e.target, tag=t&&t.tagName; if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(t&&t.isContentEditable)) return; e.preventDefault(); q.focus(); q.select(); } });

// ---------- header, theme, boot ----------
(function header(){ const c=T.count, t=$("totals");
  t.append(el("span",{class:"badge",style:"color:var(--fg)",text:fmt(c.total)+" SPECS"})); ST.forEach(s=>{ if(c[s]) t.append(el("span",{class:"badge "+s,text:s+" "+fmt(c[s])})); });
  $("sub").textContent="Runtime architecture mapped to "+fmt(META.rows)+" spec rows from "+META.families+" spec families. "+fmt(META.nodes)+" parts, "+META.connectors+" connectors, "+META.depth+" levels deep. Edge crossings: "+META.crossings.total+".";
  const f=$("foot"); Object.keys(META.heads).filter(r=>META.pages_node[r]).forEach(r=>f.append(el("span",{text:r+"@"+META.heads[r]})));
  f.append(el("span",{text:"+"+(Object.keys(META.heads).length-Object.keys(META.pages_node).filter(r=>META.heads[r]).length)+" more repositories"}));
  const heads=Object.keys(META.heads).sort(), built=META.built_at||"";
  $("freshsum").textContent="Built "+built.replace("T"," ").replace("Z"," UTC")+" from "+heads.length+" repository heads";
  $("fresh").title="Generated from each repository's default branch at the commits listed here.";
  heads.forEach(r=>$("freshlist").append(el("li",{},[el("a",{href:gh(r)+"/commit/"+META.heads[r],target:"_blank",rel:"noopener",text:r+"@"+META.heads[r]})])));
  f.append(el("span",{text:"mapped "+fmt(META.mapped)+" / unmapped "+fmt(META.unmapped)}));
  const lg=$("legend"); Object.keys(LAYERS).forEach(k=>lg.append(el("span",{style:"color:var(--l-"+k+")"},[el("i"),el("span",{style:"color:var(--muted)",text:LAYERS[k]})]))); })();
const rootEl=document.documentElement; const saved=store.get("arbora-arch-theme"); if(saved==="dark"||saved==="light") rootEl.setAttribute("data-theme",saved);
function curDark(){ const t=rootEl.getAttribute("data-theme"); if(t) return t==="dark"; return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches; }
function themeLabel(){ $("theme").textContent=curDark()?"Light theme":"Dark theme"; }
$("theme").onclick=()=>{ const t=curDark()?"light":"dark"; rootEl.setAttribute("data-theme",t); store.set("arbora-arch-theme",t); themeLabel(); readColors(); };

themeLabel(); readColors(); resize();
new ResizeObserver(()=>{ const c=[cam.x+W/(2*cam.k), cam.y+H/(2*cam.k)]; resize(); cam={x:c[0]-W/(2*cam.k), y:c[1]-H/(2*cam.k), k:cam.k}; dirty=true; }).observe(cv);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{dirty=true;});
function applyHash(instant){ const h=ArchSearch.parseHash(location.hash);
  if(h.q){ q.value=h.q; doSearch(); if(hits.length){ activeQ=h.q; const top=hits[0]; go(top.node,{hit:true,keepSpecs:true,open:true,instant}); showMatches(top); renderPanel(); } }
  if(h.node&&nodes[h.node]){ go(h.node,{hit:true,open:true,instant}); if(h.q&&hits.length){ const mine=hits.find(x=>x.node===h.node); if(mine){ showMatches(mine); renderPanel(); } } }
  showResults(!!(h.q&&hits.length)); }
cam=fitCam(R.root,1.01); selected="root"; resetSpecs(); renderPanel(); renderCrumbs();
if(location.hash.length>1) applyHash(true);
window.addEventListener("hashchange",()=>{ const h=ArchSearch.parseHash(location.hash); if((h.node||"root")!==selected||h.q!==activeQ) applyHash(false); });
scheduleSettle(); requestAnimationFrame(frame);
window.__arch={ search:SX.search, get hits(){return hits;}, get cam(){return cam;}, get focus(){return focus;}, get selected(){return selected;}, rect:id=>R[id], meta:META, go, up, hitAt, visible:()=>hitList.length };
})();
